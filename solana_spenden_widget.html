<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solana Spenden-Widget</title>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 32px; max-width: 420px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { color: #9945ff; margin: 0 0 8px 0; font-size: 24px; }
  .header p { color: #8b949e; margin: 0; font-size: 14px; }
  .qr-container { background: #fff; border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 20px; }
  .qr-container img { width: 200px; height: 200px; }
  .address-box { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; word-break: break-all; color: #58a6ff; cursor: pointer; position: relative; }
  .address-box:hover { border-color: #58a6ff; }
  .copy-hint { position: absolute; top: -24px; right: 0; background: #238636; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; opacity: 0; transition: opacity 0.2s; }
  .address-box:hover .copy-hint { opacity: 1; }
  .amount-buttons { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; justify-content: center; }
  .amount-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
  .amount-btn:hover, .amount-btn.active { background: #9945ff; border-color: #9945ff; color: #fff; }
  .pay-btn { width: 100%; background: linear-gradient(90deg, #9945ff, #14f195); border: none; color: #fff; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .pay-btn:hover { opacity: 0.9; }
  .network-badge { display: inline-block; background: #14f19522; color: #14f195; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-top: 12px; }
  .footer { text-align: center; margin-top: 16px; font-size: 11px; color: #484f58; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>💜 Solana Spende</h1>
    <p>Unterstütze unser Projekt mit SOL</p>
  </div>

  <div class="qr-container">
    <!-- QR-Code via QR Server API -->
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=solana:9MwFah8yiGiBV8DMAqzZbcrUszKZnRBM1gzq8XkLK3BM?amount=0.001&label=Spende&message=Vielen%20Dank%20f%C3%BCr%20deine%20Unterst%C3%BCtzung!" alt="Solana Pay QR">
    <div style="margin-top:8px; font-size:12px; color:#333;">Scannen mit Phantom / Solflare</div>
  </div>

  <div style="text-align:center; margin-bottom:12px;">
    <span class="network-badge">⬡ Solana Mainnet</span>
  </div>

  <div class="amount-buttons">
    <button class="amount-btn" onclick="setAmount(0.001)">0.001 SOL</button>
    <button class="amount-btn active" onclick="setAmount(0.01)">0.01 SOL</button>
    <button class="amount-btn" onclick="setAmount(0.1)">0.1 SOL</button>
    <button class="amount-btn" onclick="setAmount(1)">1 SOL</button>
  </div>

  <div class="address-box" onclick="copyAddress()">
    9MwFah8yiGiBV8DMAqzZbcrUszKZnRBM1gzq8XkLK3BM
    <span class="copy-hint">Klicken zum Kopieren</span>
  </div>

  <a href="solana:9MwFah8yiGiBV8DMAqzZbcrUszKZnRBM1gzq8XkLK3BM?amount=0.001&label=Spende&message=Vielen%20Dank%20f%C3%BCr%20deine%20Unterst%C3%BCtzung!" target="_blank">
    <button class="pay-btn">🚀 Mit Wallet bezahlen</button>
  </a>

  <div class="footer">
    Adresse verifiziert • Transaktionen sind öffentlich<br>
    <a href="https://explorer.solana.com/address/9MwFah8yiGiBV8DMAqzZbcrUszKZnRBM1gzq8XkLK3BM" target="_blank" style="color:#58a6ff;">Auf Explorer ansehen</a>
  </div>
</div>

<script>
let currentAmount = 0.01;
function setAmount(amt) {
  currentAmount = amt;
  document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  updateQR();
}
function updateQR() {
  const uri = `solana:9MwFah8yiGiBV8DMAqzZbcrUszKZnRBM1gzq8XkLK3BM?amount=${currentAmount}&label=Spende&message=Vielen%20Dank!`;
  document.querySelector('.qr-container img').src = 
    `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(uri)}`;
  document.querySelector('.pay-btn').parentElement.href = uri;
}
function copyAddress() {
  navigator.clipboard.writeText('9MwFah8yiGiBV8DMAqzZbcrUszKZnRBM1gzq8XkLK3BM');
  const hint = document.querySelector('.copy-hint');
  hint.textContent = '✅ Kopiert!';
  setTimeout(() => hint.textContent = 'Klicken zum Kopieren', 2000);
}
</script>
</body>
</html>
