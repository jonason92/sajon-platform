entation details and reference code for our prototype."}, {"t": "Concepts and Methods for a Librarian of the Web", "au": "Kubek, Mario", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Big Data", "Big data", "Computational intelligence", "Computational Intelligence", "Data Engineering", "Engineering—Data processing"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "The World Wide Web can be considered a huge library that in consequence needs a capable librarian responsible for the classification and retrieval of documents as well as the mediation between library resources and users. Based on this idea, the concept of the “Librarian of the Web” is introduced which comprises novel, librarian-inspired methods and technical solutions to decentrally search for text documents in the web using peer-to-peer technology. The concept’s implementation in the form of an interactive peer-to-peer client, called “WebEngine”, is elaborated on in detail. This software extends and interconnects common web servers creating a fully integrated, decentralised and self-organising web search system on top of the existing web structure. Thus, the web is turned into its own powerful search engine without the need for any central authority. This book is intended for researchers and practitioners having a solid background in the fields of Information Retrieval and Web Mining. ."}, {"t": "Conservation Research in Libraries", "au": "Howell, David; Snijders, Ludo", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Library materials-Conservation and restoration"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "This new series presents and discusses new and innovative approaches used by professionals in library and information practice worldwide. The authors are chosen to provide critical analysis of issues and to present solutions to selected challenges in libraries and related fields, including information management and industry, and education of information professionals. The book series strives to present practical solutions that can be applied in institutions worldwide. It thereby contributes significantly to improvements in the field."}, {"t": "Data Mining", "au": "Cleve, Jürgen; Lämmel, Uwe", "y": "2020", "ty": "book", "src": "", "link": "https://www.degruyter.com/document/doi/10.1515/9783110676273/html", "tags": ["Big Data", "Data Mining"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "Data Mining encompasses methods and algorithms to disclose previously unknown connections within large quantities of data. This book covers the substance of a one-semester university or technical college course and is conceived as a classic textbook. It includes summaries, numerous examples, and practice exercises. The third edition also includes themes related to AI, Big Data, data science, and machine learning."}, {"t": "Des paléographes aux archivistes", "au": "Hamard, Damien", "y": "2020", "ty": "book", "src": "", "link": "https://books.openedition.org/pur/268776", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Deutsche Nationalkataloge: Herausforderungen an das deutsche Bibliothekssystem: Was aus der Perspektive der Digital Humanities zu tun wäre", "au": "Schneider, Ulrich Johannes", "y": "2020", "ty": "article-journal", "src": "ABI-Technik", "link": "https://doi.org/10.1515/abitech-2020-1005", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles; 3.5.2 Développements, problématiques contemporaines", "abs": "Zusammenfassung\nDie Frage, welchen Zweck bibliothekarische Kataloge jenseits der Bestandsdokumentation haben, kann man sowohl aus der Perspektive der Bibliotheken wie aus derjenigen der Forschung aufwerfen. Im System der deutschen wissenschaftlichen Bibliotheken gibt es Kataloge, die regional organisiert sind (Verbundkataloge) und solche, die bestimmte Medien betreffen wie Papyri, Bilder oder Münzen. Andere sind chronologisch orientiert (Verzeichnis der Drucke für das 16., 17. und 18. Jahrhundert). Vor allem diese haben das Erbe des 1943 unvollständig abgebrochenen „Deutschen Gesamtkatalogs“ angetreten und bemühen sich um nationalweit vollständige Nachweise in hoher bibliografischer Qualität. Aus der Sicht der Forschung sind solche Katalogdaten ideale Forschungsdaten, die zur Auswertung im Sinne eines „data mining“ einladen. Allerdings sind die Bibliothekskataloge in Deutschland qualitativ und quantitativ defizitär. Eine genauere Bestandsaufnahme kann nur dann zu ihrer Verbesserung führen, wenn im deutschen Bibliothekssystem das Problem erkannt und Wege gefunden werden, organisatorisch und förderpraktisch die Katalogisierungsleistungen für die Forschung, vor allem der Digital Humanities, besser nutzbar zu machen."}, {"t": "Developing and Maintaining Practical Archives: a How-to-Do-it Manual", "au": "Hunter, Gregory S.", "y": "2020", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Digital humanities for librarians", "au": "Wilson, Emma Annette", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Digital libraries", "Humanities"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines; 1a Intro archivistique, bibliothéconomie et SI", "abs": "Some librarians are born to digital humanities; some aspire to digital humanities; and some have digital humanities thrust upon them. Digital Humanities For Librarians is a one-stop resource for librarians and LIS students working in this growing new area of academic librarianship. The book begins by introducing digital humanities, addressing key questions such as, “What is it?”, “Who does it?”, “How do they do it?”, “Why do they do it?”, and “How can I do it?”. This broad overview is followed by a series of practical chapters answering those questions with step-by-step approaches to both the digital and the human elements of digital humanities librarianship."}, {"t": "Digitization and Digital Archiving: A Practical Guide for Librarians, Second Edition", "au": "Leggett, Elizabeth R.", "y": "2020", "ty": "book", "src": "", "link": "https://rowman.com/ISBN/9781538133347/Digitization-and-Digital-Archiving-A-Practical-Guide-for-Librarians-Second-Edition", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "This second edition has been updated to address new trends and concerns in software. It also addresses questions about preserving materials with no original physical format and preserving media st..."}, {"t": "Décoder les fausses nouvelles et construire son information avec la bibliothèque", "au": "Kintz, Salomé", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Bibliothèques", "Information", "Sciences de l'information", "COLLECTIONS D'ARTICLES ET D'ESSAIS (TYPE DE DOCUMENT)", "Désinformation", "DÉSINFORMATION + MENSONGES (POLITIQUE)", "Éducation aux médias", "ÉDUCATION MÉDIATIQUE", "Formation des utilisateurs (bibliothèques)", "FORMATION DOCUMENTAIRE DES UTILISATEURS + LITTÉRATIE INFORMATIONNELLE (BIBLIOTHÉCONOMIE)", "Infox", "Médias", "MÉDIAS ÉLECTRONIQUES + MÉDIAS NUMÉRIQUES (SOCIOLOGIE)", "PUISSANCE DE PENSÉE + CAPACITÉ DE JUGEMENT (ÉDUCATION)"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "\"Chasseur de fake\", débats, Ateliers infox, Fabrique de l'Info, apprentissage des compétences informationnelles, autant d'actions pilotées par les bibliothèques, universitaires comme de lecture publique. Plus visibles depuis l'attentat contre Charlie Hebdo, et reconnues partenaires de l'éducation aux médias et à l'information (plan 2018), les bibliothèques sont ces \"lieux de confiance\" dans lesquels des professionnels de l'information, compétents et formés, proposent à tous les publics, dans une visée émancipatrice, les clés d'une maîtrise de l'information.\nComment analyser les conditions d'émergence de la désinformation en ligne, comprendre les mécanismes de l'infox ? Comment éduquer aux médias à la bibliothèque ? Que proposer aux publics scolaires et adultes ? Quelle est la place de la bibliothèque dans la formation aux usagers ? Quels services mettre en place ? Les réponses proposées s'organisent autour de trois orientations méthodologiques : un retour sur l'analyse du phénomène, le contexte favorable à saisir pour la communauté professionnelle, des présentations réflexives de pratiques de terrain."}, {"t": "Foundations of library and information science", "au": "Rubin, Richard; Rubin, Rachel G.", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Bibliothekswissenschaft", "Information science", "Library science", "United States"], "br": "1", "coll": "1.5.1 Documentation de base; 3.5.1 Documentation de base", "abs": "Richard E. Rubin’s book has served as the authoritative introductory text for generations of library and information science practitioners, with each new edition taking in its stride the myriad societal, technological, political, and economic changes affecting our users and institutions and transforming our discipline. Rubin teams up with his daughter, Rachel G. Rubin, a rising star in the library field in her own right, for the fifth edition. Spanning all types of libraries, from public to academic, school, and special, it illuminates the major facets of LIS for students as well as current professionals."}, {"t": "Guide to Intelligent Data Science: How to Intelligently Make Use of Real Data", "au": "Berthold, Michael R.; Borgelt, Christian; Höppner, Frank; Klawonn, Frank; Silipo, Rosaria", "y": "2020", "ty": "book", "src": "", "link": "http://link.springer.com/10.1007/978-3-030-45574-3", "tags": ["bioinformatics", "calculus", "classification", "cognition", "data analysis", "databases", "KNIME", "knowledge", "modeling", "pattern recognition", "statistics"], "br": "", "coll": "2c Information Retrieval", "abs": ""}, {"t": "Handbook of research on emerging trends and technologies in library and information science", "au": "Kaushik, Anna; Kumar, Ashok; Biswas, Payel", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Bibliothéconomie", "Technological innovations", "Bibliothekswissenschaft", "Information science", "Informations- und Dokumentationswissenschaft", "Library science", "Sciences de l'information", "Bibliothécaires", "Librarians", "Effect of technological innovations on", "Effets des innovations sur", "Inde", "India", "Innovations", "Technische Innovation"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "The Handbook of Research on Emerging Trends and Technologies in Library and Information Science is a critical research book that examines advancing technologies and new innovations and their influences on library and information sciences for improved best practices. Featuring an array of topics such as digital libraries, distance education, and information literacy, this publication is essential for librarians, knowledge managers, information retrieval specialists, library and information science professionals, information scientists, researchers, web librarians, academicians, educators, IT specialists, and managers."}, {"t": "Informationsethik und Bibliotheksethik: Grundlagen und Praxis", "au": "Rösch, Hermann", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["General", "LANGUAGE ARTS & DISCIPLINES", "Library & Information Science"], "br": "1", "coll": "1.5.1 Documentation de base; 3.5.1 Documentation de base", "abs": "Neben den theoretischen und allgemeinen Grundlagen von Informationsethik und Bibliotheksethik wird das Spektrum ethischer Konflikte und Dilemmata an Beispielen aus der Praxis des Berufsfelds Bibliothek und Information konkret erläutert. Dabei wird deutlich, dass wissenschaftlich fundierte Aussagen der Informationsethik und der Bibliotheksethik grundlegend für die wertbezogene Standardisierung bibliothekarischer Arbeit und äußerst hilfreich für ethisch abgesicherte Entscheidungen im Berufsalltag sind."}, {"t": "Informed societies: why information literacy matters for citizenship, participation and democracy", "au": "Goldstein, Stéphane", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Political aspects", "Social aspects", "Library science", "Information literacy", "Citizenship", "Democracy"], "br": "1", "coll": "1.5.1 Documentation de base; 3.5.2 Développements, problématiques contemporaines", "abs": "This book explains how and why information literacy can help to foster critical thinking and discerning attitudes, enabling citizens to play an informed role in society and its democratic processes."}, {"t": "Knowledge graphs: methodology, tools and selected use cases", "au": "Fensel, Dieter", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["FALLSTUDIEN (DOKUMENTENTYP)", "GRAPHENTHEORIE (MATHEMATIK)", "Information visualization", "Semantic computing", "WISSENSDARSTELLUNG (KÜNSTLICHE INTELLIGENZ)", "WISSENSORGANISATION (KÜNSTLICHE INTELLIGENZ)"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "This book describes methods and tools that empower information providers to build and maintain knowledge graphs, including those for manual, semi-automatic, and automatic construction; implementation; and validation and verification of semantic annotations and their integration into knowledge graphs. It also presents lifecycle-based approaches for semi-automatic and automatic curation of these graphs, such as approaches for assessment, error correction, and enrichment of knowledge graphs with other static and dynamic resources."}, {"t": "Künstliche Intelligenz: Fakten, Chancen, Risiken", "au": "Lenzen, Manuela", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Künstliche Intelligenz", "Intelligence artificielle", "Prognose", "Technikbewertung"], "br": "2", "coll": "2.5 Ouvrages et articles; 1.5.2 Développements, problématiques contemporaines; 3.5.2 Développements, problématiques contemporaines", "abs": ""}, {"t": "Les Archives à l'ère du Numérique : Préservation et Droit à L'oubli.", "au": "Mkadmi, Abderrazak.", "y": "2020", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "Les archives à l’ère du numérique, by Abderrazak Mkadmi, explores the complexities of digital archiving in the modern era. The book addresses the challenges of preserving data intelligently while maintaining its integrity and authenticity. It discusses the impact of digital technologies on the types of documents managed by archives, the practices within the humanities and social sciences, and the management of large data volumes. The work examines the balance between the right to information for future generations and the right to be forgotten, emphasizing privacy and individual freedoms. Aimed at professionals and academics in information sciences, the author, a scholar in the field, provides insights into digital archiving tools and practices."}, {"t": "Les archives électroniques", "au": "Béchard, Lorène; Fuentes Hashimoto, Lourdes; Vasseur, Édouard", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archivage électronique", "archives", "archivio", "Archives électroniques", "elaborazione elettronica dei dati", "elektronische Datenverarbeitung", "traitement électronique des données"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Lesen im digitalen Zeitalter", "au": "Lauer, Gerhard", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Digitalisierung", "Neue Medien", "Lesen"], "br": "2", "coll": "2.5 Ouvrages et articles; 3.5.1 Documentation de base", "abs": ""}, {"t": "Lessons from archives: strategies for collecting sociocultural data in machine learning", "au": "Eun Seo Jo; Gebru, Timnit", "y": "2020", "ty": "chapter", "src": "Proceedings of the 2020 Conference on Fairness, Accountability, and Transparency (FAT* '20)", "link": "https://dl.acm.org/doi/10.1145/3351095.3372829", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Linked data for the perplexed librarian", "au": "Carlson, Scott; Lampert, Cory; Melvin, Darnelle; Washington, Anne", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Information organization", "Semantic Web", "Metadata", "Information retrieval", "Libraries and the Internet", "Standards", "Online library catalogs", "BIBFRAME (Conceptual model)", "Gestion des données (systèmes d'information)", "Linked data", "Linked Data", "Machine-readable bibliographic data", "Web sémantique"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "\"A plain-language introduction to the often intimidating field of linked data and the semantic web\"-- Provided by publisher"}, {"t": "Open access in theory and practice: the theory-practice relationship and openness", "au": "Pinfield, Stephen; Wakeling, Simon; Bawden, David; Robinson, Lyn", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Open access."], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Open Access in Theory and Practice contributes to a better understanding of OA and, as such, should be of great interest to academics, researchers, and students working in the fields of information science, publishing studies, science communication, higher education policy, business, and economics. The book also makes an important contribution to the debate of the relationship between theory and practice in information science, and more widely across different fields of the social sciences and humanities"}, {"t": "Open Heritage Data: an introduction to research, publishing and programming with open data in the heritage sector", "au": "Roued-Cunliffe, Henriette", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Diffusion de la culture", "Données ouvertes", "Erbgut", "Kulturerbe", "Mémoire collective", "Open Data", "Technologies de l'information et de la communication"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Perspektivenwechsel: zwei Disziplinen aus Sicht der Digital Humanities : oder wie sich die Geisteswissenschaften im Digitalen (selbst) finden", "au": "Hodel, Tobias", "y": "2020", "ty": "article-journal", "src": "Zeitschrift für schweizerische Archäologie und Kunstgeschichte = Revue suisse d'art et d'archéologie = Rivista svizzera d'arte e d'archeologia = Journal of Swiss archeology and art history", "link": "https://doi.org/10.5169/seals-882468", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Pragmatic Audiovisual Preservation", "au": "Brewer, Ashley", "y": "2020", "ty": "report", "src": "", "link": "https://www.dpconline.org/docs/technology-watch-reports/2381-pragmatic-audiovisual-preservation-member-preview/file", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Research handbook on human rights and digital technology: global politics, law and international relations", "au": "Wagner, Benjamin; Kettemann, Matthias C.; Vieth, Kilian", "y": "2020", "ty": "book", "src": "", "link": "", "tags": [""], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "In a digitally connected world, the question of how to respect, protect and implement human rights has become unavoidable. This contemporary Research Handbook offers new insights into well-established debates by framing them in terms of human rights. It examines the issues posed by the management of key Internet resources, the governance of its architecture, the role of different stakeholders, the legitimacy of rule making and rule-enforcement, and the exercise of international public authority over users. Highly interdisciplinary, its contributions draw on law, political science, international relations and even computer science and science and technology studies."}, {"t": "Rückschau mit Perspektivprüfung: Ein Kompromissvorschlag in der digitalen Bestandserhaltung", "au": "Naumann, Kai", "y": "2020", "ty": "post-weblog", "src": "", "link": "https://archive20.hypotheses.org/9912", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "Mit offenen Archiven assoziiere ich eine offene Kultur auch in der Weiterentwicklung der fachlichen Verfahren und eine möglichst große Zurückhaltung beim Abgrenzen eigener Überzeugungen von denen der Kolleginnen und Kollegen. Ein Sich-Abgrenzen von Ideen hat nur einen Nutzen, wenn es..."}, {"t": "The shape of data in the digital humanities: modeling texts and text-based resources", "au": "Flanders, Julia; Jannidis, Fotis", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Textes", "Digital Humanities", "Humanités numériques", "Methode", "Bases de données textuelles", "Computerlinguistik", "Datenmodell", "Modélisation des données (informatique)"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "The Social Construction of Risk in Digital Preservation", "au": "Frank, Rebecca D.", "y": "2020", "ty": "article-journal", "src": "Journal of the Association for Information Science and Technology", "link": "https://doi.org/10.1002/asi.24247", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "Digital information is fragile, yet access to digital information over time is a critical underpinning of core values and functions in our society, from open government to research and scholarship. Digital preservation research has focused on identifying technical, economic, and organizational sources of risk and has relied on an assumption that individuals will behave in rational and predictable ways in response to the same information. This article asserts that viewing digital preservation as a process that takes place in complex social contexts is just as important as thinking about digital preservation in terms of technological or economic issues. This is particularly important for understanding how individuals involved in digital preservation construct their understanding of risk because social factors influence how people construct their understanding of, and behave in response to, risk information. The author proposes an eight-factor model for the social construction of risk, which includes: communication, complexity, expertise, organizations, political culture, trust, uncertainty, and vulnerability. The article demonstrates how these factors influence individuals as they construct their understanding of risk in the context of digital preservation and how this in turn affects digital preservation decisions."}, {"t": "The TRUST Principles for digital repositories", "au": "Lin, Dawei; Crabtree, Jonathan; Dillo, Ingrid; Downs, Robert R.; Edmunds, Rorie; Giaretta, David; De Giusti, Marisa; L’Hours, Hervé; Hugo, Wim; Jenkyns, Reyna; Khodiyar, Varsha; Martone, Maryann E.; Mokrane, Mustapha; Navale, Vivek; Petters, Jonathan; Sierman, Barbara; Sokolova, Dina V.; Stockhause, Martina; Westbrook, John", "y": "2020", "ty": "article-journal", "src": "Scientific Data", "link": "https://doi.org/10.1038/s41597-020-0486-7", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "As information and communication technology has become pervasive in our society, we are increasingly dependent on both digital data and repositories that provide access to and enable the use of such resources. Repositories must earn the trust of the communities they intend to serve and demonstrate that they are reliable and capable of appropriately managing the data they hold."}, {"t": "Transformative digital humanities: challenges and opportunities", "au": "Bakalun Mc Aleer, Mary; Deyrup Mestrovic, Marta", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["DH", "digital humanists", "Digital humanities", "humanities computing"], "br": "2", "coll": "2.5 Ouvrages et articles; 1.5.2 Développements, problématiques contemporaines; 3.5.2 Développements, problématiques contemporaines", "abs": "\"Transformative Digital Humanities takes a two-pronged approach to the digital humanities: it examines the distinct kinds of work currently being undertaken in the field, while also addressing current issues in the digital humanities, including sustainability, accessibility, interdisciplinarity, and funding. With contributions from humanities and LIS scholars based in China, Canada, England, Germany, Spain, and the United States, this collection of case studies provides a framework for readers to develop new projects as well as to see how existing projects might continue to develop over time. This volume also participates in the current digital humanities conversation by bringing forward emerging voices that offer new options for cooperation, by demonstrating how the digital humanities can become a tool for activism, and by illustrating the potential of the digital humanities to reexamine and reconstitute existing canons. Transformative Digital Humanities considers what sorts of challenges still exist in the field and suggests how they might be addressed. As such, the book will be essential reading for academics and students engaged in the study of information science and digital humanities. It should also be of great interest to practitioners around the globe\"-- Provided by publisher."}, {"t": "A brief history of electronic document and records management systems and related standards", "au": "Warland, Andrew", "y": "2021", "ty": "post-weblog", "src": "", "link": "https://andrewwarland.wordpress.com/2021/02/11/a-brief-history-of-electronic-document-and-records-management-systems-and-related-standards/", "tags": [""], "br": "", "coll": "1d Records Management", "abs": "Last updated 13 February 2024 This post provides a brief history of electronic document and records management systems, and standards that had an impact on the latter. It notes the following: Early…"}, {"t": "Agir pour l'égalité. Questions de genre en bibliothèque", "au": "Salanouve, Florence", "y": "2021", "ty": "book", "src": "", "link": "", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Ce livre collectif interroge la façon dont le genre permet d'éclairer de nombreuses facettes du métier de bibliothécaire et comment il peut l'inciter à agir en faveur de l'égalité. La thématique est abordée sous un angle triple : les professionnels, ce que le genre fait aux bibliothécaires, les collections, ce que le genre dit des collections, les actions, agir contre les stéréotypes de genre. Un ouvrage indispensable pour « chausser les lunettes du genre » afin de repenser aujourd'hui les bibliothèques et les pratiques professionnelles associées."}, {"t": "Along came google: a history of library digitization", "au": "Marcum, Deanna; Schonfeld, Roger C.", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Google"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "An incisive history of the controversial Google Books project and the ongoing quest for a universal digital library. Libraries have long talked about providing comprehensive access to information for everyone. But when Google announced in 2004 that it planned to digitize books to make the world's knowledge accessible to all, questions were raised about the roles and responsibilities of libraries, the rights of authors and publishers, and whether a powerful corporation should to be the conveyor of such a fundamental public good. Along Came Google traces the history of Google's book digitization project and its implications for us today. Deanna Marcum and Roger Schonfeld draw on in-depth interviews with those who both embraced and resisted Google's plans, from librarians and technologists to university leaders, tech executives, and the heads of leading publishing houses. They look at earlier digital initiatives to provide open access to knowledge, and describe how Google founders Sergey Brin and Larry Page made the case for a universal digital library and drew on their company's considerable financial resources to make it a reality. Marcum and Schonfeld examine how librarians and scholars organized a legal response to Google, and reveals the missed opportunities when a settlement with the tech giant failed. Along Came Google sheds light on the transformational effects of the Google Books project on scholarship and discusses how we can continue to think imaginatively and collaboratively about advancing the widespread digital availability of knowledge."}, {"t": "Approaches to liaison librarianship: innovations in organization and engagement", "au": "Crichton, Chad; Canuel, Robin", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Library science", "Academic libraries", "Liaison librarians"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "\"Liaison librarianship is a well-established system for framing the work and organizational structures of an academic library to effectively meet the needs of faculty and students. But despite its rich history, the precise meaning of liaison librarianship remains somewhat fluid--the size and nature of an academic institution, the library's financial and human resources, and the diversity and size of local programs are only some of the variables that librarians must take into consideration when evaluating a specific liaison model for their library, how to implement it, and how its success will be assessed. Approaches to Liaison Librarianship showcases a number of different implementations of the liaison model, across a range of institutions, and describes in detail many of the tailored programs and services that liaison librarians are so well-positioned to provide\"--Publisher's description"}, {"t": "Archival silences: missing, lost and, uncreated archives", "au": "Moss, Michael S.; Thomas, David", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Access control", "Government information", "Political aspects"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"Archival Silences demonstrates emphatically that archival absences exist all over the globe. The book questions whether benign 'silence' is an appropriate label for the variety of destructions, concealment and absences that can be identified within archival collections. Including contributions from archivists and scholars working around the world, this truly international collection examines archives in Australia, Brazil, Denmark, England, India, Iceland, Jamaica, Malawi, The Philippines, Scotland, Turkey, and the United States. Making a clear link between autocratic regimes and the failure to record often horrendous crimes against humanity, the volume demonstrates that the failure of governments to create records, or to allow access to records, appears to be universal. Arguing that this helps to establish a hegemonic narrative that excludes the 'other', this book showcases the actions historians and archivists have taken to ensure that gaps in archives are filled. Yet the book also claims that silences in archives are inevitable and argues not only that recordkeeping should be mandated by international courts and bodies, but that we need to develop other ways of reading archives broadly conceived to compensate for absences. Archival Silences addresses fundamental issues of access to the written record around the world. It is directed at those with a concern for social justice, particularly scholars and students of archival studies, history, sociology, international relations, international law, business administration and information science\"-- Provided by publisher."}, {"t": "Archives 101", "au": "Hamill, Lois", "y": "2021", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "For volunteers or staff at small organizations, collections management can be a daunting task. Archives 101 is a guidebook for people who care for historical records, photographs, and collections but do not have the appropriate professional training. Lois Hamill provides practical, step-by-step guidance for managing all facets of archival collections, from acquisition, arrangement, and description to storage and security. The book also offers advice on how to utilize PastPerfect software for collections database management. Archives 101 is written for those who manage cultural collections regardless of their professional education or institution type. It has been recommended by archivists, public historians, librarians and museum specialists, from the national to local level, as a comprehensive and practical ready reference handbook. Authoritative yet accessible to all readers, this volume addresses all phases in the process of managing cultural collections including use by researchers, for exhibits, work with other specialists such as conservators or appraisers and more. This handbook is unique in its comprehensiveness; practicality; inclusion of low cost options for tight budgets; discussion of questions to consider which enable the reader to adapt guidance to their specific setting; step-by-step guidance based on accepted theory; inclusion of specific instructions to perform tasks in PastPerfect 5.0, a collection management software; readily available free additional resources for each chapter; and an appendix rich with templates and examples illustrating the text. You'll find information on how to manage a basic digitization project from beginning to end; delivery options for digital files; incorporation of the DACS and Dublin Core descriptive standard(s) resulting in an updated finding aid template; several additional approaches to processing; and incorporation of considerations for donor confidentiality and specific questions for donors of digital records."}, {"t": "Archives and AI: An Overview of Current Debates and Future Perspectives", "au": "Colavizza, Giovanni; Blanke, Tobias; Jeurgens, Charles; Noordegraaf, Julia", "y": "2021", "ty": "article-journal", "src": "Journal on Computing and Cultural Heritage", "link": "https://doi.org/10.1145/3479010", "tags": ["Archives", "artificial intelligence", "machine learning", "recordkeeping"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "The digital transformation is turning archives, both old and new, into data. As a consequence, automation in the form of artificial intelligence techniques is increasingly applied both to scale traditional recordkeeping activities, and to experiment with novel ways to capture, organise, and access records. We survey recent developments at the intersection of Artificial Intelligence and archival thinking and practice. Our overview of this growing body of literature is organised through the lenses of the Records Continuum model. We find four broad themes in the literature on archives and artificial intelligence: theoretical and professional considerations, the automation of recordkeeping processes, organising and accessing archives, and novel forms of digital archives. We conclude by underlining emerging trends and directions for future work, which include the application of recordkeeping principles to the very data and processes that power modern artificial intelligence and a more structural—yet critically aware—integration of artificial intelligence into archival systems and practice."}, {"t": "Archives and human rights", "au": "Boel, Jens; Canavaggio, Perrine; González Quintana, Antonio", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archives", "Droits de l'homme", "Menschenrecht"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"Why and how can records serve as evidence of human rights violations, in particular crimes against humanity, and help the fight against impunity? Archives and Human Rights shows the close relationship between archives and human rights and discusses the emergence, at the international level, of the principles of the right to truth, justice and reparation. This book is both a tool and an inspiration to use archives in defence of human rights\" Provided by publisher."}, {"t": "Bestandserhaltung in Archiven und Bibliotheken.", "au": "Allscher, Thorsten", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Electronic books."], "br": "2", "coll": "2.5 Ouvrages et articles; 3.7.2 Normes et règles", "abs": ""}, {"t": "Bibliotheken: Wegweiser in die Zukunft : Projekte und Beispiele", "au": "Lapp, Erdmute; Sewing, Silke; Zimmermann, Renate; Bredemeier, Willi", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["BIBLIOTHEKSWESEN + BIBLIOTHEKSWISSENSCHAFTEN + BIBLIOTHEKEN", "AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "21e siècle", "Bibliothèques", "Schlagwort", "ZUKUNFTSORIENTIERTE UNTERNEHMENSFÜHRUNG (BETRIEBSWIRTSCHAFT)"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "26 Autoren, national und international bekannt und anerkannt, alle dem Bibliothekswesen und -wissen verbunden, berichten aus ihrer Praxis mit den verschiedenen Facetten der heutigen Bibliotheken – seien es Universitäts-, Fach- oder Stadtteilbibliotheken.\n\nFaszinierend zu sehen ist, dass dieses breite Spektrum der AnbieterInnen in manchen Punkten dieselben Herausforderungen erlebt, andererseits aufgrund unterschiedlicher Rahmenbedingen, nicht zuletzt der finanziellen Möglichkeiten, und sehr verschiedener Zielgruppen eine Vielfalt von Lösungsansätzen präsentiert.\n\nTeils hochwissenschaftlich, teils pragmatisch bürgernah findet sich eine Aufsatzsammlung gespeist aus Best-Practice-Berichten, direkt zum Nachmachen oder Anregenlassen für die eigene Situation.\n\nAngesprochen fühlen sollten sich alle, die in oder mit Bibliotheken gleich welcher Couleur arbeiten oder auch als Nutzer einen Blick hinter die Kulissen werfen wollen."}, {"t": "Book wars: the digital revolution in publishing", "au": "Thompson, John Brookshire", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Digitale Revolution", "Buchherstellung", "Buchmarkt", "Livres numériques", "Publications électroniques", "Technischer Fortschritt", "Verlag"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "This book tells the story of the turbulent decades when the book publishing industry collided with the great technological revolution of our time. From the surge of ebooks to the self-publishing explosion and the growing popularity of audiobooks, Book Wars provides a comprehensive and fine-grained account of technological disruption in one of our most important and successful creative industries."}, {"t": "Born digital archive cataloguing and description", "au": "Bunn, Jenny", "y": "2021", "ty": "report", "src": "", "link": "https://www.dpconline.org/docs/technology-watch-reports/2468-born-digital-archive-cataloguing-and-description/file", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Des cultures aux pratiques informationnelles: approches, enjeux, diversité des pratiques informationnelles", "au": "Serres, Alexandre; Liquète, Vincent; Delamotte, Eric", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Communication orale", "Culture de l'information", "Sciences de l'information Étude et enseignement"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Issu du séminaire de réflexion d'un groupe de chercheurs en sciences de l'information et de la communication, cet ouvrage n'est pas un état de l'art des recherches sur les pratiques informationnelles. Plus modestement, il cherche à montrer une double diversité : d'une part, la richesse et la profusion des approches, des réflexions et des travaux sur la notion même de pratique informationnelle, ses enjeux épistémologiques, méthodologiques ; d'autre part, la diversité des milieux (élèves, chercheurs, jeunes), des types de pratiques (d'information, médiatiques, numériques), des représentations et conditionnements (le genre, la discipline scientifique...), des enjeux éducatifs (l'esprit critique) liés aux pratiques informationnelles."}, {"t": "Digitization and digital archiving : a practical guide for librarians", "au": "Leggett, Elizabeth R.", "y": "2021", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "\"This second edition has been updated to address new trends and concerns in software. It also addresses questions about preserving materials with no original physical format and preserving media storage devices as important artifacts in themselves.\"– Provided by publisher."}, {"t": "Essai sur la bibliothèque: volonté de savoir et monde commun", "au": "Le Marec, Joëlle", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "France", "Bibliothèques", "Frankreich", "21e siècle (début)", "Geschichte 2000-2020"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Les bibliothèques sont entrées depuis bientôt un demi-siècle dans une forme de modernité marquée par une attention soutenue aux publics, notamment grâce au service Etudes et Recherche de la Bibliothèque publique d'information. L'intérêt porté aux usagers des services, par des enquêtes régulières et diversifiées de montrer que la bibliothèque n'est pas seule l'interaction entre des personnes et des documents, elle constitue aussi un espace social à part entière à la croisée d'intentions politiques - et d'aménagements adaptés aux publics envisagés ou constatés - et de citoyennetés ordinaires, de comportements individuels, de parcours indémêlables entre les populations, les générations, les objectifs et les attachements.\nDans cet essai, Joëlle Le Marec réalise la synthèse personnelle, sensible et vivante, d'années d'enquêtes auprès des publics de bibliothèques et de musées. Elle lance un appel à la \" ré-institutionnalisation \" de la bibliothèque comme un lieu solide dans une société toujours plus liquide, ancré dans des pratiques et sociabilités de savoirs multiples. Les recherches de Joëlle Le Marec portent sur la condition du public des institutions, l'expression culturelle des sciences, les cultures de l'enquête, et relèvent des sciences en société, de la muséologie et de l'étude des pratiques ordinaires dans les démarches de connaissance.\nDans ses publications, elle s'est attachée à étudier l'articulation entre pratiques de savoirs, souci de soi et milieu de vie."}, {"t": "Future directions in digital information: predictions, practice, participation", "au": "Baker, David; Ellis, Lucy; Baker, David", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["DIGITALE DOKUMENTE + ELEKTRONISCHE DOKUMENTE (BIBLIOTHEKSWESEN)", "Digitalisierung", "ELEKTRONISCHE ARCHIVIERUNG", "ELEKTRONISCHE BIBLIOTHEKEN (BIBLIOTHEKSWESEN)", "AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "Technologies de l'information et de la communication", "ELEKTRONISCHE INFORMATIONSVERSORGUNG (BIBLIOTHEKSWESEN)", "Gestion électronique de documents", "Bibliothèques numériques", "Sciences de l'information", "BENUTZERSCHULUNG + INFORMATIONSKOMPETENZ (BIBLIOTHEKSWESEN)", "DIGITALISIERUNG (SOZIOLOGIE)", "INFORMATIONSVERMITTLUNG (BIBLIOTHEKSWESEN)", "Informationswirtschaft", "Société numérique"], "br": "1", "coll": "1. Informationswissenschaften / Sciences de l'information", "abs": ""}, {"t": "Grundkurs Künstliche Intelligenz: eine praxisorientierte Einführung", "au": "Ertel, Wolfgang", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Künstliche Intelligenz"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "In diesem Buch werden alle Teilgebiete der KI kompakt, leicht verständlich und anwendungsbezogen vorgestellt. Der Autor kennt das Gebiet nicht nur bestens aus Forschung und praktischer Anwendung, sondern engagiert sich auch erfolgreich in der Lehre. Die Themen reichen von der klassischen Logik über das Schließen mit Unsicherheit und maschinelles Lernen bis hin zu Anwendungen wie Diagnosesysteme, lernfähige Roboter oder Kreativität in der KI."}, {"t": "Histoire des bibliothèques: D'Alexandrie aux bibliothèques virtuelles", "au": "Barbier, Frédéric", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["History", "Libraries", "Libraries and society"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "La question des bibliothèques, comme plus largement celle de l'information, alors que nous sommes plongés dans la « troisième révolution du livre », est bien l'une des interrogations de civilisation essentielles posées en notre début de IIIe millénaire. De l'Antiquité classique aux bibliothèques des grands monastères carolingiens, puis à la bibliothèque des rois de France, à celle de Mathias Corvin, à la Bibliothèque vaticane et aux monumentales collections italiennes et allemandes, cette histoire met en jeu des perspectives d'ordre intellectuel et scientifique, mais aussi politique : la bibliothèque est signe de distinction pour un prince qui sera autant le prince des muses que le prince des armes. L'histoire des bibliothèques est directement articulée avec l'histoire de la pensée, des idées, de la politique, de l'information, voire de l'architecture et de l'urbanisme. En adoptant un cadre chronologique large et en insistant sur la perspective comparatiste, l'auteur envisage la thématique en fonction des transformations du système général des médias au cours des siècles. Introduction. La bibliothèque : les mots et les choses Chapitre 1. Les origines antiques Chapitre 2. Le temps de Dieu (VIe siècle-968) Chapitre 3. Émergence de la modernité (Xe-XIVe siècle) Chapitre 4. De Vaucluse à Kronstadt : le temps de l'homme (1338-1542) Chapitre 5. L'innovation baroque (1542-1627) Chapitre 6. Les bibliothèques et l'invention de l'absolutisme (1627-1719) Chapitre 7. L'utilité comme impératif (1719-1789) Chapitre 8. Le public et les bibliothèques, entre révolution et industrialisation 1 (1789-1851) Chapitre 9. Le public et les bibliothèques, entre révolution et industrialisation 2 (1851-1914) Conclusion. Hier et demain : crises et mutations du XXe siècle Bibliographie sélective"}, {"t": "Information technology for librarians and information professionals", "au": "Smith, Jonathan M.", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "BIBLIOTHEKSDIENSTLEISTUNGEN (BIBLIOTHEKSWESEN)", "Information technology", "Technologies de l'information et de la communication", "BENUTZERSCHULUNG + INFORMATIONSKOMPETENZ (BIBLIOTHEKSWESEN)", "Informationstechnik", "Innovations technologiques", "Bibliothécaires", "Documentalistes", "Effect of technological innovations on", "Libraries", "BIBLIOTHEKSEINRICHTUNGEN + BIBLIOTHEKSTECHNOLOGIE (BIBLIOTHEKSWESEN)", "COMPUTERANWENDUNGEN", "COMPUTERSYSTEME", "INFORMATIONSSYSTEME (INFORMATIK)", "Knowledge workers", "Library employees", "Systèmes informatiques"], "br": "1", "coll": "1.5.1 Documentation de base; 3.5.1 Documentation de base", "abs": "This comprehensive primer introduces information technology topics foundational to many services offered in today’s libraries and information centers. Written by a librarian, it clearly explains concepts familiar to the I.T. professional with an eye toward practical applications in libraries for the aspiring technologist. Chapters begin with a basic introduction to a major topic then go into enough technical detail of relevant technologies to be useful to the student preparing for library technology and systems work or the professional needing to converse effectively with technology experts. Many chapters also present current issues or trends for the subject matter being discussed.\n\nThe twelve chapters cover major topics such as technology support, computer hardware, networking, server administration, information security, web development, software and systems development, emerging technology, library management technologies, and technology planning."}, {"t": "Klares Bekenntnis für faire Rahmenbedingungen beim E-Lending in Bibliotheken. Deutscher Bibliotheksverband begrüßt Koalitionsvertrag der Ampelkoalition", "au": "Deutscher Bibliotheksverband e.V. (dbv) •", "y": "2021", "ty": "document", "src": "", "link": "https://www.bibliotheksverband.de/sites/default/files/2021-11/PM_dbv%20zum%20Koalitionsvertrag_final.pdf", "tags": [""], "br": "", "coll": "Exemples-Advocacy", "abs": ""}, {"t": "Knowledge Justice: Disrupting Library and Information Studies Through Critical Race Theory", "au": "Leung, Sofia Y.; López-McKnight, Jorge R.", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Information science", "Library science", "Critical pedagogy", "Critical pedagogy-United States", "Information science-Moral and ethical aspects-United States", "Library science-Moral and ethical aspects-United States", "Minorities in library science", "Minorities in library science-United States", "Social justice", "Social justice-United States", "United States-Race relations-Philosophy"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines; 1a Intro archivistique, bibliothéconomie et SI", "abs": "Black, Indigenous, and Peoples of Color reimagine library and information science through the lens of critical race theory."}, {"t": "La bibliothèque: une approche politique adaptée au territoire", "au": "Jacquet, Amandine; Poissenot, Claude; Etienne, Nathalie", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Politique culturelle", "Bibliothèques publiques"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines; 1a Intro archivistique, bibliothéconomie et SI", "abs": ""}, {"t": "La gestion documentaire au coeur des processus d'affaires : valider, protéger, exploiter et pérenniser l'information dans l'environnement numérique", "au": "Ott, Florence", "y": "2021", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "1d Records Management", "abs": ""}, {"t": "Les stratégies de transformation des bibliothèques", "au": "Accart, Jean-Philippe", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "Bibliothéconomie", "Bibliothèques", "Informationsdienstleister", "Société numérique", "Innovations technologiques", "21e siècle (début)", "Planification stratégique", "Technische Innovation", "Changement social", "Sozialer Wandel"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Les bibliothèques, dans un objectif constant d'adaptation, adoptent différentes stratégies de transformation. Ces stratégies montrent un souhait évident d'être en adéquation avec l'air du temps, tout en gardant les principes de base qui soutiennent leur action au quotidien et qui font qu'elles existent toujours. Véritable synthèse et aide pour les bibliothécaires et professionnels de l'information, cet ouvrage développe quatre grandes stratégies.\nLa première met en avant la compréhension de l'environnement et de la société, avec les changements organisationnels qui touchent les institutions culturelles (publiques ou privées), et l'émergence du \"lieu bibliothèque\". La seconde montre combien les méthodes de management évoluent en leur sein (démarche participative, bienveillance, empathie) avec un accent sur la gestion par projet. La troisième stratégie s'intéresse à l'intégration de nouveaux outils documentaires pour mieux toucher les publics.\nEnfin, la quatrième développe un aspect essentiel et indispensable qu'est le marketing des bibliothèques."}, {"t": "Les technologies du faux : un état des lieux", "au": "Deschamps, Christophe", "y": "2021", "ty": "document", "src": "", "link": "https://www.outilsfroids.net/?mdocs-file=12764", "tags": [""], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "« En trois ans, le périmètre d’action des technologies du faux s’est étendu de manière démesuré, tiré à la fois par le besoin d’expérimentation des chercheurs, par le lancement d’offres commerciales (notamment les « so called » metavers) ou par les attentes et inquiétudes des secteurs liés à la Défense et au renseignement étatiques (tromper/détecter la tentative de tromperie).\n\nLe domaine du fake (ou a minima du faux) s’est donc étendu à tous les types d’imagerie, qu’il s’agisse de nos photos de famille, d’imagerie satellite ou de clichés médicaux. La voix n’y échappe pas non plus, pas plus que la génération de texte et c’est à un déluge de faux auquel nous serons bientôt soumis. Pas forcément dans un objectif de manipulation d’ailleurs, puisque nombre de ces « synthetic media » sont conçus comme des matériaux d’entraînement pour l’intelligence artificielle, notamment dans la prédiction météorologique ou l’analyse d’images médicales. Pour autant il est évident que de nombreux usages auront également pour but la manipulation, la tromperie, l’intoxication,…\nDans une étude rédigée pour l’Observatoire Stratégique de l’Information je tente un état des lieux de ces technologies du faux dont l’impact sera de plus en plus sensible dans le réel. Car le faux n’est pas l’irréel… »"}, {"t": "Libraries and their architecture in the 21st century", "au": "Miersch-Süß, Ines", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "21e siècle", "Bibliothèques", "DIGITALISIERUNG (SOZIOLOGIE)", "Informationsgesellschaft", "INFORMATIONSGESELLSCHAFT (SOZIOLOGIE)", "EINUNDZWANZIGSTES JAHRHUNDERT N. CHR", "ARCHIVGEBÄUDE, BIBLIOTHEKSGEBÄUDE (ARCHITEKTUR)", "ABBILDUNGEN UND BILDWERKE (DOKUMENTENTYP)", "Anforderung", "Architecture publique", "ARCHITEKTUR DES EINUNDZWANZIGSTEN JAHRHUNDERTS", "Bibliotheksbau", "GEMEINSAMES LERNEN (UNTERRICHT)", "Geschichte 2000-2021", "LERNMILIEU (ERZIEHUNG)", "PROJEKTIERUNG, ENTWURF, PLANUNG (ARCHITEKTUR)", "WISSENSSOZIOLOGIE"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Libraries have quietly changed over the last 20 years. They have adapted early and consciously to the changes of digitalization, they have recognized the changed need of their users for collaborative work and derived new spatial concepts from this. Transparency and access to information, knowledge and encounters are the prerequisites for holistic social development. It is the challenge of the 21st century as the information age. This book presents the latest developments in library architecture as well as the way scientists and architects are meeting this challenge."}, {"t": "Libraries, Archives, and Museums: An Introduction to Cultural Heritage Institutions through the Ages", "au": "Stauffer, Suzanne M.", "y": "2021", "ty": "book", "src": "", "link": "https://rowman.com/ISBN/9781538118894/Libraries-Archives-and-Museums-An-Introduction-to-Cultural-Heritage-Institutions-through-the-Ages", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "The work provides a thorough background for students and professionals in the fields of library, archives, and museum resource management, preservation, and administration."}, {"t": "Libraries, digital information, and COVID: practical applications and approaches to challenge and change", "au": "Baker, David; Ellis, Lucy", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Electronic information resources", "Information technology", "Libraries"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "COVID-19 is profoundly affecting the ways in which we live, learn, plan, and develop. What does COVID-19 mean for the future of digital information use and delivery, and for more traditional forms of library provision? Libraries, Digital Information, and COVID gives immediate and long-term solutions for librarians responding to the challenge of COVID-19. The book helps library leaders prepare for a post-COVID-19 world, giving guidance on developing sustainable solutions."}, {"t": "Praxishandbuch Forschungsdatenmanagement", "au": "Putnings, Markus; Neumann, Janna; Neuroth, Heike", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["DIGITALE DOKUMENTE + ELEKTRONISCHE DOKUMENTE (BIBLIOTHEKSWESEN)", "ELEKTRONISCHE ARCHIVIERUNG", "Archivage électronique", "Datenmanagement", "DATENSICHERHEIT + DATENSCHUTZ (BETRIEBSSYSTEME)", "Données de la recherche", "FACHLICHE NACHSCHLAGEWERKE + FACHLEXIKA + HANDBÜCHER (DOKUMENTENTYP)", "Forschungsdaten", "OPEN ACCESS (WISSENSCHAFTLICHES PUBLIZIEREN)", "Recherche", "TECHNISCHE BETRIEBSFÜHRUNG", "WISSENSCHAFTLICHE ERGEBNISSE UND DATEN", "WISSENSCHAFTLICHE EXPERIMENTE + WISSENSCHAFTLICHE VERSUCHE", "WISSENSCHAFTLICHE FORSCHUNG", "WISSENSCHAFTSFÖRDERUNG + FORSCHUNGSFÖRDERUNG"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Rechercher l'information stratégique sur le web: sourcing, veille et analyse à l'heure de la révolution numérique", "au": "Mesguich, Véronique", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Internet", "World Wide Web", "Technologies de l'information et de la communication", "Recherche", "Recherche de l'information", "Internet searching", "Information retrieval", "GESTION DE L'INFORMATION (GESTION DE SYSTÈMES INFORMATIQUES)", "Guides pratiques et mémentos", "INTERNET + WORLD WIDE WEB (RÉSEAUX INFORMATIQUES)", "INTERROGATION + REQUÊTES (SYSTÈMES D'INFORMATION)", "Recherche documentaire", "Recherche sur Internet", "RECHERCHES BIBLIOGRAPHIQUES ET RECHERCHES D'INFORMATIONS (MÉTHODES DE TRAVAIL SCIENTIFIQUE)", "STOCKAGE ET RECHERCHE DE L'INFORMATION (SYSTÈMES D'INFORMATION)", "TECHNOLOGIES DE L'INFORMATION + TECHNOLOGIES DE LA COMMUNICATION (TÉLÉCOMMUNICATIONS)", "Veille informationnelle"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Guide pratique pour apprendre à repérer, maîtriser et analyser l'information économique sur le web. A l'aide de cas concrets, l'auteure explique comment rechercher, analyser puis utiliser cette information et évoque les évolutions à prévoir en termes de recherche d'information."}, {"t": "Record-making and record-keeping in early societies", "au": "Yeo, Geoffrey", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Management", "Archives", "Geschichte", "Records", "History", "Registratur", "Hochkultur"], "br": "2", "coll": "2.5 Ouvrages et articles; 1d Records Management", "abs": ""}, {"t": "Recordkeeping in international organizations: archives in transition in digital, networked environments", "au": "Boel, Jens; Sengsavang, Eng", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Management", "Administration", "Archives", "Datenmanagement", "Electronic records", "International agencies", "Internationale Organisation"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"Recordkeeping in International Organizations offers an important treatment of international organizations from a recordkeeping perspective, while also illustrating how recordkeeping can play a vital role in our efforts to improve global social conditions\"-- Provided by publisher."}, {"t": "Rival records management models in an era of partial automation", "au": "Lappin, James; Jackson, Tom; Matthews, Graham; Ravenwood, Clare", "y": "2021", "ty": "article-journal", "src": "Archival Science", "link": "https://doi.org/10.1007/s10502-020-09354-9", "tags": ["Archival theory", "Business Information Systems", "Business Process Management", "Database Management", "Database Management System", "Information Model", "Model Theory", "Records continuum theory", "Records management"], "br": "", "coll": "1d Records Management", "abs": "Two rival records management models emerged during the 1990s. Duranti’s model involved moving records out of business applications into a repository which has a structure/schema optimised for recordkeeping. Bearman’s model involved intervening in business applications to ensure that their functionality and structure/schema are optimised for record keeping. In 2013 the US National Archives and Records Administration began asking Federal agencies to schedule important email accounts for permanent preservation. This approach cannot be mapped to either Duranti or Bearman’s model. A third records management model has therefore emerged, a model in which records are managed in place within business applications even where those applications have a sub-optimal structure/schema. This model can also be seen in the records retention features of the Microsoft 365 cloud suite. This paper asks whether there are any circumstances in which the in-place model could be preferable to Duranti and Bearman’s models. It explores the question by examining the evolution of archival theory on the organisation of records. The main perspectives deployed are those of realism and of records continuum theory. The paper characterises the first two decades of this century as an era of partial automation, during which organisations have had a general capability to automate the assignment of business correspondence to a sub-optimal structure/schema (that of their email system and/or other messaging system) but not to an optimal structure/schema. In such an era any insistence on optimising the structure/schema within which correspondence is managed may paradoxically result in a reduction in recordkeeping efficiency and reliability."}, {"t": "The collector and the collected: decolonizing area studies librarianship", "au": "Browndorf, Megan; Pappas, Erin; Arays, Anna", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Wissenschaftliche Bibliothek", "Entkolonialisierung", "Regionalstudien"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "The Collector and the Collected: Decolonizing Area Studies Librarianship explores the paradigm of \"area studies\" - a way of supporting regionally-focused collecting, processing, and liaison work - in the academic library through an explicitly anti-colonial lens. By centering debates on the politics and problems of area studies in libraries, we consider how libraries are rethinking their approaches to collecting global resources and serving our constituencies in a contemporary and progressive manner. While libraries need to address the problematic nature of area studies, we see a larger academic trend in the push for \"global\" initiatives which ignore historically, linguistically, and culturally significant sites of difference, inequity, and asymmetrical power relations."}, {"t": "The digital humanities coursebook: an introduction to digital methods for research and scholarship", "au": "Drucker, Johanna", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Research", "Humanities", "Digital humanities", "Digital media"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"The Digital Humanities Coursebook provides critical frameworks for the application of Digital Humanities tools and platforms, which have become an integral part of work across a wide range of disciplines. Written by an expert with twenty years of experience in this field, the book is focused on the principles and fundamental concepts for application, rather than on specific tools or platforms. [...]\""}, {"t": "The library: a fragile history", "au": "Pettegree, Andrew; Weduwen, Arthur der", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "Geschichte", "History", "Libraries"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Famed across the known world, jealously guarded by private collectors, built up over centuries, destroyed in a single day, ornamented with gold leaf and frescoes, or filled with bean bags and children’s drawings—the history of the library is rich, varied, and stuffed full of incident. In The Library, historians Andrew Pettegree and Arthur der Weduwen introduce us to the antiquarians and philanthropists who shaped the world’s great collections, trace the rise and fall of literary tastes, and reveal the high crimes and misdemeanors committed in pursuit of rare manuscripts. In doing so, they reveal that while collections themselves are fragile, often falling into ruin within a few decades, the idea of the library has been remarkably resilient as each generation makes—and remakes—the institution anew."}, {"t": "Theorien und Methoden der Geschichtswissenschaft", "au": "Jordan, Stefan", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Geschichte", "Anthropologie", "Lehrbuch", "Geschichtswissenschaft", "1945", "Alltagsgeschichte", "Basiswissen", "Begriffsgeschichte", "Einführung", "Epochenwende", "Erinnerungskultur", "Frauengeschichte", "Geschichte studieren", "Geschichte und Gesellschaft", "Geschichtsbewusstsein", "Geschichtsdidaktik", "Geschichtsphilosophie", "Geschichtstheorie", "Geschlechtergeschichte", "Gesellschaftsgeschichte", "Grundbegriffe", "Historismus", "Kulturgeschichte", "Kulturwissenschaft", "Max Weber", "Mediengeschichte", "Mentalitätsgeschichte", "Methoden in der Geschichte", "Methodenlehre", "politische Geschichte", "Rekonstruktion", "Schule der Annales", "Sozialgeschichte", "Studium", "Theorien der Geschichte", "Volksgeschichte", "Wirtschaftsgeschichte", "Wissensvermittlung", "Zeitgeschichte"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Was macht Geschichte als Wissenschaft aus? Was meint man, wenn man von \"der\" Geschichte spricht? Und: Wer macht sie eigentlich, die Geschichte?    Dieser Band bietet einen Einstieg in die Geschichte des Geschichtsdenkens und der Geschichtswissenschaft. Er gibt einen anschaulichen Überblick über die Arbeitsweise des Historikers und regt zu eigenem Nachdenken an. Denn wer sich damit beschäftigt, was andere unter Geschichte begreifen, macht sich auch ein klares Bild davon, was er selbst darunter versteht.    Aus dem Inhalt:  - Was ist Geschichte? Was ist Geschichtswissenschaft?  - Grundbegriffe zur Theorie und Methode geschichtswissenschaftlichen Arbeitens  - Neueste Tendenzen der Geschichtstheorie  - Themenbezogene Auswahlbibliographien mit weiterführender Literatur, Aus: lehrerbibliothek.de - Dieter Bach - 08.12.2018     [...] Insbesondere Studienanfänger führt das bereits in 4. Aufl. erscheinende Lehrbuch auf die Wissensebenen der Geschichtswissenschaft, deren Theorien und Methoden in Einführungsveranstaltungen häufig leider nur unzureichend thematisiert werden. [...]    Aus: sehepunkte.de 8 (2008), Nr. 12 , Benjamin Steiner, 15.12.2008     Dieses Buch kann gleichwohl als sinnvolle Ergänzung der Studienliteratur bezeichnet werden. Die didaktische Hinführung zu mehr Theoriebewusstsein ist in der Ausbildung zum Historiker unerlässlich. Sucht man nach einer problemorientierten Einführung in die wichtigsten Methodendebatten der letzten 200 Jahre, ist der Griff zu Jordans Buch zu empfehlen.  » Zum Volltext der Rezension"}, {"t": "Trust and records in an open digital environment", "au": "Stančić, Hrvoje", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Bibliothéconomie", "Cloud computing", "data protection", "digital technology", "information profession", "information storage", "Informatique en nuage", "Protection des données", "Security measures", "Stockage de l'information", "Technologies numériques"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Trust and Records in an Open Digital Environment explores issues that arise when digital records are entrusted to the cloud and will help professionals to make informed choices in the context of a rapidly changing digital economy. Showing that records need to ensure public trust, especially in the era of alternative truths, this volume argues that reliable resources, which are openly accessible from governmental institutions, e-services, archival institutions, digital repositories, and cloud-based digital archives, are the key to an open digital environment. The book also demonstrates that current established practices need to be reviewed and amended to include the networked nature of the cloud-based records, to investigate the role of new players, like cloud service providers (CSP), and assess the potential for implementing new, disruptive technologies like blockchain. Stančić and the contributors address these challenges by taking three themes - state, citizens, and documentary form - and discussing their interaction in the context of open government, open access, recordkeeping, and digital preservation. Exploring what is needed to enable the establishment of an open digital environment, Trust and Records in an Open Digital Environment should be essential reading for data, information, document, and records management professionals. It will also be a key text for archivists, librarians, professors, and students working in the information sciences and other related fields."}, {"t": "Understanding human information behavior: when, how, and why people interact with information", "au": "St Jean, Beth; Gorham, Ursula; Bonsignore, Elizabeth", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Bibliothéconomie", "INFORMATIONSWISSENSCHAFTEN + DOKUMENTATIONSWISSENSCHAFTEN (BIBLIOTHEKSWESEN)", "Sciences de l'information", "SOZIALE NETZWERKE + WEBDIENSTE + SOZIALE SOFTWARE (SOZIOLOGIE)", "INFORMATIONSSPEICHERUNG + INFORMATIONSGEWINNUNG (INFORMATIONSSYSTEME)", "HUMAN-COMPUTER INTERACTION, HCI", "Information behavior", "INFORMATIONSMANAGEMENT (MANAGEMENT VON COMPUTERSYSTEMEN)", "INFORMATIONSSOZIOLOGIE", "Informationsverhalten", "Interaction homme-ordinateur"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "This introductory textbook aims to provide undergraduate students in information science and related disciplines with an applied grounding in information behavior. The book’s primary focus is to provide explicit links between information behavior and the careers that students will pursue within the information professions. With a deeper understanding of information behavior, students will be better equipped to address the many types of barriers that frequently prevent people from effectively and efficiently accessing, understanding, managing, and/or using the information they need in the “real world.”"}, {"t": "Urgent archives: enacting liberatory memory work", "au": "Caswell, Michelle", "y": "2021", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Archivists", "Political aspects", "Social aspects", "United States", "South Asian American Digital Archive", "South Asian Americans", "Training of"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "VSA-AAS - Verein Schweizerische Archivar:innen / Association des archivistes suisses", "au": "", "y": "2021", "ty": "post-weblog", "src": "", "link": "https://vsa-aas.ch/", "tags": [""], "br": "2", "coll": "2.6 Sites web", "abs": "100 Jahre VSA Der Verein Schweizerische Archivar:innen wurde am 4. September 1922 gegründet und feiert 2022 sein 100-jähriges Jubiläum. Es geht für unsere"}, {"t": "Öffentliche Bibliothek 2025. Leitlinien für die Entwicklung der Öffentlichen Bibliotheken", "au": "Deutscher Bibliotheksverband e.V. (dbv) •", "y": "2021", "ty": "document", "src": "", "link": "https://www.bibliotheksverband.de/sites/default/files/2021-03/Positionspapier_%C3%96B_2025_FINAL_WEB.pdf", "tags": [""], "br": "", "coll": "Exemples-Advocacy", "abs": ""}, {"t": "ABF - Bibliothèques vertes", "au": "Association des bibliothécaires de France (ABF)", "y": "2022", "ty": "post-weblog", "src": "", "link": "https://bib.vertes.abf.asso.fr/bonjour-tout-le-monde/", "tags": [""], "br": "3", "coll": "3.6.2 Blogs", "abs": "Nous, membres de la Commission Bibliothèques Vertes de l'Association Bibliothécaires de France, sommes ravis de lancer ce nouvel outil de partage progressif de ressources sur les questions d'écologie, développement durable, économie circulaire, démarches, actions et projets verts, à venir ou avérés, dans les différents volets d'activités des bibliothèques et sur les lieux bibliothèques mêmes. \n\n\n\nNous vous invitons à prendre connaissance de la carte thématique du périmètre d'intervention & d'investigation de la commission, de l'agenda des prochains événements et formations qui pourraient vous intéresser, ou d'entrer directement dans la rubrique thématique de votre choix dont les contenus vont peu à peu se construire ! \n\n\n\nCe blog correspond à du work in progress : c'est aujourd'hui un blog qui fait ses tout premiers pas, et peu à peu, les contenus s'étofferont et seront à même, nous l'espérons, de couvrir la grande diversité des enjeux que nous identifions. \n\n\n\nNous vous invitons de votre côté à nous remonter vos actions, vos projets, vos questions, et aussi vos suggestions le cas échéant, pour contribuer à alimenter la richesse de cette nouvelle ressource, en nous contactant par mail à bibliotheques.vertes@abf.asso.fr. Nous vous invitons aussi à partager nos articles et contenus autour de vous, afin de contribuer à essaimer des pratiques vert.ueues.es dans les bibliothèques d'ici et d'ailleurs !"}, {"t": "Access and Artificial Intelligence", "au": "Jaillant, Lise", "y": "2022", "ty": "book", "src": "", "link": "https://www.transcript-publishing.com/media/pdf/10/3e/1d/oa9783839455845rCYlN7VmurLgw.pdf", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Archivische Erschließung im Umbruch: Vorträge des 80. Südwestdeutschen Archivtags am 17. und 18. Juni 2021", "au": "Ziwes, Franz-Joseph; Müller, Peter", "y": "2022", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Archivkultur: Bausteine zu ihrer Begründung", "au": "Schenk, Dietmar", "y": "2022", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archivkunde", "Kultur"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Born-digital design records", "au": "Winn, Samantha", "y": "2022", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Data science in the library: tools and strategies for supporting data-driven research and instruction", "au": "Herndon, Joel", "y": "2022", "ty": "book", "src": "", "link": "", "tags": ["Data curation in libraries", "Data services librarians", "Database management in libraries"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "This book explores the rapid expansion of data sources, visualizations, and analytics created in the last decade and explores the strategies, tools, and approaches that educators and information specialists are employing to train a new generation of data professionals."}, {"t": "Data science in the library: tools and strategies for supporting data-driven research and instruction", "au": "Herndon, Joel", "y": "2022", "ty": "book", "src": "", "link": "", "tags": ["Data processing", "Research", "Data curation in libraries", "Data services librarians", "Database management in libraries", "Big data"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "In the last decade, data science has generated new fields of study and transformed existing disciplines. As data science reshapes academia, how can libraries and librarians engage with this rapidly evolving, dynamic form of research? Can libraries leverage their existing strengths in information management, instruction, and research support to advance data science?Data Science in the Library: Tools and Strategies for Supporting Data-Driven Research and Instruction brings together an international group of librarians and faculty to consider the opportunities afforded by data science for research libraries. Using practical examples, each chapter focuses on data science instruction, reproducible research, establishing data science services and key data science partnerships.This book will be invaluable to library and information professionals interested in building or expanding data science services. It is a practical, useful tool for researchers, students, and instructors interested in implementing models for data science service that build community and advance the discipline."}, {"t": "Designing libraries for the 21st century", "au": "Hickerson, H. Thomas; Lippincott, Joan K.; Crema, Leonora", "y": "2022", "ty": "book", "src": "", "link": "", "tags": ["Architecture des bibliothèques", "Bibliothèques Design", "Libraries Design", "Library architecture"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "\"The 21st century has seen a transformational shift in the design of college and research libraries, one focused more on user experience and engagement than on collections. Dramatic changes in library design have been driven by changes in the core functions of universities and colleges: the reliance on digital tools and content, integration of technologies into pedagogy and research, and emphasis on the active and social aspects of learning, inclusion, and community engagement. Planning for these vibrant spaces needs to incorporate new program and staffing strategies, robust technical infrastructure, human-centered design, and flexibility to enable ongoing change. Designing Libraries for the 21st Century explores these trends and identifies promising strategies for new or renovated library space. The book features an impressive array of authors drawn largely from the conference of the same name, providing guidance, principles, and a wealth of creative ideas for spaces, technology, programs, and partnerships. Twenty-nine chapters packed with full color images and illustrations explore these themes: 21st-Century Academic Libraries in an Evolving Environment; Aligning with the Institutional Vision; Working with Architects, Designers, and Planners; Key Issues in Planning; Collaborations and Convergence; Leadership, Organizational Change, and New Staff Roles; Programming for Research, Learning, and Community; and Looking Ahead. Often major building projects focus primarily on the physical facility, but this volume makes the case for designing libraries in a much more holistic fashion. Today all types of libraries are engaged in reimagining their roles and the spatial design through which this new vision will be realized. Both inspirational and practical, Designing Libraries for the 21st Century is a must read for librarians, architects, planners, academic leaders, and anyone interested in the future of libraries\"-- Provided bypublisher"}, {"t": "Deutsche Archive im digitalen Zeitalter", "au": "Lenz, Patricia; Kemper, Joachim; Hovestädt, Dagmar; Diener-Staeckling, Antje", "y": "2022", "ty": "book", "src": "", "link": "https://doi.org/10.3224/96665033>", "tags": ["Digitalisierung", "Partizipation", "bic Book Industry Communication", "archive & information management", "Archive 2", "archives 2", "archiving", "Archivwesen", "digital archives", "digital sources", "digitale Archive", "digitale Quellen", "digitalization", "G Reference", "GL Library & information sciences", "GLC Library", "GLP Archiving", "information & interdisciplinary subjects", "interactivity", "Interaktivität", "Nutzerkontakt", "Nutzerorientierung", "offene Archive", "online tools", "open archives", "participation", "preservation & digitisation", "soziale Medien", "user orientation"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Zahlreiche Archive bekennen sich mittlerweile zum Grundgedanken der Offenheit, zu partizipativen und nutzerorientierten Zielen, zur Nutzung digitaler Werkzeuge. Mit Gründung der Konferenzreihe „Offene Archive” hat sich eine Gruppe von Archivar*innen 2012 aufgemacht, die digitale Zukunft von Archiven in Deutschland besser zu gestalten."}, {"t": "Die Zukunft ist interdisziplinär: Der Master in Archiv-, Bibliotheks- und Informationswissenschaft der Universitäten Bern und Lausanne", "au": "Knoch-Mund, Gaby", "y": "2022", "ty": "article-journal", "src": "Bibliothek : Forschung und Praxis", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrage
