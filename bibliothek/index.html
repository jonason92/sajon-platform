lysing existing documents."}, {"t": "Référentiel général de gestion des Archives", "au": "Comité interministériel aux Archives de France", "y": "2013", "ty": "document", "src": "", "link": "https://www.gouvernement.fr/sites/default/files/contenu/piece-jointe/2014/07/r2ga_document_complet_201310.pdf", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "The discipline of organizing", "au": "Glushko, Robert J.", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["LEHRBÜCHER (DOKUMENTENTYP)", "Metadaten", "METADATEN (BIBLIOTHEKSWESEN)", "Information", "Information organization", "INFORMATIONSWISSENSCHAFTEN + DOKUMENTATIONSWISSENSCHAFTEN (BIBLIOTHEKSWESEN)", "INFORMATION ENGINEERING + DATENBANKENTWURF (INFORMATIONSSYSTEME)", "Information resources management", "Information Retrieval", "INFORMATIONSSPEICHERUNG + INFORMATIONSGEWINNUNG (INFORMATIONSSYSTEME)", "KLASSIFIKATORISCHE SACHERSCHLIESSUNG + KLASSIFIZIERUNG (BIBLIOTHEKSWESEN)", "Metadata", "ORGANISATION (GESICHTSPUNKT)", "Organisationslehre"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "We organize things, we organize information, we organize information about things, and we organize information about information. But even though “organizing” is a fundamental and ubiquitous challenge, when we compare these activities their contrasts are more apparent than their commonalities. We propose to unify many perspectives about organizing with the concept of an Organizing System, defined as an intentionally arranged collection of resources and the interactions they support. Every Organizing System involves a collection of resources, a choice of properties or principles used to describe and arrange resources, and ways of supporting interactions with resources. By comparing and contrasting how these activities take place in different contexts and domains, we can identify patterns of organizing. We can create a discipline of organizing in a disciplined way."}, {"t": "Vers un nouvel archiviste numérique", "au": "Frey, Valentine; Treleani, Matteo", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Archivage électronique", "Archivistique", "Numérisation", "Archives électroniques"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Wie mächtig sind Archive?/Perspektiven der Archivwissenschaft (Volume 104.0)", "au": "Hering, Rainer; Schenk, Dietmar", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["History", "archives", "archival work", "archive history", "Archive of suppressed literature in the GDR", "archives, archive history, archival work, formation of tradition, source preservation, digitization, Landesarchiv Schleswig-Holstein, Ringelblum-Archive, Warsaw Ghetto, Archive of suppressed literature in the GDR", "bic Book Industry Communication", "digitization", "formation of tradition", "H Humanities", "HB History", "Landesarchiv Schleswig-Holstein", "Ringelblum-Archive", "source preservation", "Warsaw Ghetto"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "In October 2011, the Representation of the State of Schleswig-Holstein to the Federal Government hosted the conference Power and Impotence of the Archives\". Cultural and archival scholars, archivists and academics debated the mission and benefits, responsibility and performance of archives in a widely digitized knowledge society. Archival scholarship in Germany has so far not dealt in detail with the challenge posed by the understanding of the archive in the atmosphere of postmodernity by cultural scholars. With the symposium documented here, the long overdue examination of these positions will now begin. The discussion was conducted in a pragmatic and practice-oriented manner. The contributions combine archival research considerations with the presentation of selected individual topics from archival practice and archive history.\""}, {"t": "Archives and recordkeeping: theory into practice", "au": "Brown, Caroline", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Management", "Archives", "Technological innovations", "Records"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "A groundbreaking text designed to simplify and demystify archival and recordkeeping theory and its role in modern day practice."}, {"t": "Bibliometrie: Einfach - verstandlich - nachvollziehbar", "au": "Ball, Rafael", "y": "2014", "ty": "book", "src": "", "link": "", "tags": [""], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "The quantification of knowledge to evaluate the performance of scholars or rank entire institutions, research locations, or nations is an increasingly common phenomenon. This volume introduces the subject of bibliometrics in concise form, describes the most important measurement techniques in a clearly understandable way, and explains how to independently create, assess, and interpret bibliometric analyses. The work is thus an easily readable and practical aid to decision-makers, science managers, academics, as well as librarians and information professionals."}, {"t": "Bibliothèques d'aujourd'hui: à la conquête de nouveaux espaces", "au": "Bisbrouck, Marie-Françoise", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Europe", "Bibliothèques", "Wissenschaftliche Bibliothek", "21e siècle (début)", "Architektur", "ADMINISTRATION DE BIBLIOTHÈQUES + PLANIFICATION DE BIBLIOTHÈQUES (BIBLIOTHÉCONOMIE)", "Bibliotheksbau", "BÂTIMENTS DE BIBLIOTHÈQUES + BÂTIMENTS D'ARCHIVES (ARCHITECTURE)", "Bibliothèques (constructions)", "Construction"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Équipements publics en profonde mutation, les bibliothèques territoriales ou universitaires, avec l'offre documentaire électronique et des services diversifiés, sont toujours plus engagées dans une course à l'évolution. L'ouvrage aborde la question sous l'angle des services aux publics et des aménagements d'espaces correspondants. Le CD-ROM présente les fiches techniques de 47 opérations réalisées. (edition du cercle de la librairie)"}, {"t": "Dictionary of Archival Terminology: English and French. With Equivalents in Dutch, German, Italian, Russian and Spanish", "au": "Walne, Peter", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Archives", "English language", "Polyglot"], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Kleine Theorie des Archivs", "au": "Schenk, Dietmar", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Philosophy"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Vom \"\"Archiv\"\" ist in Wissenschaft und Öffentlichkeit heute oft die Rede; in Kulturtheorien wie in der Informationstechnik ist das Wort beliebt. Wie aber lassen sich die historischen Archive gedanklich fassen und welcher Platz gebührt ihnen im Diskurs um Gedächtnis und Geschichte?Die Kleine Theorie des Archivs, die hier in überarbeiteter und aktualisierter Form vorgelegt wird, greift diese Fragen auf und schlägt eine Brücke zwischen Archivwissenschaft und Geschichtstheorie. Archivarbeit versteht sie als Aspekt der Erinnerungskultur. Selbst als Archivar tätig, bezieht der Verfasser seine prakti"}, {"t": "L'archivistique à l'ère du numérique: les éléments fondamentaux de la discipline", "au": "Couture, Carol", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Archivage électronique", "Archivistique", "ARCHIVES", "LITTERATURE PROFESSIONNELLE", "NUMERISATION"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Cet ouvrage fait le point sur trois volets fondamentaux de l'archivistique: la législation et les politiques sur les archives; les principes et les fonctions de la discipline; et l'enseignement et la recherche de celle-ci. Les auteurs y analysent les principaux changements survenus sous l'influence des technologies de l'information et de la communication."}, {"t": "L'archivistique à l'ère du numérique: les éléments fondamentaux de la discipline", "au": "Couture, Carol", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Archivage électronique", "Archivistique", "ARCHIVES", "LITTERATURE PROFESSIONNELLE", "NUMERISATION"], "br": "2", "coll": "2.5 Ouvrages et articles; 1d Records Management", "abs": "Cet ouvrage fait le point sur trois volets fondamentaux de l'archivistique: la législation et les politiques sur les archives; les principes et les fonctions de la discipline; et l'enseignement et la recherche de celle-ci. Les auteurs y analysent les principaux changements survenus sous l'influence des technologies de l'information et de la communication."}, {"t": "Les archives électroniques", "au": "Béchard, L.; Hashimoto, L.F.; Vasseur, É.", "y": "2014", "ty": "book", "src": "", "link": "https://www.archivistes.org/Les-archives-electronique-deuxieme-edition-enrichie-et-mise-a-jour", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "Ce guide a été conçu pour offrir aux pro­fes­sion­nels des archi­ves et à toute per­sonne enga­gée dans des pro­jets d'archi­vage électronique une appro­che métho­do­lo­gi­que, étape par étape : de la…"}, {"t": "Libraries and the information society in Germany: an introduction", "au": "Plassmann, Engelbert; Rösch, Hermann; Seefeldt, Jürgen; Umlauf, Konrad", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Bibliothèques", "Allemagne", "Société numérique", "Gestion de l'information"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": ""}, {"t": "Library and information science: a guide to key literature and sources", "au": "Bemis, Michael F.", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["BIBLIOTHEKSWESEN + BIBLIOTHEKSWISSENSCHAFTEN + BIBLIOTHEKEN", "Bibliothéconomie", "Bibliothekswissenschaft", "FACHBIBLIOGRAPHIEN", "Information science", "Informations- und Dokumentationswissenschaft", "INFORMATIONSWISSENSCHAFTEN + DOKUMENTATIONSWISSENSCHAFTEN (BIBLIOTHEKSWESEN)", "Library science", "Sciences de l'information", "Wissenschaftliche Bibliothek", "WISSENSCHAFTLICHE BIBLIOTHEKEN + TECHNISCHE BIBLIOTHEKEN (BIBLIOTHEKSWESEN)"], "br": "1", "coll": "1.1 Répertoires bibliographiques; 3.1 Répertoires bibliographiques", "abs": ""}, {"t": "Management : Innovative Practices for Archives and Special Collections", "au": "Theimer, Kate; Theimer, Kate", "y": "2014", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Management: Innovative Practices for Archives and Special Collections explores the kinds of challenges that managers of archival programs face today and how those challenges can be met to achieve optimal results while working within existing resources. The book features thirteen case studies that demonstrate solutions to both traditional management concerns as well as new issues and opportunities presented by changes in technology and organizational environments. This book will help professionals build stronger archival programs by making e"}, {"t": "Marketing des services", "au": "", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Marketing", "GESTION DE LA RELATION CLIENT + FIDÉLISATION DU CLIENT", "ÉTUDES DE CAS (TYPE DE DOCUMENT)", "MANUELS POUR L'ENSEIGNEMENT (TYPE DE DOCUMENT)", "Marketing relationnel", "SECTEUR TERTIAIRE", "SERVICE À LA CLIENTÈLE (ÉCONOMIE D'ENTREPRISE)", "Services", "STRATÉGIES DE MARKETING"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Médiation et désir mimétique : Le bibliothécaire intermédiaire ou médiateur ?", "au": "Cavalié, Etienne", "y": "2014", "ty": "post-weblog", "src": "", "link": "https://bibliotheques.wordpress.com/2014/01/20/mediation-et-desir-mimetique-le-bibliothecaire-intermediaire-ou-mediateur/", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Faute de contestations suite aux derniers billets, j’entame une série sur la médiation comme situation de désir mimétique. Ce sera souvent assez déconstruit : c’est une pensée en cours …"}, {"t": "Recueil de règles de numérisation", "au": "Bibliothèque et Archives nationales du Québec (BAnq)", "y": "2014", "ty": "document", "src": "", "link": "https://www.banq.qc.ca/a_propos_banq/publications/publications_electroniques/recueil_regles_numerisation/index.html", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles; 3.7.2 Normes et règles", "abs": "Le Recueil de règles de numérisation est avant tout destiné aux opérateurs des appareils de numérisation pour leur permettre de numériser des collections patrimoniales, archivistiques et muséales de façon homogène et adaptée aux besoins.\n\nLe Recueil a pour objectif d'harmoniser les pratiques de numérisation des bibliothèques, centres d'archives et musées qui numérisent leurs collections de documents patrimoniaux, rares et précieux.\n\nIl s'agit d'une publication unique en son genre. Le Recueil propose des fiches organisées par type de document et illustrées par des exemples réels. Les fiches expliquent de façon détaillée les opérations de numérisation d'objets patrimoniaux très diversifiés comme les journaux, les cartes et les plans, les manuscrits, les négatifs photo, les diapositives, les microformes, les objets de grande dimension, les vêtements ou les objets en plusieurs pièces.\n\nLa publication du Recueil de règles de numérisation est le résultat d'une fructueuse collaboration entre Bibliothèque et Archives nationales du Québec (BAnQ), la Bibliothèque nationale de France (BnF) et le Musée canadien de l'histoire (auparavant le Musée canadien des civilisations)."}, {"t": "Regards croisés sur les métiers des sciences de l'information: bibliothèques, archives, documentation, musées", "au": "Accart, Jean-Philippe", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Bibliothek", "Museum", "Archives", "Schweiz", "France", "Bibliothèques", "Dokumentation", "Informationswissenschaft", "Suisse", "Frankreich", "Sciences de l'information", "21e siècle (début)", "Beruf", "Métiers", "Musées", "Services de documentation"], "br": "2", "coll": "2.5 Ouvrages et articles; 1.5.1 Documentation de base; 3.5.1 Documentation de base", "abs": "Cet ouvrage s'attache à porter des regards croisés sur les métiers des bibliothèques, des archives, de la documentation et des musées. A une époque où la référence à la mémoire, au patrimoine, au livre, est supplantée par celle ayant trait au numérique, à la technologie et aux réseaux sociaux - ce qui n'a rien d'antinomique - il devient urgent de réfléchir à la finalité de ces services. Leurs rôles sont multiples, à la fois collectifs et individuels, ils participent à l'éducation, à la culture et à la formation tout au long de la vie.\nA l'heure d'Internet, ces rôles sont renforcés par l'aspect technologique, informatique, qui fait partie de ce que tout citoyen doit apprendre et maitriser s'il veut avoir une part active dans la société du savoir. En la matière, les services dont nous parlons ont un rôle primordial à jouer, et les professionnels de l'information eux-mêmes - archivistes, bibliothécaires, documentalistes, personnels des musées - sont au premier rang.\nCet ouvrage montre, à travers de nombreux exemples et témoignages, comment ces services s'enrichissent les uns les autres, se complètent, utilisent des méthodes de travail proches bien que différenciées et se transforment, avec l'apparition de nouveaux profils métier."}, {"t": "Too big to know: rethinking knowledge now that the facts aren't the facts, experts are everywhere, and the smartest person in the room is the room", "au": "Weinberger, David", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Internet", "Informationsmanagement", "Informationstechnik", "Wissensmanagement"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "With the advent of the Internet and the limitless information it contains, we're less sure about what we know, who knows what, or even what it means to know at all. And yet, human knowledge has recently grown in previously unimaginable ways and in inconceivable directions. In Too Big to Know, David Weinberger explains that, rather than a systemic collapse, the Internet era represents a fundamental change in the methods we have for understanding the world around us. With examples from history, politics, business, philosophy, and science, Too Big to Know describes how the very foundations of knowledge have been overturned, and what this revolution means for our future."}, {"t": "Une logique de la communication", "au": "Watzlawick, Paul", "y": "2014", "ty": "book", "src": "", "link": "", "tags": ["Attitude", "Communication Aspect psychologique"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Scène de ménage dont \"Qui a peur de Virginia Woolf ?\" fournit le modèle, double bind où le sujet est soumis à plusieurs ordres contradictoires émis simultanément : tels sont certains des cas de pathologie de la communication analysés ici. Comment répondre à leurs paradoxes, sinon par des paradoxes ? On mettra le patient dans une double contrainte contradictoire, on lui prescrira son symptôme même. Il s'agit ici du premier jalon d'une oeuvre aujourd'hui classique. En relation avec les travaux de Bateson, les chercheurs de Palo Alto appliquent avec brio les modèles logiques et cybernétiques au pathologique (et au normal) humain. -- 4ème de couverture."}, {"t": "Archivistes de 2030: réflexions prospectives", "au": "Servais, Paul; Mirguet, Françoise", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Management", "Administration", "Archives", "Archivists", "Electronic filing systems", "Forecasting", "Records"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Classer les archives et les bibliothèques: mise en ordre et raisons classificatoires", "au": "Grailles, Bénédicte; Marcilloux, Patrice; Neveu, Valérie; Sarrazin, Véronique", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Bibliothèques", "21e siècle (début)", "[Études diverses]", "11e siècle-21e siècle (début)", "Classification", "Fonds documentaires"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Cultural heritage information: access and management", "au": "Ruthven, Ian", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Patrimoine culturel", "Archivage électronique", "Analyse et indexation des documents", "Démocratisation de la culture", "Gestion de l'information", "Métadonnées"], "br": "1", "coll": "1. Informationswissenschaften / Sciences de l'information", "abs": ""}, {"t": "DASCH: Data and Service Center for the Humanities", "au": "Rosenthaler, Lukas; Fornaro, Peter; Clivaz, Claire", "y": "2015", "ty": "article-journal", "src": "Digital Scholarship in the Humanities", "link": "https://doi.org/10.1093/llc/fqv051", "tags": ["Humanities and Social Sciences", "Library and information sciences"], "br": "2", "coll": "2.5 Ouvrages et articles; 1.5.2 Développements, problématiques contemporaines; 3.5.2 Développements, problématiques contemporaines", "abs": "Research data in the humanities needs to be sustainable and access to digital resources must be possible over a long period. Only if these prerequisites are fulfilled can research data be used as a source for other projects. In addition, reliability is a fundamental requirement so that digital sources can be cited, reused, and quoted. To address this problem we present our solution: the Data and Service Center for the Humanities (DASCH) located in Switzerland. The centralized infrastructure is based on flexible and extendable software that is in turn reliant on modern technologies. Such an approach allows for the straightforward migration of existing research project databases with limited lifespans in the humanities. We will demonstrate the basic concepts behind this proposed solution and our first experiences in the application thereof."}, {"t": "Digital Preservation Handbook", "au": "Digital Preservation Coalition", "y": "2015", "ty": "book", "src": "", "link": "https://www.dpconline.org/handbook", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Encyclopedia of archival science", "au": "Duranti, Luciana; Franks, Patricia C.", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Management", "Archives", "Records"], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": "Here is the first-ever comprehensive guide to archival principles and practices. Encyclopedia of Archival Science features 130 entries which cover every aspect of the profession. These entries range from the traditional basics (like appraisal and provenance) to today's necessities (digitization and digital curation)."}, {"t": "Historische Hilfswissenschaften: eine Einführung", "au": "Rohr, Christian", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Historische Hilfswissenschaften"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Informationsmanagement", "au": "Krcmar, Helmut", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Information storage and retrieval", "Information Storage and Retrieval", "Information technology", "Business—Data processing", "IT in Business", "Application software", "Information Systems Applications (incl. Internet)"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Informationsmanagement hat die Aufgabe, den im Hinblick auf das Unternehmensziel bestmöglichen Einsatz der Ressource Information zu gewährleisten. Dieses Buch vermittelt die zentrale Einsicht, dass Informations- und Kommunikationstechniken nicht nur Rationalisierungsmöglichkeiten eröffnen, sondern vor allem Gestaltungsmöglichkeiten für Organisationen und neue Geschäftsmodelle bieten."}, {"t": "Ist die Bibliothek ein Dritter Ort? Ein Seminarbericht", "au": "Haas, Corinna; Mumenthaler, Rudolf; Schuldt, Karsten", "y": "2015", "ty": "article-journal", "src": "Informationspraxis", "link": "https://doi.org/10.11588/ip.2015.2.23763", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Das Schlagwort „Dritter Raum” beziehungsweise „Dritter Ort” hat sich in den letzten Jahren im Bibliothekswesen etabliert. Es beschreibt strategische Entscheidungen von Bibliotheken, sich als Kommunikationsort und gesellschaftlichen Raum zu entwerfen. In einem Seminar an der HTW Chur wurde das Schlagwort einer kritischen Prüfung unterzogen (1). Zuerst wurden die Herkunft und heutige Nutzung des Schlagworts überprüft (2). Dabei zeigten sich relevante Differenzen sowohl zwischen der Originalliteratur, die im US-amerikanischen Rahmen der 80er und 90er Jahre angesiedelt ist und der heutigen bibliothekarischen Verwendung, als auch zwischen Bibliotheken, die das Schlagwort nutzen. In einem weiteren Schritt überprüften Studierende in verschiedenen neu- oder umgebauten schweizerischen Bibliotheken forschend die These vom „Dritten Ort” (3). Die Arbeiten der Studierenden zeigten vor allem Bibliotheken, die infrastrukturell „Dritte Orte” sein wollen, aber von den Nutzerinnen und Nutzern nicht als solche akzeptiert werden. Der Text stellt die im Seminar geleistete Arbeit dar und schliesst (4) mit offenen Fragen, die sich aus den festgestellten Differenzen zwischen bibliothekarischem Diskurs, Realität in den Bibliotheken und Zielen der Originalliteratur ergeben. The term \"Third Place\" has become popular in librarianship in recent years. It describes strategic decisions made by libraries in order to turn themselves into places of communication and social interaction. In a seminar at HTW Chur, the term was critically discussed. (1) The origin and current use of the term “third place” were examined. (2) Some relevant differences were considered between its use in the original literature which is situated within the US context of the 80s and 90s, and today's library use, as well as between libraries that use the term; following this discussion, students examined the thesis of the \"third place\" in the context of various new or rebuilt Swiss libraries. (3) The research carried out by the students in particular libraries showed that they want to be \"third places\", but are not accepted as such by their users. This article presents the proceedings and outcomes of the seminar and concludes (4) with open questions that arise from the identified differences between the discourse of librarians, the reality in the libraries, and the intentions of the original literature."}, {"t": "L'archiviste dans quinze ans: nouvelles attentes, nouvelles responsabilités, nouveaux défis", "au": "Journées des archives", "y": "2015", "ty": "paper-conference", "src": "", "link": "", "tags": ["Archivar", "1990-", "21e siècle", "Actes de congrès", "Archivage électronique", "Archivistes", "Archivistique", "Archivkunde", "Berufsbild", "Formation"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "L'édition critique des textes contemporains, XIXe-XXIe siècle", "au": "Nougaret, Christine; Parinet, Élisabeth", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["History", "France", "19e siècle-21e siècle (début)", "Editing", "Edition", "Édition", "Édition critique", "Edition Leipzig", "Frankreich", "French imprints", "Geschichte 1800-2015", "Imprimés français", "Textes", "Textkritik"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Le métier de documentaliste", "au": "Accart, Jean-Philippe; Réthy, Marie-Pierre", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Information scientists", "Librarians"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Souvent remis en question dans un nouvel environnement, le métier de documentaliste est en reconfiguration constante : d'où la nécessité de donner à tous les documentalistes, du débutant au plus confirmé, les moyens de « reprendre la main » sur leur propre métier, de comprendre les changements en cours pour évoluer. \n\nUne 5ème édition est prévue pour 2023."}, {"t": "Les bibliothèques et la médiation des connaissances", "au": "Calenge, Bertrand", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Internet", "Bibliothéconomie", "Sciences de l'information", "Culture de l'information", "Bibliothèques - Services aux publics", "Gestion des connaissances", "Bibliothèques et Internet", "Bibliothèques Services aux publics"], "br": "3", "coll": "3.5.1 Documentation de base; 2a Communication, Relations publiques et gestion des connaissances", "abs": "En offrant à chacun le recours à Internet, dont les ressources immenses donnent l'impression de tout pouvoir y trouver sans peine, la société contemporaine suggère une désintermédiation qui mettrait la sérendipité et l'immédiateté au coeur des processus d'acquisition des savoirs. Les bibliothèques sont alors questionnées, car leurs fonctions de réservoirs sont largement ébranlées, et les bibliothécaires s'interrogent sur leur légitimité de passeurs. Le présent ouvrage pose à l'inverse l'enjeu de la ré-intermédiation des connaissances, affirmant que la force des bibliothèques réside dans les capacités de médiation des bibliothécaires, au-delà même de la richesse des collections proposées, et justement parce que le flux des informations possibles est si immense qu'il en devient inconnaissable. Cette médiation des connaissances est un défi majeur de la société contemporaine, qui continue de construire son identité à travers des savoirs transmis, partagés, échangés. Dans cette opération, les bibliothécaires tiennent la place singulière d'agents publics délibérément mobilisés pour faciliter l'émergence d'un flux collectivement élaboré de débats, passions, connaissances. Incluant bien sûr moult livres, disques, fichiers, et autres supports d'information... Parier sur la bibliothèque actrice de la médiation des connaissances ne bouleverse pas l'organisation et la finalité de l'établissement : il faut toujours sélectionner, ordonner, accueillir, conserver. Mais ce pari impose d'aiguiser les exigences attendues des bibliothécaires, qui doivent être d'abord des connaisseurs des contenus, comme ils doivent être accompagnateurs de leurs publics. Il faut surtout inventer de nouvelles façons de mobiliser acquisitions et échanges de savoirs, passer de la transmission de documents reconnus à la médiation des connaissances. Pour y parvenir, il faut revisiter le conseil, l'accompagnement, les partenariats, la mise en scène, s'aventurer à produire des sites, billets, bref devenir éditeurs de contenus auprès des publics, eux-mêmes passeurs de leurs propres savoirs."}, {"t": "Les genres de documents dans les organisations: analyse théorique et pratique", "au": "Gagnon-Arguin, Louise; Mas, Sabine; Maurel, Dominique", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Archivistique", "Gestion des documents", "Classification", "Documents administratifs"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Panorama de l'archivistique contemporaine: évolution de la discipline et de la profession : mélanges offerts à Carol Couture", "au": "Gagnon-Arguin, Louise; Couture, Carol", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Archivistes", "Archivistique", "[Mélanges et hommages]"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Praxishandbuch Bibliotheksmanagement", "au": "Griebel, Rolf; Schäffler, Hildegard; Söllner, Konstanze", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "Management", "Deutschland", "Germany", "Library science", "Libraries", "Library administration", "Bibliotheksverwaltung"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Similar to its predecessor work, The Modern Library, The Practical Handbook of Library Management is a handbook that covers all aspects of library organization. It provides an overview of library management in Germany, with special emphasis on current developments in consideration of the international context. It also offers a detailed outlook on the most important contemporary trends in library work."}, {"t": "SWEEPING THE LIBRARY La bibliothèque de Sciences Po Paris passe les usages de ses lecteurs au tamis de l’observation", "au": "Touitou, Cecile", "y": "2015", "ty": "article-journal", "src": "bulletin des bibliothèques de france", "link": "", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "The library of Sciences Po Paris has conducted a survey following an \"ethnological\" approach. The paper presents the methodology of the \"Sweeping the Library\" survey, and the main results.\n2400 students observations have been done during 9 month of 2014. The study sheds light on the use of students in academic libraries."}, {"t": "Terminologie de base en archivistique", "au": "Université de Montréal, EBSI", "y": "2015", "ty": "webpage", "src": "", "link": "https://clip.ebsi.umontreal.ca/terminologie/", "tags": [""], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Terminologie der Archivwissenschaft -", "au": "Archivschule Marburg", "y": "2015", "ty": "webpage", "src": "", "link": "http://www.archivschule.de/uploads/Forschung/ArchivwissenschaftlicheTerminologie/Terminologie.html", "tags": [""], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "The ethics of information", "au": "Floridi, Luciano", "y": "2015", "ty": "book", "src": "", "link": "", "tags": ["Informationstechnik", "Informationsethik", "Kommunikationstechnik"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "This is the first philosophical monograph entirely and exclusively dedicated to Information Ethics.Information and Communication Technologies (ICTs) have profoundly changed many aspects of life, including the nature of entertainment, work, communication, education, health care, industrial production and business, social relations, and conflicts.\nThe book lays down, for the first time, the conceptual foundations for Information Ethics."}, {"t": "Advocacy [dossier]", "au": "Verneuil, Anne; Chaimbault-Petitjean, Thomas", "y": "2016", "ty": "article-journal", "src": "Bibliothèque(s)", "link": "https://www.enssib.fr/bibliotheque-numerique/index-des-revues?id_numero=68002&type_numero=PDF#page=27", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Archives en Suisse: conserver la mémoire à l'ère numérique", "au": "Coutaz, Gilbert", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Archivage électronique", "Archivistique", "Suisse", "ARCHIVES", "Archives publiques", "Archives publiques Suisse", "LITTERATURE PROFESSIONNELLE", "NUMERISATION", "Patrimoine culturel Conservation et restauration Suisse"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "L’affaire des fiches de la police ou les travaux de la Commission Bergier ont illustré le rôle déterminant des archives, que l’on peut à dessein dissimuler, déformer voire éliminer. Pourtant les archives existent avant tout pour mesurer la richesse patrimoniale et historique d’un pays, d’une région ou d’une organisation. Elles traduisent également le niveau de transparence et d’évolution de nos sociétés dont elles constituent le reflet fidèle et souvent complet. Ce livre explore le domaine méconnu de l’archivistique publique, particulièrement en Suisse, et propose d’en raconter l’histoire avec ses objectifs, son rôle et ses défis. Aujourd’hui, l’explosion du volume d’information et la généralisation de l’informatique transforment les archives en réalités virtuelles qu’il s’agit d’autant plus de maîtriser, de révéler et de pérenniser. Dans ce contexte mouvant, le rôle de l’archiviste, souvent incompris, est essentiel et cet ouvrage ne manque pas de rappeler sa responsabilité dans l’importance de faire le lien entre passé et futur."}, {"t": "Archivistique et diplomatique numériques : une traduction en français d’une partie des livrables du projet InterPARES 2", "au": "Banat-Berger, Françoise; Borgeaud, Emily; Nougaret, Christine", "y": "2016", "ty": "webpage", "src": "", "link": "http://elec.enc.sorbonne.fr/interpares2/", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Bibliothekarisches Grundwissen", "au": "Gantert, Klaus", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "BIBLIOTHEKSWESEN + BIBLIOTHEKSWISSENSCHAFTEN + BIBLIOTHEKEN", "ELEKTRONISCHE BIBLIOTHEKEN (BIBLIOTHEKSWESEN)", "LEHRBÜCHER (DOKUMENTENTYP)", "BIBLIOTHEKSDIENSTLEISTUNGEN (BIBLIOTHEKSWESEN)", "Germany", "Bibliothéconomie", "Bibliothekswissenschaft", "Informations- und Dokumentationswissenschaft", "Library science", "INFORMATIONSVERMITTLUNG (BIBLIOTHEKSWESEN)", "biblioteconomia", "bibliothéconomie", "BESTANDESAUFBAU + BESTANDESPFLEGE (BIBLIOTHEKSWESEN)", "BIBLIOTHEKSKATALOGE", "BIBLIOTHEKSNETZE + BIBLIOTHEKSVERBÜNDE (BIBLIOTHEKSWESEN)"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "The 9th edition of this well-known standard textbook has been completely revised. It describes the working steps of acquisition, cataloguing, inventory maintenance, and utilization with an emphasis on new developments and technologies. The new edition presents an up-to-date and comprehensive overview of all aspects of library science, the work of the librarian, and library information services."}, {"t": "Communiquer !: Les bibliothécaires, les décideurs et les journalistes", "au": "Accart, Jean-Philippe", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["bibliothéconomie", "communication", "bibliothécaires", "bibliothèques", "journalistes", "Library&#44", "Information &amp", "Communication sciences"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines; 2a Communication, Relations publiques et gestion des connaissances", "abs": "L'enjeu de la communication en direction des élus, des décideurs, mais aussi des journalistes, est devenu vital pour les bibliothèques : il s'agit de donner à voir aux tutelles leurs activités, de rendre intelligible leur stratégie de développement, de construire une image institutionnelle forte.  De quels moyens dispose la bibliothèque pour faire la preuve du bienfondé de son existence ? Comment communiquer en direction d'un élu municipal ou régional, d'un responsable politique de la bibliothèque ? Que peut apporter une bonne collaboration avec des journalistes, avec les partenaires naturels ou hiérarchiques au sein de l'université ou de la collectivité territoriale ? Comment utiliser à bon escient les méthodes du lobbying et du marketing, ou l'emploi des réseaux sociaux ? Voilà quelques-unes des questions abordées ici.  Une quinzaine d'auteurs d'horizons divers (des sociologues, des enseignants, des journalistes, des bibliothécaires, des responsables de communication…) nous font part de leurs propres expériences, donnent des conseils méthodologiques et des outils fort utiles, en proposant de nombreux exemples et des mises en situation. Auteur de plusieurs ouvrages dans le domaine de la documentation et des sciences de l'information, Jean-Philippe Accart est actuellement directeur des bibliothèques de la Faculté des sciences de l'Université de Genève."}, {"t": "Communiquer !: Les bibliothécaires, les décideurs et les journalistes", "au": "Accart, Jean-Philippe", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["bibliothéconomie", "communication", "bibliothécaires", "bibliothèques", "journalistes", "Library&#44", "Information &amp", "Communication sciences"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "L'enjeu de la communication en direction des élus, des décideurs, mais aussi des journalistes, est devenu vital pour les bibliothèques : il s'agit de donner à voir aux tutelles leurs activités, de rendre intelligible leur stratégie de développement, de construire une image institutionnelle forte.  De quels moyens dispose la bibliothèque pour faire la preuve du bienfondé de son existence ? Comment communiquer en direction d'un élu municipal ou régional, d'un responsable politique de la bibliothèque ? Que peut apporter une bonne collaboration avec des journalistes, avec les partenaires naturels ou hiérarchiques au sein de l'université ou de la collectivité territoriale ? Comment utiliser à bon escient les méthodes du lobbying et du marketing, ou l'emploi des réseaux sociaux ? Voilà quelques-unes des questions abordées ici.  Une quinzaine d'auteurs d'horizons divers (des sociologues, des enseignants, des journalistes, des bibliothécaires, des responsables de communication…) nous font part de leurs propres expériences, donnent des conseils méthodologiques et des outils fort utiles, en proposant de nombreux exemples et des mises en situation. Auteur de plusieurs ouvrages dans le domaine de la documentation et des sciences de l'information, Jean-Philippe Accart est actuellement directeur des bibliothèques de la Faculté des sciences de l'Université de Genève."}, {"t": "Digital curation", "au": "Oliver, Gillian; Harvey, Ross", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Digital preservation", "Management", "Bibliothèques numériques", "Curation de contenu", "Data curation", "Digital libraries", "Gestionnaires de bibliothèques numériques"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "As an in-depth explanation of the entire digital curation lifecycle, from creation to appraisal to preservation to organization/access to transformation, the first edition of this text set a benchmark for both thoroughness and clarity. Boasting the expert guidance of international authorities Oliver and Harvey, this revamped and expanded edition widens the scope to address continuing developments in the strategies, technological approaches, and activities that are part of this rapidly changing field. In addition to current practitioners, those pursuing a career as librarian, archivist, or records manager will find this definitive survey invaluable. Filled with up-to-date best practices, it covers such important topics as the scope and incentives of digital curation, detailing Digital Curation Centre's (DCC) lifecycle model as well as the Data Curation Continuum. Useful as both a teaching text and day-to-day working guide, this book outlines the essential concepts and techniques that are crucial to preserving the longevity of digital resources."}, {"t": "Diriger une bibliothèque: un nouveau leadership", "au": "Miribel, Marielle de", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Bibliothèques", "Gestion", "LITTERATURE PROFESSIONNELLE", "BIBLIOTHEQUE", "[Manuels d'enseignement]", "[Ouvrages de référence]", "Directeurs de bibliothèque", "Leadership", "Personnel - Direction"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Cet ouvrage s’adresse à tous les responsables d’une organisation et/ou d’une équipe dans le monde des bibliothèques. Il a pour objectif de transmettre des grilles de lecture et de donner des pistes de développement professionnel. Il vise à aider les collègues à gérer au mieux cette position délicate et parfois difficile, celle de manager-leader, dans un contexte de complexité : pouvoir mettre des mots sur des situations vécues afin de les comprendre et d’y remédier, lire les signes avant-coureurs de tension, tenir sa juste place, prendre du recul sur sa pratique, réguler une équipe comme un chef d’orchestre le ferait d’un orchestre symphonique…\n\nIl permet de comprendre quelles sont les priorités, dans le contexte particulier et spécifique de chaque bibliothèque, et d’élever son niveau de conscience des situations et des rôles ; ceci pour pouvoir agir avec puissance et subtilité dans le rôle de responsable et permettre l’efficacité collective et l’autonomie professionnelle de chacun."}, {"t": "Einführung in die Bibliometrie", "au": "Havemann, Frank", "y": "2016", "ty": "book", "src": "", "link": "http://www.wissenschaftsforschung.de/Havemann2016Bibliometrie.pdf", "tags": ["Bibliometrie", "Bibliotheks- und Informationswissenschaft", "Lehrbuch", "Scientometrie"], "br": "1", "coll": "1.5.1 Documentation de base; 3.5.1 Documentation de base", "abs": "Provider: Deutsche Digitale Bibliothek - Institution: Deutsche Nationalbibliothek - Data provided by Europeana Collections- Zweite, erweiterte Auflage- All metadata published by Europeana are available free of restriction under the Creative Commons CC0 1.0 Universal Public Domain Dedication. However, Europeana requests that you actively acknowledge and give attribution to all metadata sources including Europeana"}, {"t": "Engaging with records and archives: histories and theories", "au": "MacNeil, Heather; Mak, Bonnie; Oliver, Gillian; Foscarini, Fiorella", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Management", "Archives", "Archivkunde", "Geschichte", "Records", "History", "Histoire", "Registratur", "LANGUAGE ARTS & DISCIPLINES", "Library & Information Science", "Archives & Special Libraries"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "This book provides an authoritative and inspiring response to todays growing fascination with the idea of the archive and contains cutting-edge research articles on the history and theory of archives and records, written by internationally renowned and emerging scholars. Selected from the most original, insightful and imaginative papers from the Seventh International Conference on the History of Records and Archives (I-CHORA 7), the histories and theories collected in this volume offer a wide variety of views of records, archives and archival functions, spanning diverse regions, communities, disciplinary perspectives and time periods. From the origins of contemporary grassroots archival activism in Poland to the role of women archivists in early 20th century England; from the management of records in the Dutch East Indies in the 19th century to the relationship between Western and Indigenous cultures in North America and other modern archival conundrums: this book reveals the richness and complexity of archival thinking through historical and contemporary compelling examples that will captivate the reader"}, {"t": "Geschichte digital: Historische Welten neu vermessen", "au": "Koller, Guido", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Digitalisierung", "Histoire", "Big Data", "Web", "Historiographie", "Digital Humanities", "Édition électronique", "GESCHICHTSSCHREIBUNG", "Geschichtswissenschaft", "Historiker", "Humanités numériques", "Médias sociaux"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Glossary of records and information management terms", "au": "Association of records managers and administrators", "y": "2016", "ty": "book", "src": "", "link": "https://www.arma.org/store/viewproduct.aspx?id=14193006", "tags": ["Archivage électronique", "Gestion de l'information", "Technologie de l'information", "Vocabulaire"], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Handbuch Archiv: Geschichte, Aufgaben, Perspektiven", "au": "Lepper, Marcel; Raulff, Ulrich", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "ARCHIVE (ARCHIVKUNDE)", "Archives", "Deutschland", "DEUTSCHLAND (MITTELEUROPA). BUNDESREPUBLIK DEUTSCHLAND", "Germany", "Archivkunde", "History", "Konservierung", "FACHLICHE NACHSCHLAGEWERKE + FACHLEXIKA + HANDBÜCHER (DOKUMENTENTYP)", "ARCHIVKUNDE", "ARCHIVALISCHE NACHLÄSSE (ARCHIVKUNDE)", "ARCHIVKUNDE/HISTORISCHE ASPEKTE", "Auxiliary sciences of history", "Sammeln", "Westeuropa", "WESTEUROPA"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "How Soon Is Now? Writings on Digital Archiving in Canada from the 1980s to 2011", "au": "Bak, Greg", "y": "2016", "ty": "article-journal", "src": "The American Archivist", "link": "https://doi.org/10.17723/0360-9081-79.2.283", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "During the 1980s and 1990s, electronic records were a source of general concern and debate among Canadian archivists. There was a heightened interest in, and increasing numbers of articles about, electronic recordkeeping projects such as the University of British Columbia (UBC) Project and the National Archives of Canada’s Information Management and Office Systems Advancement (IMOSA) Project, as well as non-Canadian projects like the Pittsburgh Project. Such projects often represented a turning away from approaches established and expertise gained during the machine readable archives (MRA) era. Nonetheless, digital archival work outside of these projects continued, much of it moving in trajectories set during the MRA era. This article suggests that MRA methods, ideas, and approaches have reemerged today as foundational to contemporary digital archives theory and practice."}, {"t": "La médiation à l'heure du numérique", "au": "Accart, Jean-Philippe", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Bibliothécaires Effets des innovations technologiques", "Bibliothèques Formation des utilisateurs", "Bibliothèques Services de référence numériques"], "br": "3", "coll": "3.5.1 Documentation de base; 2a Communication, Relations publiques et gestion des connaissances", "abs": "Avec la technologie numérique, le rôle traditionnel des bibliothécaires et documentalistes inclut aujourd'hui la médiation numérique. Le besoin est grandissant de construire un lien entre des outils et des dispositifs techniques d'une part, et les publics d'autre part."}, {"t": "Les 500 mots métiers : Bibliothèques, archives, documentation, musées", "au": "Accart, Jean-Philippe; Vaissaire-Agard, Clotilde", "y": "2016", "ty": "book", "src": "", "link": "https://www.editionsklog.com/product/les-500-mots-metiers-bibliotheques-archives-documentation-musees", "tags": [""], "br": "1", "coll": "1.4 Dictionnaires, encyclopédies; 2.4 Dictionnaires, encyclopédies", "abs": "« Les 500 mots métiers » répertorie les termes utiles aux métiers des bibliothèques, des musées, de la documentation et des archives. Il revisite les définitions existantes, les illustre d’exemples récents, de schémas et de liens, les situe dans le contexte professionnel et technologique que nous connaissons aujourd’hui.\n\nLe lecteur y trouvera donc une sélection de mots métiers et notamment les termes d’actualité qui lui permettront de nourrir sa réflexion et d’enrichir ses connaissances.  Cet ouvrage se révélera particulièrement utile pour des préparations aux différents concours de la fonction publique.\n\nUne traduction en anglais et en allemand de chaque terme est proposée afin de répondre aux besoins des professionnels travaillant dans un environnement multilingue."}, {"t": "Moderne Aktenkunde", "au": "Kretzschmar, Robert; Uhde, Karsten; Berwinkel, Holger", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Digitale Daten", "Archives", "Germany", "AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "Archivkunde", "GESCHÄTSAKTEN, REGISTRATUREN, ABLAGE", "History", "20th century", "Appraisal of archival materials", "21st century", "Akte", "Aktenlehre", "Schriftgut"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "nestor Handbuch: eine kleine Enzyklopädie der digitalen Langzeitarchivierung", "au": "Neuroth, Heike; Oßwald, Achim; Scheffel, Regine; Strathmann, Stefan; Huth, Karsten", "y": "2016", "ty": "book", "src": "", "link": "http://nbn-resolving.de/urn/resolver.pl?urn=urn:nbn:de:0008-2010071949", "tags": ["Digitale Daten", "Langzeitarchivierung", "Archivierung", "Elektronische Medien", "Informationssystem"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Qu'est-ce qui fait la valeur des bibliothèques ? Livre blanc - Notice bibliographique | Enssib", "au": "Delcarmine, Nadine; Mercier, Silvère; Rigeade, Marine; Touitou, Cécile", "y": "2016", "ty": "document", "src": "", "link": "https://www.enssib.fr/bibliotheque-numerique/notices/65997-qu-est-ce-qui-fait-la-valeur-des-bibliotheques-livre-blanc", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Cette publication clôt le travail d'une année réalisé par les experts de la commission de normalisation en Information et Documentation dédiée à la Qualité, statistiques et évaluation des résultats, et a pour but de mettre en lumière la norme internationale ISO 16439 intitulée « Methods and procedures for assessing the impact of libraries » dont la première édition est parue en avril 2014.\nCette nouvelle norme a pour objectif principal de proposer aux bibliothèques, établissements et pouvoirs publics des méthodes et des outils susceptibles de fournir une approche de l’impact qu'exercent les bibliothèques sur la société et les individus."}, {"t": "Schweizer Dokumentationslandschaft im Wandel: die Suche nach einem Berufsverständnis", "au": "Marty, Sara", "y": "2016", "ty": "article-journal", "src": "Informationswissenschaft: Theorie, Methode und Praxis", "link": "https://doi.org/10.18755/iw.2016.8", "tags": [""], "br": "", "coll": "1a Intro archivistique, bibliothéconomie et SI", "abs": "Das Dokumentationswesen in der Schweiz ist schwer fassbar, weil keine statistischen Daten dazu existieren. Diesen Mangel will diese Masterarbeit beheben: Sie liefert ein Bild der Schweizer Dokumentationslandschaft, wie sie sich im Jahr 2014 präsentiert. Zusätzlich geht sie den Ursachen und Auswirkungen der über die vergangenen Jahrzehnte beobachtbaren Veränderungen auf den Grund und beleuchtet das Berufsverständnis der im Dokumentationswesen tätigen Personen. Für diese Arbeit wurde ein Verzeichnis der Dokumentationsinstitutionen in der deutsch- und französischsprachigen Schweiz erstellt. Dafür wurde das Archiv der elektronischen Mailingliste Swiss-Lib seit ihrer Lancierung im Jahr 2000 durchsucht. Das Ergebnis dieser Ermittlung wurde mit dem Kollektivmitgliederverzeichnis des Berufsverbandes Bibliothek Information Schweiz (BIS) abgeglichen und ergänzt. Zusätzlich geben Einzelinterviews mit Fachleuten, die in Dokumentationsinstitutionen tätig sind, Aufschluss über das Berufsverständnis. Die quantitative Betrachtung der 239 Dokumentationsinstitutionen im Verzeichnis und der Vergleich mit Mitgliederlisten der mittlerweile aufgelösten Schweizerischen Vereinigung für Dokumentation (SVD) zeigen, dass die absolute Zahl an Dokumentationseinrichtungen nur geringfügig abgenommen hat. Die inhaltliche Analyse des Verzeichnisses belegt aber, dass sich die Dokumentationslandschaft grundlegend verändert hat. War sie vor 30 Jahren noch sehr industrienah, sind es heute vor allem staatliche, parastaatliche und suprastaatliche Organismen sowie Non-Profit-Organisationen, die Dokumentationsstellen unterhalten. Diese durch den Strukturwandel der Wirtschaft bedingte Verschiebung wird genauer untersucht. Das Verzeichnis offenbart zudem einen dokumentarischen Röstigraben: In der Romandie gibt es überproportional viele Dokumentationsinstitutionen, mit Genf als regelrechter Dokumentationshochburg. Die Gründe dafür sind vielfältig, doch ist die Begrifflichkeit zweifellos ein entscheidender Faktor. Denn während die schweizerdeutsche Berufsbezeichnung «Dokumentalist» ausgedient zu haben scheint, konnte sich «documentaliste» besser halten. Der Terminologie kommt in dieser Arbeit darum massgebende Bedeutung zu. Berücksichtigt wird dabei auch die Konvergenz von Archiv-, Bibliotheks- und Dokumentationswesen. Mit der Berufsausbildung «Fachfrau/Fachmann Information und Dokumentation» wurde diese von den Berufsverbänden teilweise bewusst vorangetrieben, in anderen – wie diese Arbeit zeigt: teilweise überraschenden – Punkten manifestiert sie sich nun eher unkontrolliert. Das Verzeichnis der Dokumentationsinstitutionen selbst wie auch die Auswertung der Interviews bezeugen, dass die klassische dokumentarische Dienstleistungsfunktion nach wie vor gefragt ist. Erweiterungen des Berufsfeldes sind aber angebracht, und teilweise bereits im Gange, zum Beispiel Richtung Wissensmanagement. Für die Zukunft des Dokumentationsberufes ist es nun wichtig, eine passende Bezeichnung zu finden oder zu entwickeln, welche sowohl die Berufsrealität abbildet, als auch gegen aussen einen adäquaten Auftritt erlaubt."}, {"t": "The data librarian's handbook", "au": "Rice, Robin; Southall, John", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Data curation", "Database management", "Data curation in libraries", "Data libraries"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "The Data Librarian's Handbook covers a large amount of interesting terrain in thoughtful and accessible ways. It is both essential for any information professional interested in data and their management, and is also indicative of the increasing - and increasingly varied - role that data and data management play in libraries and more broadly across academia."}, {"t": "The International journal of information, diversity, & inclusion.", "au": "University of Maryland (College Park, Md) Information Policy & Access Center; University of Maryland (College Park, Md) Libraries", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Information technology", "Social aspects", "Social integration"], "br": "1", "coll": "1.3 Revues, périodiques", "abs": "The International Journal of Information, Diversity, & Inclusion (IJIDI) presents wide­ ranging and multidisciplinary perspectives on the intersection of equity, social justice, and information. The IJIDI seeks to expand the discourse on how access to, interaction with, and the use of information by a range of populations can impact individuals, communities, and society. IJIDI is a quarterly, open access, online journal."}, {"t": "The no-nonsense guide to archives and recordkeeping", "au": "Crockett, Margaret", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Management", "Archives", "Archivistique", "Records", "Registratur", "Gestion des documents"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Theory development in the information sciences", "au": "Sonnenwald, Diane H.", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Information science", "Information theory"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "Emerging as a discipline in the first half of the twentieth century, the information sciences study how people, groups, organizations, and governments create, share, disseminate, manage, search, access, evaluate, and protect information, as well as how different technologies and policies can facilitate and constrain these activities. Given the broad span of the information sciences, it is perhaps not surprising that there is no consensus regarding its underlying theory—the purposes of it, the types of it, or how one goes about developing new theories to talk about new research questions. Diane H. Sonnenwald and the contributors to this volume seek to shed light on these issues by sharing reflections on the theory-development process. These reflections are not meant to revolve around data collection and analysis; rather, they focus on the struggles, challenges, successes, and excitement of developing theories. The particular theories that the contributors explore in their essays range widely, from theories of literacy and reading to theories of design and digital search. Several chapters engage with theories of the behavior of individuals and groups; some deal with processes of evaluation; others reflect on questions of design; and the rest treat cultural and scientific heritage. The ultimate goal, Sonnenwald writes in her introduction, is to “encourage, inspire, and assist individuals striving to develop and/or teach theory development.”"}, {"t": "Trusted by whom? TDRs, standards culture and the nature of trust", "au": "Bak, Greg", "y": "2016", "ty": "article-journal", "src": "Archival Science", "link": "https://doi.org/10.1007/s10502-015-9257-1", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "The first part of this paper examines the notion of trust within the suite of standards that anchor the trustworthy digital repository (TDR) concept. The second part traces the short and confusing trajectory of the TDR project at Library and Archives Canada (LAC) and explores the extent to which the failure of LAC TDR should be understood in relation to organizational funding, operational decisions, TDR standards culture or other factors. In the conclusion I suggest that the notion of trust within TDR standards culture is itself evolving in a positive direction that emphasizes user perceptions of trust rather than seeking to establish objective evidence of trust."}, {"t": "Vers de nouveaux catalogues", "au": "Bermès, Emmanuelle", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["LITTERATURE PROFESSIONNELLE", "BIBLIOTHEQUE", "\"Resource description and access\"", "Catalogues de bibliothèques Innovations technologiques", "FRBR (modèle conceptuel)"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Le paysage actuel des catalogues, tel qu'il se dresse à la lecture des contributions au présent ouvrage, voit les systèmes et pratiques évoluer de manières diverses, prenant inspiration dans un environnement technologique extrêmement stimulant, qui favorise les coopérations et l'inventivité et ouvre de nouveaux possibles. Loin de céder à une vision pessimiste des catalogues traditionnels, coeur de métier des bibliothèques, menacés de disparition, il laisse espérer l'émergence de \"nouveaux catalogues\", qui n'en porteront peut-être plus le nom, mais continueront à constituer la plateforme technologique sur laquelle se construit la mission première des bibliothèques : l'accès de tous à la connaissance et aux savoirs."}, {"t": "What are archives?: cultural and theoretical perspectives : a reader", "au": "Craven, Louise", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["Archival materials", "Archives", "Automation", "Philosophy", "Archivists", "Social aspects", "Digitization"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "In the UK, professional texts on archives concentrate on the how, not the why, of professional archival work. At the same time, studies of the theoretical role of the archive and the text are undertaken in other academic disciplines and there is an established forum for the discussion of related issues. This book invites the archivist to that arena of discussion and encourages archivists to step away from the practicalities of keeping archives, and to consider what it is they actually do in the cultural context of the early 21st century."}, {"t": "Évaluer la bibliothèque par les mesures d’impacts", "au": "Touitou, Cécile", "y": "2016", "ty": "book", "src": "", "link": "", "tags": ["bibliothèque", "évaluation", "expérience utilisateur", "Information Science & Library Science", "norme", "ressource numérique"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Faut-il compter les livres que l’on prête ou bien faut-il interroger les lecteurs sur ce qu’ils ont retenu de leur lecture ? Comment évaluer la performance de sa bibliothèque et comment mesurer son impact sur le public qu’elle dessert ? Cerner l’impact de son établissement, dessiner la cartographie de sa zone de chalandise, mesurer les effets induits par l’offre de services ‒ présentiels ou virtuels ‒ sur ses différents publics, calculer la satisfaction et tester, à toutes les étapes d’un projet, l’expérience de l’usager sont parmi les sujets abordés dans cet ouvrage."}, {"t": "Archives in Liquid Times", "au": "Glaudemans, Arnoud; Jonker, Rienk; Smit, Frans", "y": "2017", "ty": "book", "src": "", "link": "https://labyrinth.rienkjonker.nl/sites/default/files/Archives_in_Liquid_Times_0.pdf", "tags": ["Library, archive & information management"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Archives in Liquid Times aims to broaden and deepen the thinking about archives in today’s digital environment. It is a book that tries to fuel the debate about archives in different fields of research. It shows that in these liquid times, archives need and deserve to be considered from different angles. Archives in Liquid Times is a publication in which archival science is linked to philosophy (of information) and data science. Not only do the contributors try to open windows to new concepts and perspectives, but also to new uses of existing concepts concerning archives. The articles in this book contain philosophical reflections, speculative essays and presentations of new models and concepts alongside well-known topics in archival theory.\nAmong the contributors are scholars from different fields of research, like Anne Gilliland, Wolfgang Ernst, Geoffrey Yeo, Martijn van Otterlo, Charles Jeurgens and Geert-Jan van Bussel. This book includes interviews with Luciano Floridi and Eric Ketelaar, in which they reflect on key issues arising from the contributions. The editors are Frans Smit, Arnoud Glaudemans and Rienk Jonker."}, {"t": "Archives: principles and practices", "au": "Millar, Laura", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "ARCHIVE (ARCHIVKUNDE)", "BESTANDSERHALTUNG VON BIBLIOTHEKS- UND ARCHIVBESTÄNDEN (BIBLIOTHEKSWESEN)", "ELEKTRONISCHE ARCHIVIERUNG", "Management", "Archives", "FACHLICHE NACHSCHLAGEWERKE + FACHLEXIKA + HANDBÜCHER (DOKUMENTENTYP)", "ARCHIVKUNDE", "ARCHIVKUNDE/ORGANISATION"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Archivgut im Zeitalter seiner digitalen Verfügbarkeit", "au": "Hollmann, Michael", "y": "2017", "ty": "article-journal", "src": "Archivalische Zeitschrift", "link": "https://doi.org/10.7788/az-2017-950104", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "Der Artikel Archivgut im Zeitalter seiner digitalen Verfügbarkeit wurde am 01.05.2017 in der Zeitschrift Archivalische Zeitschrift (Band 95, Heft 1) veröffentlicht."}, {"t": "Binary trees? Automatically identifying the links between born-digital records", "au": "Spencer, Ross", "y": "2017", "ty": "article-journal", "src": "Archives and Manuscripts", "link": "https://doi.org/10.1080/01576895.2017.1330158", "tags": ["automated description", "born-digital", "digital literacy", "digital techniques", "Item relationships"], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "The sheer volume of records that government organisations, and thus government archives, work with on a daily basis means that there is a chance that relationships between individual records will not easily be captured and recorded. This paper begins by suggesting that the relationships described in archival catalogues will remain at the highest levels of abstraction unless they can be extracted using automated methods. Relationships that can be generated automatically are described in this paper. They will likely be less established than archivists are traditionally used to working with. For example, a so-called ‘fuzzy matching’ technique is discussed that may reveal the ‘points’ of similarity between two records. Extensible databases will be needed to store new links; flexible interfaces will be required to display them. This paper discusses some of the techniques that may currently be available for automatically identifying links between born-digital records by looking at what can be found in the data stream and the relationships digital formats inherently describe. The mechanisms described may be useful for sentencing as well as cataloguing and description. While one size will not fit all, some collections may benefit. The paper concludes by discussing briefly what this work will mean to the end user."}, {"t": "Bücher leihen, Ideen teilen: Bibliotheken in der Sharing Economy", "au": "Müller, Christiane", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "Bibliothèques", "Économie collaborative", "Sharing Economy"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Warum kaufen, wenn man auch leihen kann, was man nur selten benutzt? Diese Idee steckt hinter den vielen Sharing-Angeboten, die derzeit überall aus dem Boden sprießen. Ob Autos, Kleider, Bohrmaschinen oder Arbeitsräume – all das muss man heute nicht mehr selbst besitzen: zumindest in größeren Städten gibt es Unternehmen oder nachbarschaftliche Projekte, die eine Nutzung auf Zeit anbieten. Sie kopieren damit das uralte Geschäftsmodell von Bibliotheken, die seit jeher ihre Bestände so verwalten, dass deren gemeinsame Nutzung durch eine Vielzahl von Menschen möglich wird. Was verändert sich nun für Bibliotheken, wenn so viele Nachahmer auf der Bildfläche erscheinen? Braucht man sie noch – oder können die neuen Konkurrenten deren Aufgabe nicht schneller und besser erfüllen? Oder können sie ganz im Gegenteil von diesem Trend profitieren, weil das Teilen und Tauschen gerade „in“ ist? Dieses Buch geht solchen Fragen nach und bereitet das Thema Sharing Economy und die Auswirkungen auf das Bibliothekswesen grundlegend auf."}, {"t": "Communs du savoir et bibliothèques", "au": "Dujol, Lionel", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Information électronique", "Données ouvertes", "Gestion des connaissances", "LITTERATURE PROFESSIONNELLE", "BIBLIOTHEQUE", "Échange de savoirs", "Liberté d'information"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Le terme de communs du savoir désigne une activité collective et horizontale visant à créer, maintenir et offrir des savoirs en partage. Le développement du numérique a démultiplié les potentiels de création et de diffusion des connaissances, au point d'offrir une opportunité extraordinaire pour construire une société du savoir ouvert et partagé à l'échelle du monde. L'accès au savoir est un droit fondamental et le Manifeste de l'Unesco sur la bibliothèque publique rappelle que les bibliothèques demeurent des institutions facilitatrices et garantes de cet accès de tous aux savoirs, à leur préservation, à leur circulation.\nIl existe indéniablement un lien intime entre bibliothèques et communs du savoir. Mais, en parallèle, une série de stratégies technique, économique ou juridique visent à limiter la circulation et le partage de l'information et du savoir. Ce mouvement d'enclosure n'est pas l'unique fait des acteurs privés ; des institutions publiques, dont des bibliothèques, contribuent également à cette fragilisation des communs de la connaissance.\nOr, les bibliothèques sont les lieux par excellence de la protection, du développement et de la promotion des communs du savoir. Elles incarnent une politique publique d'accès libre et ouvert aux savoirs et reconnaissent à la connaissance partagée un rôle moteur dans le développement des sociétés. C'est l'approche développée dans cet ouvrage, au travers de trois grands champs d'action offerts aux bibliothèques la préservation et la valorisation des biens communs du savoir, la participation à leur enrichissement, le soutien à l'émergence de leur cogestion par les différents acteurs qui les créent ou qui se les approprient."}, {"t": "Currents of archival thinking", "au": "MacNeil, Heather; Eastwood, Terry", "y": "2017", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "With new technologies and additional goals driving their institutions, archives are changing drastically. This book shows how the core foundations of archival practice can be brought forward to adapt to new environments―while adhering to the key principles of preservation and access."}, {"t": "Digital preservation for libraries, archives, and museums", "au": "Corrado, Edward M.; Moulaison, Heather Léa", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "ARCHIVE (ARCHIVKUNDE)", "Bestand", "BESTANDSERHALTUNG VON BIBLIOTHEKS- UND ARCHIVBESTÄNDEN (BIBLIOTHEKSWESEN)", "Bibliothek", "BIBLIOTHEKSWESEN + BIBLIOTHEKSWISSENSCHAFTEN + BIBLIOTHEKEN", "Digital preservation", "Digitale Daten", "DIGITALE DOKUMENTE + ELEKTRONISCHE DOKUMENTE (BIBLIOTHEKSWESEN)", "Digitalisierung", "Electronic information resources", "ELEKTRONISCHE ARCHIVIERUNG", "ELEKTRONISCHE BIBLIOTHEKEN (BIBLIOTHEKSWESEN)", "Erhaltung", "Langzeitarchivierung", "LEHRBÜCHER (DOKUMENTENTYP)", "Management", "Metadaten", "METADATEN (BIBLIOTHEKSWESEN)", "MUSEEN", "Museum", "Neue Medien", "Preservation metadata"], "br": "2", "coll": "2.5 Ouvrages et articles; 3.5.1 Documentation de base", "abs": ""}, {"t": "Digitizing the Modern Library and the Transition From Print to Electronic", "au": "Bhardwaj, Raj Kumar", "y": "2017", "ty": "book", "src": "", "link": "https://www.igi-global.com/book/digitizing-modern-library-transition-print/www.igi-global.com/book/digitizing-modern-library-transition-print/172015", "tags": [""], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "The development of online digital libraries has enhanced the availability of printed materials. By implementing these systems, this ensures the access of material to universities, students, and bibliophiles. Digitizing the Modern Library and the Transition From Print to Electronic is a pivotal refer..."}, {"t": "Documenting performance : the context and processes of digital curation and archiving", "au": "Sant, Toni", "y": "2017", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"Performance in the digital age has undergone a radical shift in which a once ephemeral art form can now be relived, replayed and repeated. Until now, much scholarship has been devoted to the nature of live performance in the digital age; Documenting Performance is the first book to provide a collection of key writings about the process of documenting performance, focused not on questions of liveness or the artistic qualities of documents, but rather on the professional approaches to recovering, preserving and disseminating knowledge of live performance. Through its four-part structure, the volume introduces readers to important writings by international practitioners and scholars on: * the contemporary context for documenting performance * processes of documenting performance * documenting bodies in motion * documenting to create In each, chapters examine the ways performance is documented and the issues arising out of the process of documenting performance. While theorists have argued that performance becomes something else whenever it is documented, the writings reveal how the documents themselves cannot be regarded simply as incomplete remains from live events. The methods for preserving and managing them over time, ensuring easy access of such materials in systematic archives and collections, requires professional attention in its own right. Through the process of documenting performance, artists acquire a different perspective on their own work, audiences can recall specific images and sounds for works they have witnessed in person, and others who did not see the original work can trace the memories of particular events, or use them to gain an understanding of something that would otherwise remain unknown to them and their peers\"– Provided by publisher."}, {"t": "Du livre à la ville: la bibliothèque comme espace public", "au": "Failla, Luigi", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "Bibliothèques", "Zukunft", "21e siècle (début)", "AIRES DE RÉCRÉATION + ESPACES RÉCRÉATIFS (URBANISME)", "Aménagement", "ARCHITECTURE DU XXIe SIÈCLE", "Aspect social", "BÂTIMENTS DE BIBLIOTHÈQUES + BÂTIMENTS D'ARCHIVES (ARCHITECTURE)", "Bibliothèques (constructions)", "BIBLIOTHÈQUES PUBLIQUES (BIBLIOTHÉCONOMIE)", "ESPACE PUBLIC (ÉTUDE DES HABITATS)", "Espaces publics", "FACTEURS HUMAINS (COMMUNICATION)", "Lieux de vie et d'accueil", "Öffentlicher Raum", "Services aux publics", "SOURCES DE LA CONNAISSANCE + CONDITIONS DE LA CONNAISSANCE (ÉPISTÉMOLOGIE)", "Stadtbibliothek"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Alors que ta mort du livre traditionnel ne cesse d'être annoncée, et qu'est partout constatée une baisse générale de la lecture, les bibliothèques demeurent des lieux très fréquentés, voire saturés. Leurs usagers semblent cependant s'intéresser davantage aux espaces mis à disposition qu'aux contenus culturels proposés. C'est ainsi que nombre d'établissements publics mettent désormais en exergue des appellations telles que lieu de vie, troisième lieu, espace pour tous, qui témoignent du besoin de la société contemporaine d'avoir des lieux protégés pour les activités collectives.\nLes bibliothèques publiques vont-elles devenir des musées abritant les restes d'une technologie (le livre) tombée en désuétude ? Se transformeront-elles en server rooms auxquelles on accédera à distance ? Par un renversement de point de vue, Luigi Failla postule un changement de paradigme qui voit le futur de la bibliothèque publique se dessiner non plus seulement selon une évolution liée aux supports de lecture (la question controversée du livre), mais également à son développement en tant qu'espace public et à la manière dont s'y inscrivent les nouveaux rapports à la connaissance.\nLe potentiel de la bibliothèque de consolider le lien entre la ville et l'homme contemporain invalide tes fondements des années 1990, basés sur une vision hiérarchique de l'espace, au profit d'une conception vicinale. La définition d'un espace non-hiérarchique apparaît alors comme l'emblème de tout projet architectural."}, {"t": "Einführung in die Kulturwissenschaft: Grundbegriffe, Themen, Fragestellungen", "au": "Assmann, Aleida", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Culture", "20e siècle", "American literature", "Anglistik", "Concepts", "English literature", "History and criticism", "Kulturwissenschaften", "Literaturwissenschaft", "Themes, motives", "Théorie littéraire"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Das Buch gliedert sich in die Kapitel ,Zeichen‘, ,Medien‘, ,Körper‘, ,Zeit‘, ,Raum‘, ,Gedächtnis‘, ,Identität‘. Es möchte möglichst voraussetzungslose Einstiege in komplexere theoretische und historische Zusammenhänge eröffnen und dabei auch das Interesse an Literatur verschiedener Gattungen und Epochen wecken. Der Band versteht sich nicht nur als Einführung, sondern auch als ein studienbegleitendes Hilfsmittel für eigenständige Erkundungen des Zusammenhangs von Textlektüre und wichtigen aktuellen Grundfragen der Kultur."}, {"t": "Emerging Trends in Archival Science", "au": "Gracy, Karen F.", "y": "2017", "ty": "book", "src": "", "link": "https://rowman.com/ISBN/9781442275157/", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Emerging Trends in Archival Science provides readers with an excellent overview of the variety and scope of current scholarly thinking in archival science. It examines how people create, manage, a..."}, {"t": "Handbuch Informationskompetenz", "au": "Sühl-Strohmenger, Wilfried", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "Information literacy", "Informationskompetenz", "Study and teaching"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "This work offers a basic overview of information literacy from the perspective of the library and information sciences. It includes essays on strategies for practical implementation of support for information literacy in schools, universities, and research facilities. A particular focus is placed on designing such programs to promote learning through calculated spatial and technical infrastructures and didactically effective planning."}, {"t": "Information and society", "au": "Buckland, Michael", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Documentation", "Social aspects", "Information science", "Information society", "Communication", "Sociological aspects"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "We live in an information society, or so we are often told. But what does that mean? This volume in the MIT Press Essential Knowledge series offers a concise, informal account of the ways in which information and society are related and of our ever-increasing dependence on a complex multiplicity of messages, records, documents, and data."}, {"t": "Informationsressourcen: ein Handbuch für Bibliothekare und Informationsspezialisten", "au": "Lauber-Reymann, Margrit", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "ELEKTRONISCHE BIBLIOTHEKEN (BIBLIOTHEKSWESEN)", "BIBLIOTHEKSDIENSTLEISTUNGEN (BIBLIOTHEKSWESEN)", "FACHLICHE NACHSCHLAGEWERKE + FACHLEXIKA + HANDBÜCHER (DOKUMENTENTYP)", "Information und Dokumentation", "INFORMATIONSWISSENSCHAFTEN + DOKUMENTATIONSWISSENSCHAFTEN (BIBLIOTHEKSWESEN)", "Wissenschaftliche Bibliothek", "INFORMATIONS- UND LITERATURRECHERCHEN (WISSENSCHAFTLICHE ARBEITSTECHNIK)", "Information resources", "BIBLIOGRAPHIEN", "BIBLIOTHEKSKATALOGE", "Elektronisches Informationsmittel", "INFORMATIONSDATENBANKEN + FACHSPEZIFISCHE DATENBANKEN (BIBLIOTHEKSWESEN)", "Informationsmittel", "Informationsquelle", "SONDERKATALOGE + THEMATISCHE KATALOGE (BIBLIOTHEKSKATALOGE)", "VIRTUELLE BIBLIOTHEKEN (BIBLIOTHEKSWESEN)"], "br": "1", "coll": "1.5.1 Documentation de base; 3.5.1 Documentation de base", "abs": "Dieser bewährte Band bietet Informationsspezialisten eine aktualisierte Einführung in den Umgang mit Informationsressourcen. Nach der Darstellung von theoretischen Grundlagen werden ca. 500 allgemeine und fachspezifische Informationsressourcen ausgewählt und deren Inhalte, Funktionen und Bedeutung beschrieben. Neu hinzugekommen sind Abschnitte über Discovery Services, Forschungsdatenbanken und Fachinformationsdienste für
