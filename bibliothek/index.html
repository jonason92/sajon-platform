"", "link": "", "tags": ["Archives", "Archivistique", "Europe", "History", "20th century", "Histoire", "Archives - Europe - History", "Archives - Histoire", "Archives - History", "Archivistique - Europe - Histoire", "Archivistique - Histoire", "Livres électronique", "Livres électroniques", "National characteristics, Swedish", "Social life and customs", "Sweden"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Comment, au fil du temps, a-t-on conservé, traité et mis en valeur les documents ou supports de l'information? À partir d'exemples choisis en Europe, en Afrique, en Amérique et en Asie, l'auteur décrit et analyse les différentes techniques et méthodes employées, des origines à nos jours, en archivistique. Destiné aux archivistes et aux historiens, cet ouvrage présente les fondements culturels et historiques de l'archivistique tout en nous éclairant sur la formation des États et le fonctionnement des administrations ou des entreprises publiques ou privées."}, {"t": "Évaluer la performance des bibliothèques", "au": "Carbone, Pierre", "y": "1998", "ty": "article-journal", "src": "Bulletin des bibliothèques de France (BBF)", "link": "https://bbf.enssib.fr/consulter/bbf-1998-06-0040-005", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "L'ISO vient de publier une norme internationale sur les indicateurs de performance des bibliothèques. Cette norme, qui s'est appuyée sur les manuels existants, est un outil essentiel pour évaluer la qualité du service rendu. Le dialogue entre les bibliothécaires, les usagers et les décideurs sera en effet facilité par la mise en uvre d'indicateurs permettant de confronter les résultats aux missions et aux objectifs de la bibliothèque. De la sorte, les indicateurs de performance constituent un élément central d'un système d'aide à la décision en bibliothèque."}, {"t": "International bibliography of bibliographies in Library and Information Science: and related fields NIK)", "STAATSARCHIVE"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Einführung in den Informationsbegriff", "au": "Capurro, Rafael", "y": "2000", "ty": "webpage", "src": "", "link": "http://www.capurro.de/infovorl-einl.htm", "tags": [""], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Zweck der folgenden Untersuchungen ist nicht eine Diskussion dieser und anderer Thesen über die Informationsgesellschaft, sondern eine Klärung ihrer begrifflichen Grundlagen, genauer, jenes Begriffs der, wie kaum ein anderer in diesem Jahrhundert, für die unterschiedlichsten Auslegungen Anlaß gegeben hat und noch gibt, nämlich den Informationsbegriff. Worte wie Information und Atom sind Signaturen unseres Zeitalters. Es lohnt sich, darüber nachzudenken. Aus dem im Alltag allgegenwärtig vorkommenden Wort 'Information' haben sich im Laufe dieses Jahrhunderts immer speziellere Anwendungen und Theorien entwickelt, die sich wiederum auf den Alltag auswirken. Aber auch der alltägliche Informationsbegriff ist alles andere als einfach und er ist, wenn man genauer hinschaut, auch nicht neu, trotz des gegenteiligen Anscheins."}, {"t": "La mémoire, l'histoire, l'oubli", "au": "Ricœur, Paul", "y": "2000", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Publications des archives de l'Université Catholique de Louvain", "au": "Université catholique de Louvain Archives", "y": "2000", "ty": "book", "src": "", "link": "https://uclouvain.be/fr/decouvrir/archives/publications.html", "tags": ["ARCHIVE (ARCHIVKUNDE)", "HOCHSCHULGESCHICHTE (HOCHSCHULWESEN)", "LEUVEN (BELGIEN)", "Université catholique de Louvain Archives"], "br": "2", "coll": "2.3 Revues, périodiques", "abs": ""}, {"t": "Records management: mode d'emploi", "au": "Drouhet, Geneviève", "y": "2000", "ty": "book", "src": "", "link": "", "tags": ["archives courantes et intermédiaires - gestion"], "br": "2", "coll": "2.5 Ouvrages et articles; 1d R ème intégré de gestion des documents analogiques et des documents numériques", "au": "Roberge, Michel", "y": "2004", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Administration publique", "Elektronische Medien", "Gestion de l'information", "Elektronische Bibliothek", "document électronique", "Entreprises", "Gestion des connaissances", "archives courantes et intermédiaires - gestion", "Bibliotheksbestand", "Gestion d'entreprise", "ARCHIVES (ARCHIVISTICS)", "archives d'entreprise - gestion", "Bestandsverwaltung", "document - classement", "RECORDS, ARCHIVES, DOCUMENTS"], "br": "2", "coll": "2.5 Ouvrages et articles; 1d Records Management", "abs": ""}, {"t": "Une république documentaire. Lettre ouverte à une jeune bibliothécaire et autres textes", "au": "Gautier-Gentès, Jean-Luc", "y": "2004", "ty": "book", "src": "", "link": "https://www.enssib.fr/bibliotheque-numerique/documents/60542-une-republique-documentaire.pdf", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": ""}, {"t": "Archive und Gedächtnis: Festschrift für Botho Brachmann", "au": "Beck, Friedrich; Henning, Eckart", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archives", "Germany", "Archivkunde", "Geschichte", "Social aspects", "Historiography", "Brachmann, Botho", "Brachmann, Botho 1930-", "Memory"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Archives & [and] archivists in the information age", "au": "Cox, Richard J.", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["Archivistes", "Archivistique", "États-Unis"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Archives: recordkeeping in society", "au": "McKemmish, Sue; Piggott, Michael; Reed, Barbara; Upward, Frank", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["Management", "Archives", "Records", "Archival resources"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Archives: Recordkeeping in society introduces the significance of archives and the results of local and international research in archival science. It explores the role of recordkeeping in various cultural, organisational and historical contexts. Its themes include archives as a web of recorded information: new information technologies have presented dilemmas, but also potentialities for managing of the interconnectedness of archives. Another theme is the relationship between evidence and memory in archives and in archival discourse. It also explores recordkeeping and accountability, memory, s"}, {"t": "Business Processes: An Archival Science Approach to Collaborative Decision Making, Records, and Knowledge Management", "au": "Menne-Haritz, Angelika", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["Management", "Information technology", "Artificial intelligence", "Artificial Intelligence", "Business—Data processing", "Computer graphics", "Computer Graphics", "IT in Business", "Social sciences", "Social Sciences, general"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Collaborative decision making processes are a form of communication inside organizations. Their functioning can teach lessons for the design of electronic office systems. Those processes are open ended and therefore decide themselves on their form. Like oral deliberations which cannot be modelled in advance any open ended communication process needs means for common control over the further advancement and the ending of the process. The history of German administrative practice and its special methods of using disposals for the control of common processes shows the creation of records as based on communication needs generated by the intention of joint actions. For electronic decision making processes the purposes remain the same, but the means have to follow the effects of electronic communication on messages. The book is a reworked English version of a thesis for the official qualification for university professorship accepted by the German University of Administrative Sciences Speyer. Germany."}, {"t": "Dokumentations- und Ordnungslehre: Theorie und Praxis des Information Retrieval", "au": "Gaus, Wilhelm", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["LEHRBÜCHER (DOKUMENTENTYP)", "Information storage and retrieval systems", "Data processing", "Dokumentation", "DOKUMENTATION, FACHLICHE UND FORMALE SPEZIALISIERUNGEN", "Information", "Information und Dokumentation", "Information science", "Information Retrieval", "INFORMATIONSSPEICHERUNG + INFORMATIONSGEWINNUNG (INFORMATIONSSYSTEME)", "Information retrieval", "Bibliothekswesen", "Computer science", "Information systems", "INFORMATIONS- UND LITERATURRECHERCHEN (WISSENSCHAFTLICHE ARBEITSTECHNIK)", "INFORMATIONSINDUSTRIE", "Informationssuche", "Klassifikation", "KLASSIFIKATION", "Medizinische Informatik", "Ordnungslehre"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Dokumentation und Information Retrieval, also das gezielte Wiederauffinden von Informationen zu thematisch-inhaltlichen Fragestellungen sind wichtiger als je zuvor. Die hier vorliegende theoretisch fundierte und praxisorientierte Darstellung der Literatur-, Daten- und Faktendokumentation enthält viele instruktive Beispiele und praktische Übungen sowie einen umfassenden Beispielthesaurus und behandelt ausführlich Ordnungs- und Retrievalsysteme. Jedes Thema wird mit zahlreichen Prüfungsfragen abgeschlossen.\n\nDieses Lehrbuch ist in seiner systematischen Darstellung und didaktischen Aufbereitung einzigartig. Durch sein ausführliches Sachwortregister eignet es sich auch als Nachschlagewerk. Des Weiteren werden insbesondere aktuelle Entwicklungen im Bereich der Datenbanken und des Internets berücksichtigt. Das Internet bietet schnellen Zugriff auf eine unübersehbare Informationsfülle, die aber nur zum Teil dokumentarisch aufbereitet und formal strukturiert ist. Diese dokumentarischen Schwächen kann ein guter Rechercheur überwinden, wenn er mit der Dokumentations- und Ordnungslehre vertraut ist. Die fünfte Auflage ist aktualisiert und erweitert worden."}, {"t": "Handbuch für Wirtschaftsarchive: Theorie und Praxis", "au": "Kroker, Evelyn; Köhne-Lindenlaub, Renate; Reininghaus, Wilfried", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "ARCHIVE (ARCHIVKUNDE)", "Deutschland", "Wirtschaftsarchiv", "FACHLICHE NACHSCHLAGEWERKE + FACHLEXIKA + HANDBÜCHER (DOKUMENTENTYP)", "Archivverwaltung"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Harrod's librarians' glossary and reference book: a directory of over 10,200 terms, organizations, projects and acronyms in the areas of information management, library science, publishing and archive management", "au": "Prytherch, Raymond John", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "BIBLIOTHEKSWESEN + BIBLIOTHEKSWISSENSCHAFTEN + BIBLIOTHEKEN", "Administration", "Archives", "Bibliothéconomie", "FACHLICHE NACHSCHLAGEWERKE + FACHLEXIKA + HANDBÜCHER (DOKUMENTENTYP)", "ARCHIVKUNDE", "Information science", "INFORMATIONSWISSENSCHAFTEN + DOKUMENTATIONSWISSENSCHAFTEN (BIBLIOTHEKSWESEN)", "Library science", "Sciences de l'information", "BIBLIOGRAPHIEN", "Bibliography", "Book industries and trade", "BUCHHANDEL, BUCHKUNDE, VERLAGSWESEN UND DRUCKEREIWESEN", "ENGLISCH (WÖRTERBÜCHER)", "Publishers and publishing"], "br": "3", "coll": "3.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Information Sharing on the Semantic Web", "au": "Stuckenschmidt, Heiner; Van Harmelen, Frank", "y": "2005", "ty": "book", "src": "", "link": "http://link.springer.com/10.1007/b138282", "tags": ["World Wide Web", "Information Retrieval", "Web", "knowledge management", "ontology", "semantic web", "data structure", "E-Commerce", "OntoBroker", "Ontologies", "organization", "OWL", "RDF", "search engine marketing (SEM)", "XML"], "br": "", "coll": "2c Information Retrieval", "abs": ""}, {"t": "L'archivistique à l'heure du paradigme de l'information... ou la « Révolution » numérique à l'«âge» archivistique", "au": "Grimard, Jacques", "y": "2005", "ty": "article-journal", "src": "Archives (Québec)", "link": "", "tags": ["Sciences de l'information et de la communication", "Sciences de l'information et des bibliothèques. Etude d'ensemble", "Sciences de l'information. Documentation", "Sciences et techniques communes", "Sciences exactes et technologie", "Aspects professionnels"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Les fonctions de l'archivistique contemporaine", "au": "Couture, Carol; Arès, Florence", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["archives - gestion", "archivistique"], "br": "2", "coll": "2.5 Ouvrages et articles; 1d Records Management", "abs": ""}, {"t": "More Product, Less Process: Revamping Traditional Archival Processing", "au": "Greene, Mark A.; Meissner, Dennis", "y": "2005", "ty": "article-journal", "src": "The American Archivist", "link": "https://www.jstor.org/stable/40294290", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Processing backlogs continue to be a problem for archivists, and yet the problem is exacerbated by many of the traditional approaches to processing collections that archivists continue to practice. This research project reviewed the literature on archival processing and conducted surveys of processing practices to identify the scope of the problem and its impacts both on processing costs and on access to collections. The paper issues a call for archivists to rethink the way they process collections, particularly large contemporary collections. It challenges many of the assumptions archivists make about the importance of preservation activities in processing and the arrangement and description activities necessary to allow researchers to access collections effectively."}, {"t": "Neue Perspektiven archivischer Bewertung", "au": "Bischoff, Frank M.; Kretzschmar, Robert (Hg.)", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["ARCHIVE (ARCHIVKUNDE)", "DEUTSCHLAND (MITTELEUROPA). BUNDESREPUBLIK DEUTSCHLAND", "AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "SCHWEIZ (MITTELEUROPA). SCHWEIZERISCHE EIDGENOSSENSCHAFT", "BEWERTUNG (ALLGEMEIN)", "ARCHIVKUNDE", "FALLSTUDIEN (DOKUMENTENTYP)"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Providing reference services for archives & [and] manuscripts", "au": "Pugh, Mary Jo", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["Archives", "États-Unis", "Manuscrits", "service de renseignements (bibliothèque)"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Selecting & appraising archives & manuscripts", "au": "Boles, Frank", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["États-Unis", "Manuscrits", "Bibliothèques", "Acquisitions", "Services d'archives"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Spinning the Semantic Web: Bringing the World Wide Web to Its Full Potential", "au": "Fensel, Dieter", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["Computers / Internet / General"], "br": "", "coll": "2c Information Retrieval", "abs": "As the World Wide Web continues to expand, it becomes increasingly difficult for users to obtain information efficiently. Because most search engines read format languages such as HTML or SGML, search results reflect formatting tags more than actual page content, which is expressed in natural language. Spinning the Semantic Web describes an exciting new type of hierarchy and standardization that will replace the current \"web of links\" with a \"web of meaning.\" Using a flexible set of languages and tools, the Semantic Web will make all available information -- display elements, metadata, services, images, and especially content -- accessible. The result will be an immense repository of information accessible for a wide range of new applications.This first handbook for the Semantic Web covers, among other topics, software agents that can negotiate and collect information, markup languages that can tag many more types of information in a document, and knowledge systems that enable machines to read Web pages and determine their reliability. The truly interdisciplinary Semantic Web combines aspects of artificial intelligence, markup languages, natural language processing, information retrieval, knowledge representation, intelligent agents, and databases."}, {"t": "Usages des bibliothèques: approche sociologique et méthodologie d'enquête", "au": "Poissenot, Claude sociologue 19-; Ranjard, Sophie", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["Bibliothèques", "bibliothèque - utilisation", "enquête sociale", "Méthodologie", "usager"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Usages des bibliothèques: approche sociologique et méthodologie d'enquête", "au": "Poissenot, Claude sociologue 19-", "y": "2005", "ty": "book", "src": "", "link": "", "tags": ["Bibliothèques", "bibliothèque - utilisation", "enquête sociale", "Méthodologie", "usager"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Zur Theorie der Bibliothekskataloge und Suchmaschinen", "au": "Eversberg, Bernhard", "y": "2005", "ty": "webpage", "src": "", "link": "http://www.allegro-b.de/doku/regeln/tks.htm", "tags": [""], "br": "3", "coll": "3.5.1 Documentation de base", "abs": ""}, {"t": "Digital preservation", "au": "Tanner, Simon; Deegan, Marilyn", "y": "2006", "ty": "book", "src": "", "link": "", "tags": ["BESTANDSERHALTUNG VON BIBLIOTHEKS- UND ARCHIVBESTÄNDEN (BIBLIOTHEKSWESEN)", "Digital preservation", "Digitale Daten", "DIGITALE DOKUMENTE + ELEKTRONISCHE DOKUMENTE (BIBLIOTHEKSWESEN)", "ELEKTRONISCHE ARCHIVIERUNG", "Langzeitarchivierung", "History", "Archivierung", "Konservierung", "FALLSTUDIEN (DOKUMENTENTYP)", "Elektronische Publikation", "document électronique - conservation" icles; 1d Records Management", "abs": "Records Management ist eine zukunftsträchtige Querschnittfunktion im Grenzgebiet zwischen Organisationslehre, Betriebswirtschaft, Recht, Qualitätsmanagement, Archivistik, Informationsmanagement und Wirtschaftsinformatik. Organisationen jeder Art kommen ohne rationelles und effizientes Records Management in der E-Gesellschaft nicht aus. Das Handbuch bietet den neuesten Stand der Records-Management-Lehre sowie pragmatische Lösungsansätze, Handbuch zum Umgang mit RM, welches im Grenzgebiet zwischen Organisationslehre, Betriebswirtschaft, Recht, Qualitätsmanagement, Archivistik, Informationsmanagement und Wirtschaftsinformatik anzusiedeln ist"}, {"t": "Wissensmanagement für KMU", "au": "Belliger, Andréa; Krieger, David", "y": "2007", "ty": "book", "src": "", "link": "", "tags": ["Neue Medien", "AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "Schweiz", "Informationsmanagement", "Evaluation", "Wissensmanagement", "Gestion des connaissances", "Eidgenössische Technische Hochschule Zürich", "Entscheidung", "Förderungsprogramm", "Forschung und Entwicklung", "Geschichte 2000-2005", "Humankapital", "Innovation", "Innovationsprozess", "Klein- und Mittelbetrieb", "KLEINE UND MITTLERE UNTERNEHMEN", "Know-how-Transfer", "Netzwerk", "Petites et moyennes entreprises", "Projekt", "Technologietransfer", "Wissens- und Technologietransfer", "WISSENSMANAGEMENT"], "br": "2", "coll": "2.5 Ouvrages et articles; 2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Actualité archivistique suisse: travaux du certificat en archivistique et sciences de l'information = Archivwissenschaft Schweiz aktuell : Arbeiten aus dem Zertifikat in Archiv- und Informationswissenschaften", "au": "Coutaz, Gilbert; Meystre-Schaeren, Nicole; Roth-Lochner, Barbara; Steimeier, Andreas", "y": "2008", "ty": "book", "src": "", "link": "", "tags": ["archives", "Suisse", "archivistique"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Contient la liste des travaux personnels ainsi que les coordonnées des participants (p. 248-288), Avec des références à la situation prévalant dans le canton de Vaud: Nicole Meystre-Schaeren, Les universités et leurs archives : pour un patrimoine qui reflète les activités des hautes écoles - p. 118-126; Jean-Luc Wermeille, La généalogie comme image de marque: valorisation d'un patrimoine archivistique très sollicité - p. 180-202, Orienté vers la pratique, le volume réunit une douzaine de travaux de diplôme issus du certificat en archivistique des universités de Lausanne, Berne et Genève, volées 2004 et 2006. Rédigés en allemand et en français, ces travaux proposent des solutions applicables dans un large éventail de centres d'archives, incluant les Archives communales et des Archives de paroisses. Les sujets vont du record management à la gestion des Archives, en passant par l'évaluation et l'archivage électronique"}, {"t": "Bambou", "au": "", "y": "2008", "ty": "post-weblog", "src": "", "link": "https://docmiop.wordpress.com/a-propos/", "tags": [""], "br": "3", "coll": "3.6.2 Blogs", "abs": "Bambou est un blog spécialisé dans le domaine des sciences de l’information et de la documentation. Il a pour objectifs principaux de favoriser la formation continue, la veille informationnel…"}, {"t": "Count the traffic", "au": "", "y": "2008", "ty": "speech", "src": "", "link": "https://archive.ifla.org/IV/ifla74/papers/107-Hoivik-en.pdf", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Librarians have, in general, very little systematic information about activities inside their libraries. Staff meets users every day, so there is no shortage of impressions, ideas and mental images. But this information is ad hoc and qualitative rather than systematic and quantitative. Most quantitative user studies, like the well-known LibQUAL, tend to gather data by interviews and questionnaires rather than by direct observation of behavior."}, {"t": "Dictionnaire de l'information", "au": "Cacaly, Serge; Le Coadic, Yves-François; Pompart, Paul-Dominique; Sutter, Eric", "y": "2008", "ty": "book", "src": "", "link": "", "tags": ["Documentation", "Informations- und Dokumentationswissenschaft", "Sciences de l'information"], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "DPC Technology Watch Reports", "au": "Digital Preservation Coalition", "y": "2008", "ty": "book", "src": "", "link": "https://www.dpconline.org/digipres/discover-good-practice/tech-watch-reports", "tags": [""], "br": "2", "coll": "2.3 Revues, périodiques", "abs": "DPC Technology Watch publications provide authoritative guidance on a variety of digital preservation topics chosen by Coalition members. They are designed to inform our membership, and those in the wider community, in an accessible and easily digestible manner."}, {"t": "Introduction to Information Retrieval", "au": "Manning, Christopher D.; Raghavan, Prabhakar; Schütze, Hinrich", "y": "2008", "ty": "book", "src": "", "link": "", "tags": ["Computers / Databases / General", "Computers / Desktop Applications / Word Processing", "Computers / Programming / Object Oriented", "Computers / Programming Languages / General", "Computers / System Administration / Storage & Retrieval"], "br": "", "coll": "2c Information Retrieval", "abs": "Class-tested and coherent, this groundbreaking new textbook teaches web-era information retrieval, including web search and the related areas of text classification and text clustering from basic concepts. Written from a computer science perspective by three leading experts in the field, it gives an up-to-date treatment of all aspects of the design and implementation of systems for gathering, indexing, and searching documents; methods for evaluating systems; and an introduction to the use of machine learning methods on text collections. All the important ideas are explained using examples and figures, making it perfect for introductory courses in information retrieval for advanced undergraduates and graduate students in computer science. Based on feedback from extensive classroom experience, the book has been carefully structured in order to make teaching more natural and effective. Although originally designed as the primary text for a graduate or advanced undergraduate course in information retrieval, the book will also create a buzz for researchers and professionals alike."}, {"t": "Keeping archives", "au": "Bettington, Jackie; Eberhard, Kim; Loo, Rowena; Smith, Clive", "y": "2008", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "L'enquête de satisfaction: guide méthodologique", "au": "Millot, Sophie", "y": "2008", "ty": "book", "src": "", "link": "", "tags": ["client", "satisfaction - évaluation"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "L'enquête de satisfaction: guide méthodologique", "au": "Millot, Sophie", "y": "2008", "ty": "book", "src": "", "link": "", "tags": ["client", "satisfaction - évaluation"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "La pratique archivistique française", "au": "France Direction des archives", "y": "2008", "ty": "book", "src": "", "link": "", "tags": ["Archivistique", "France"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Les archives privées: manuel pratique et juridique", "au": "Nougaret, Christine; Even, Pascal", "y": "2008", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archivkunde", "France", "Frankreich", "Archives privées", "Privatarchiv", "Recht"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Les lieux de mémoire", "au": "Nora, Pierre", "y": "2008", "ty": "book", "src": "", "link": "", "tags": ["Geschichte", "Frankreich", "Erinnerung", "Geschichtsschreibung", "Kollektives Gedächtnis", "Ort"], "br": "2", ENTENTYP)", "Information und Dokumentation", "Bibliothekswissenschaft", "Information science", "Informations- und Dokumentationswissenschaft", "INFORMATIONSWISSENSCHAFTEN + DOKUMENTATIONSWISSENSCHAFTEN (BIBLIOTHEKSWESEN)", "Library science", "Sciences de l'information", "Systèmes d'information", "Allemand (langue)", "Bibliologie", "German"], "br": "1", "coll": "1.4 Dictionnaires, encyclopédies; 3.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Mettre en oeuvre un plan de classement", "au": "Calenge, Bertrand", "y": "2009", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "Frankreich", "Klassifikation", "Classification", "ÉTUDES DE CAS (TYPE DE DOCUMENT)", "BIBLIOTHÈQUES EN LIBRE-ACCÈS + FONDS EN LIBRE-ACCÈS (BIBLIOTHÉCONOMIE)", "CLASSEMENT AU RAYON (BIBLIOTHÉCONOMIE)", "Classement systématique", "DÉVELOPPEMENT DES COLLECTIONS + GESTION DES COLLECTIONS (BIBLIOTHÉCONOMIE)", "Freihandbereich", "libre-accès (bibliothèque)", "libre-accès (bibliothèque) - aménagement", "SYSTÈMES DE CLASSIFICATION (BIBLIOTHÉCONOMIE)"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Les espaces en libre accès réclament lisibilité et pertinence documentaire. Pour y parvenir, les bibliothécaires se trouvent confrontés à un triple défi : réussir à organiser les collections intellectuellement, mais aussi physiquement, dans un lieu particulier, et enfin tenir compte des publics et des usages. L'aménagement des espaces documentaires, et particulièrement la mise en oeuvre de pl. de classement, est une nécessité ressentie par les professionnels.\nCet ouvrage fournit un mode opératoire précis, illustré à partir d'exemples concrets, pour mener ce type de projet. La première part' concerne l'étude des collections et des spécificités architecturales, tandis que la deuxième est consacrée à la constitution du manuel de cotation, pour finir sur la maintenance et l'évolution du plan de classement dans le temps. Ce volume est la boîte à outils indispensable à tous ceux qui ont à réaliser un tel chantier."}, {"t": "Pratique des relations presse", "au": "Morel, Philippe", "y": "2009", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Theories of information behavior", "au": "Fisher, Karen E.; Erdelez, Sandra; McKechnie, Lynne", "y": "2009", "ty": "book", "src": "", "link": "", "tags": ["Information science", "Information Retrieval", "Information retrieval", "Information behavior", "Informationsverhalten", "Information resources", "Research"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "This unique book presents authoritative overviews of more than 70 conceptual frameworks for understanding how people seek, manage, share, and use information in different contexts. A practical and readable reference to both well-established and newly proposed theories of information behavior, the book includes contributions from 85 scholars from 10 countries. Each theory description covers origins, propositions, methodological implications, usage, links to related conceptual frameworks, and listings of authoritative primary and secondary references. The introductory chapters explain key concepts, theorymethod connections, and the process of theory development."}, {"t": "Zwischen analog und digital - Schriftgutverwaltung als Herausforderung für Archive: Beiträge zum 13. Archivwissenschaftlichen Kolloquium der Archivschule Marburg", "au": "Lutz, Alexandra", "y": "2009", "ty": "paper-conference", "src": "", "link": "https://www.archivschule.de/DE/publikation/veroeffentlichungsreihe/voe49-online.html", "tags": ["Archivkunde", "Registratur"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Archive im Kontext: Öffnen, Erhalten und Sichern von Archivgut in Zeiten des Umbruchs : Festschrift für Prof. Dr. Hartmut Weber zum 65. Geburtstag", "au": "Menne-Haritz, Angelika; Hofmann, Rainer", "y": "2010", "ty": "book", "src": "", "link": " rchival materials", "Archivbestand", "Archives", "Benutzung", "Archives users", "Automation", "Benutzer", "Blogs", "Data processing", "Design", "Diffusion sélective de l'information", "Information électronique", "Information technology", "Informationsmanagement", "Online social networks", "Réseaux sociaux", "Technological innovations", "Web 2.0", "Web archives", "Web archiving", "Web sites", "Wikis (Computer science)", "World Wide Web", "World Wide Web 2.0"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "About the authors", "au": "Allemang, Dean; Hendler, Jim", "y": "2011", "ty": "chapter", "src": "Semantic Web for the Working Ontologist (Second Edition)", "link": "https://www.sciencedirect.com/science/article/pii/B978012385965510024X", "tags": [""], "br": "", "coll": "ScienceDirect_citations_1689943166380", "abs": ""}, {"t": "Acknowledgments", "au": "Allemang, Dean; Hendler, Jim", "y": "2011", "ty": "chapter", "src": "Semantic Web for the Working Ontologist (Second Edition)", "link": "https://www.sciencedirect.com/science/article/pii/B9780123859655100238", "tags": [""], "br": "", "coll": "ScienceDirect_citations_1689943166380", "abs": ""}, {"t": "Advanced Digital Preservation", "au": "Giaretta, David", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Information storage and retrieval", "Information Storage and Retrieval", "Library science", "Computers and civilization", "Computers and Society", "Cultural heritage", "Cultural Heritage", "Library Science"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "There is growing recognition of the need to address the fragility of digital information, on which our society heavily depends for smooth operation in all aspects of daily life. This has been discussed in many books and articles on digital preservation, so why is there a need for yet one more? Because, for the most part, those other publications focus on documents, images and webpages – objects that are normally rendered to be simply displayed by software to a human viewer. Yet there are clearly many more types of digital objects that may need to be preserved, such as databases, scientific data and software itself. David Giaretta, Director of the Alliance for Permanent Access,  and his contributors explain why the tools and techniques used for preserving rendered objects are inadequate for all these other types of digital objects, and they provide the concepts, techniques and tools that are needed. The book is structured in three parts. The first part is on theory, i.e., the concepts and techniques that are essential for preserving digitally encoded information. The second part then shows practice, i.e., the use and validation of these tools and techniques. Finally, the third part concludes by addressing how to judge whether money is being well spent, in terms of effectiveness and cost sharing. Various examples of digital objects from many sources are used to explain the tools and techniques presented. The presentation style mainly aims at practitioners in libraries, archives and industry who are either directly responsible for preservation or who need to prepare for audits of their archives. Researchers in digital preservation and developers of preservation tools and techniques will also find valuable practical information here. Researchers creating digitally encoded information of all kinds will also need to be aware of these topics so that they can help to ensure that their data is usable and can be valued by others now and in the future. To further assist the reader, the book is supported by many hours of videos and presentations from the CASPAR project and by a set of open source software."}, {"t": "Advocacy Revisited: Newer Insights based on Research and Evidence", "au": "Haycock, Ken", "y": "2011", "ty": "article-journal", "src": "World Libraries", "link": "https://worldlibraries.dom.edu/index.php/worldlib/article/view/96", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "The Seventh Follett Lecture, Graduate School of Library and Information Science, Dominican University, 9 February 2011Although a popular focus for librarians, advocacy is often misunderstood and rarely evaluated. It is not publicity, public relations, messaging, marketing, or lobbying alone. It is a planned, deliberate, and sustained effort to develop understanding and support incrementally over time. Greatest success comes through positive relationships, employing proven strategies for social influence — consistency and commitment, reciprocation, authority, liking, social proof, and scarcity."}, {"t": "Appendix - Frequently asked questions", "au": "Allemang, Dean; Hendler, Jim", "y": "2011", "ty": "chapter", "src": "Semantic Web for the Working Ontologist (Second Edition)", "link": "https://www.sciencedirect.com/science/article/pii/B9780123859655100172", "tags": [""], "br": "", "coll": "ScienceDirect_citations_1689943166380", "abs": ""}, {"t": "Archivbibliographie: Mit besonderer Berücksichtigung des deutschen und österreichischen Archivwesens", "au": "Leesch, Wolfgang", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Archivkunde", "Geschichte", "Europa"], "br": "2", "coll": "2.5 Ouvrages et articles; 2.1 Répertoires bibliographiques", "abs": ""}, {"t": "Archives personnelles: histoire, anthropologie et sociologie", "au": "Artières, Philippe; Laé, Jean-François", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Archivkunde", "Frankreich", "Archives privées", "Anthropologie", "Französisch", "Histoires de vie", "Historiographie", "Sociologie"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "4e de couv.: Que faire d'une correspondance, d'un agenda, d'un journal de rêve, d'une lettre à l'administration, d'un carnet d'héritage, d'un journal personnel ? En mosaïques, les archives personnelles sont spontanément indéchiffrables. Il faut les mettre en séries pour en extraire des normes d'expression. Car l'unité ici n'est ni une population, ni un territoire, ni un problème singulier, mais un geste d'écriture qui agit dans les relations personnelles et au travail, à domicile ou en institution, dans les relations de dépendance et dans des cadres légaux. L'individu n'existe pas hors du jeu social qui se trame autour de lui, sinon par des jeux d'effacement, de censure et de gommage.Les écritures personnelles témoignent ainsi pour des milliers d'autres, traversent des épaisseurs de temps silencieux et durent au-delà de leur lecture. Elles disent une histoire collective. Un autre point de vue pour saisir le social en acte ? Nous sommes partis de ce choix. Philippe ARTIÈRES est historien (CNRS/EHESS).Jean-François LAÉ est sociologue (Université de Paris-8)"}, {"t": "Archivmanagement in der Praxis", "au": "Glauert, Mario", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Management", "Archivkunde"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Chapter 1 - What is the Semantic Web?", "au": "Allemang, Dean; Hendler, Jim", "y": "2011", "ty": "chapter", "src": "Semantic Web for the Working Ontologist (Second Edition)", "link": "https://www.sciencedirect.com/science/article/pii/B9780123859655100019", "tags": [""], "br": "", "coll": "ScienceDirect_citations_1689943166380", "abs": ""}, {"t": "Chapter 10 - SKOS—managing vocabularies with RDFS-Plus", "au": "Allemang, Dean; Hendler, Jim", "y": "2011", "ty": "chapter", "src": "Semantic Web for the Working Ontologist (Second Edition)", "link": "https://www.sciencedirect.com/science/article/pii/B978012385965510010X", "tags": [""], "br": "", "coll": "ScienceDirect_citations_1689943166380", "abs": ""}, {"t": "Chapter 11 - Basic OWL", "au": "Allemang, Dean; Hendler, Jim", "y": "2011", "ty": "chapter", "src": "Semantic Web for the Working Ontologist (Second Edition)", "link": "https://www.sciencedirect.com/science/article/pii/B9780123859655100111", "tags": [""], "br": "", "coll": "ScienceDirect_cita digital age with topics such as making a case for electronic records management, documenting appraisal as a societal-archival process, and challenging stereotypes about corporate archives\"--P. [4] of cover"}, {"t": "Copyright", "au": "Allemang, Dean; Hendler, Jim", "y": "2011", "ty": "chapter", "src": "Semantic Web for the Working Ontologist (Second Edition)", "link": "https://www.sciencedirect.com/science/article/pii/B9780123859655100214", "tags": [""], "br": "", "coll": "ScienceDirect_citations_1689943166380", "abs": ""}, {"t": "Créer des services innovants: stratégies et répertoire d'actions pour les bibliothèques", "au": "Jacquinet, Marie-Christine", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Bibliothéconomie", "Bibliothèques", "Innovations technologiques", "Services aux publics"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Confrontés aux multiples évolutions qui animent notre société, les professionnels des bibliothèques doivent travailler à développer un processus permanent de renouvellement de leurs offres de service. Pour cela il faut apprendre à innover, à penser innovation."}, {"t": "Digital Past: Geschichtswissenschaft im digitalen Zeitalter", "au": "Haber, Peter", "y": "2011", "ty": "thesis", "src": "", "link": "", "tags": ["DIGITALE DOKUMENTE + ELEKTRONISCHE DOKUMENTE (BIBLIOTHEKSWESEN)", "Electronic information resources", "Neue Medien", "Internet", "Data processing", "World Wide Web", "Forecasting", "History", "Geschichtsschreibung", "Histoire", "INTERNET + WORLD WIDE WEB (COMPUTERSYSTEME)", "Technologie de l'information", "Historiography", "Methodology", "Research", "Computer network resources", "GESCHICHTSSCHREIBUNG", "Geschichtswissenschaft", "Geschichtstheorie", "Arbeitstechnik", "COMPUTERANWENDUNGEN/GESCHICHTE", "Digital media", "Digitale Medien", "EINUNDZWANZIGSTES JAHRHUNDERT N. CHR", "ELEKTRONISCHE MEDIEN + DIGITALE MEDIEN (SOZIOLOGIE)", "GESCHICHTSWISSENSCHAFT", "Methode", "Wissenschaft"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Front Matter", "au": "Allemang, Dean; Hendler, Jim", "y": "2011", "ty": "chapter", "src": "Semantic Web for the Working Ontologist (Second Edition)", "link": "https://www.sciencedirect.com/science/article/pii/B9780123859655100202", "tags": [""], "br": "", "coll": "ScienceDirect_citations_1689943166380", "abs": ""}, {"t": "Hors Texte", "au": "", "y": "2011", "ty": "book", "src": "", "link": "https://www.agbd.ch/hors-texte/", "tags": [""], "br": "3", "coll": "3.3.1 Suisse", "abs": "Hors-Texte est le bulletin de l'AGBD. Il propose des articles sur les problématiques bibliothéconomiques et cherche à donner un aperçu de ce qui se passe dans le monde des bibliothèques de Genève et d’ailleurs."}, {"t": "Information history in the modern world: histories of the information age", "au": "Weller, Toni", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["History", "Information science", "Historiography"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "\"This edited collection of essays brings together, for the first time, notable scholars from the UK, US and Europe in the field of information history. It explores the key themes and ideas, offering students a diverse taster of information history in practice and relating this historical research to the contemporary information age\"--Provided by publisher."}, {"t": "Introduction to information science and technology", "au": "Davis, Charles Hargis; Shaw, Debora", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Information technology", "Information science", "Informations- und Dokumentationswissenschaft", "Sciences de l'information", "Informationstechnik", "Technologie de l'information"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "This guide to information science and technology presents a clear, concise, and approachable account of the fundamental issues, with appropriate historical and theoretical background. Topics covered include information needs, seeking, and use; representation and organization of information; computers and networks; structured information systems; information systems applications; users' perpectives in information systems; social informatics; communication using information technologies; information policy; and the information professions."}, {"t": "Le schéma de classification hiérarchique des documents administratifs: conception, développement, déploiement et maintenance", "au": "Roberge, Michel", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Archives", "document administratif - gestion", "plan de classement"], "br": "2", "coll": "2.5 Ouvrages et articles; 1d Records Management", "abs": ""}, {"t": "Manuel pratique de gestion des documents: mettre en place les principes de Records management dans les communes vaudoises", "au": "Bianchi, Cristina; Chatelan, Fabienne; Guanzini, Catherine; Rohr, Salomé; Association vaudoise des archivistes", "y": "2011", "ty": "book", "src": "", "link": "https://www.archivistes.ch/publications/manuel-rm/", "tags": ["Administration publique", "Administration communale", "archives courantes et intermédiaires - gestion", "canton)", "Vaud (Suisse"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Mener l'enquête: guide des études de publics en bibliothèque", "au": "Evans, Christophe sociologue 19-", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Bibliothéconomie", "Bibliothèques", "Publics", "Sciences de l'information", "SERVICES PUBLICS DE BIBLIOTHÈQUE (BIBLIOTHÉCONOMIE)", "UTILISATION DES BIBLIOTHÈQUES (BIBLIOTHÉCONOMIE)", "bibliothèque - utilisation", "enquête sociale", "Méthodologie", "usager", "Enquêtes", "Évaluation", "FONCTION DES BIBLIOTHÈQUES + UTILITÉ DES BIBLIOTHÈQUES", "GESTION DE LA QUALITÉ + ASSURANCE QUALITÉ (ÉCONOMIE D'ENTREPRISE)", "MÉTHODES D'ENQUÊTE (SCIENCES SOCIALES)", "MÉTHODES DE SONDAGE (SCIENCES SOCIALES)", "Méthodes statistiques"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Enquêter sur la fréquentation, les usages ou l'image des bibliothèques requiert des collectes de données variées, fiables, concertées. Pour ce faire, les professionnels des bibliothèques doivent connaître les spécificités du domaine et les processus généraux de la méthodologie des enquêtes. Qu'elle soit confiée à un prestataire extérieur ou réalisée en interne avec les moyens du bord, l'enquête de publics ne s'improvise pas. Elle suppose en effet, en plus d'une phase de préparation minutieuse, le respect d'une démarche rigoureuse. C'est ce dont rend compte ce guide en présentant de façon détaillée et pratique les étapes qui jalonnent le déroulement des études de publics, selon les trois temps de l'enquête : sa préparation, sa réalisation et l'exploitation-communication de ses résultats. Conçu tel un recueil de bonnes pratiques, l'ouvrage s'attache à fournir des éléments méthodologiques précis complétés par des comptes rendus critiques de travaux pilotés ou réalisés par des bibliothécaires aussi bien en bibliothèques universitaires qu'au sein de médiathèques de lecture publique. [Ed.]"}, {"t": "Mener l'enquête: guide des études de publics en bibliothèque", "au": "Evans, Christophe sociologue 19-", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Bibliothéconomie", "Bibliothèques", "Publics", "Sciences de l'information", "SERVICES PUBLICS DE BIBLIOTHÈQUE (BIBLIOTHÉCONOMIE)", "UTILISATION DES BIBLIOTHÈQUES (BIBLIOTHÉCONOMIE)", "bibliothèque - utilisation", "enquête sociale", "Méthodologie", "usager", "Enquêtes", "Évaluation", "FONCTION DES BIBLIOTHÈQUES + UTILITÉ DES BIBLIOTHÈQUES", "GESTION DE LA QUALITÉ + ASSURANCE QUALITÉ (ÉCONOMIE D'ENTREPRISE)", "MÉTHODES D'ENQUÊTE (SCIENCES SOCIALES)", "MÉTHODES DE SONDAGE (SCIENCES SOCIALES)", "Méthodes statistiques"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Enquêter sur la fréquentation, les usages ou l'image des bibliothèques requiert des collectes de données variées, fiables, concertées. Pour ce faire, les professionnels des bibliothèques doivent connaître les spécificités du domaine et les processus généraux de la méthodologie des enquêtes. Qu'elle soit confiée à un prestataire extérieur ou réalisée en interne avec les moyens du bord, l'enquête de publics ne s'improvise pas. Elle suppose en effet, en plus d'une phase de préparation minutieuse, le respect d'une démarche rigoureuse. C'est ce dont rend compte ce guide en présentant de façon détaillée et pratique les étapes qui jalonnent le déroulement des études de publics, selon les trois temps de l'enquête : sa préparation, sa réalisation et l'exploitation-communication de ses résultats. Conçu tel un recueil de bonnes pratiques, l'ouvrage s'attache à fournir des éléments méthodologiques précis complétés par des comptes rendus critiques de travaux pilotés ou réalisés par des bibliothécaires aussi bien en bibliothèques universitaires qu'au sein de médiathèques de lecture publique. [Ed.]"}, {"t": "Médiation numérique : qu’est-ce que les bibliothèques peuvent apporter au Web ?", "au": "Vogel, Johanna", "y": "2011", "ty": "thesis", "src": "", "link": "https://www.enssib.fr/bibliotheque-numerique/documents/49484-mediation-numerique-qu-est-ce-que-les-bibliotheques-peuvent-apporter-au-web.pdf", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Nouveau regard sur l'information documentaire publique: régulation d'une ressource en émergence dans l'univers des archives, des bibliothèques et de l'administration suisses", "au": "Olgiati Pelet, Mirta", "y": "2011", "ty": "thesis", "src": "", "link": "", "tags": ["Archiv", "Bibliothek", "Archives", "ÖFFENTLICHE VERWALTUNG", "Schweiz", "SCHWEIZ (MITTELEUROPA). SCHWEIZERISCHE EIDGENOSSENSCHAFT", "Switzerland", "Collection management", "Administration publique", "Archival resources", "ARCHIVE (KULTUSVERWALTUNG)", "archives", "archivio", "BIBLIOTHEKEN (KULTUSVERWALTUNG)", "Bibliothèques", "documentation", "Documentation", "documentazione", "Dokumentation", "DOKUMENTATION, FACHLICHE UND FORMALE SPEZIALISIERUNGEN", "Government publications", "Information", "Information organization", "Information und Dokumentation", "Information(allgemein)", "information(en général)", "Informationsdienstleister", "Informationsversorgung", "Informationswissenschaft", "informazione(in generale)", "Institutional repositories", "Public records", "Regulierung", "science de l'information", "scienza dell'informazione", "Suisse", "Suisse(État)", "Svizzera(Stato)", "Verwaltung"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Contient une étude de cas sur les Helvetica (p. 135-149)"}, {"t": "Preface to the second edition", "au": "Allemang, Dean; Hendler, Jim", "y": "2011", "ty": "chapter", "src": "Semantic Web for the Working Ontologist (Second Edition)", "link": "https://www.sciencedirect.com/science/article/pii/B9780123859655100226", "tags": [""], "br": "", "coll": "ScienceDirect_citations_1689943166380", "abs": ""}, {"t": "Public relations and marketing for archives: a how-to-do-it manual", "au": "Russel, James; Wosh, Peter J.", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archives", "Marketing", "Öffentlichkeitsarbeit", "Public relations", "Relations publiques"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Schlüsselbegriffe der Archivterminologie: Lehrmaterialien für das Fach Archivwissenschaft", "au": "Menne-Haritz, Angelika", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archivistique", "Terminologie"], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Semantic Web for the Working Ontologist (Second Edition)", "au": "Allemang, Dean; Hendler, Jim", "y": "2011", "ty": "chapter", "src": "Semantic Web for the Working Ontologist (Second Edition)", "link": "https://www.sciencedirect.com/science/article/pii/B9780123859655100196", "tags": [""], "br": "", "coll": "ScienceDirect_citations_1689943166380", "abs": ""}, {"t": "The future of archives and recordkeeping: a reader", "au": "Hill, Jennie", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Technological innovations"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "The way in which we view the nature of archives and the role of the archivist has changed significantly in the last few decades. With increasing interest from outside of the profession, the idea of archives as the static, impartial carriers of truth and the archivist as a guardian of records has been questioned: how can society take greater control over its own written memory? There have been a number of other changes which have impacted upon the way archivists conceive of themselves and the way in which they work. Chief among these are the rapid rise of technology and the challenges this poses, and the changing place of archives within related fields, such as records and information management. It is imperative that archivists engage with these challenges if archives are to emerge as a renewed force in the 21st century. This much-needed book is designed not as a practical guide to professional practice, but rather as a reader addressing these challenges. The chapters are contributed by leaders in the field, and are grouped around the following four core themes: defining archives; shaping a discipline; and, Archives 2.0: archives in society. Archives in the information age: is there still a role for the archivist? Each chapter represents a defined argument in its own right to enable readers to dip in and out of the collection as they wish, and the book is structured to highlight chapters that share a common theme. This book offers a clearly organized approach to developments in archives and record keeping and will prove an invaluable resource for students following postgraduate training courses in archive administration as well as for archive professionals wishing to refresh and update their understanding of the profession."}, {"t": "Typologie des dossiers des organisations: analyse intégrée dans un contexte analogique et numérique", "au": "Gagnon-Arguin, Louise", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["archives", "archives informatiques - gestion", "document administratif", "document administratif - gestion", "document électronique - gestion", "typologie"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Web HT.0: pour une société informée, la pertinence numérique et ses défis pour les sociétés démocratiques au XXIe siècle", "au": "Caron, Daniel J.", "y": "2011", "ty": "book", "src": "", "link": "", "tags": ["Digitalisierung", "Bibliothèques numériques", "Société numérique", "Informationsgesellschaft", "Elektronische Bibliothek", "Numérisation"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": ""}, {"t": "Bibliothèque et Archives Canada", "au": "Canada, Bibliothèque et Archives; Canada, Library and Archives", "y": "2012", "ty": "webpage", "src": "", "link": "https://www.collectionscanada.gc.ca/", "tags": [""], "br": "2", "coll": "2.6 Sites web", "abs": "Accès aux ressources, à la collection et aux services en ligne de Bibliothèque et Archives Canada : le patrimoine documentaire canadien (publications et enregistrements) renseigne sur la société canadienne et sert de mémoire collective du gouvernement du Canada."}, {"t": "Comment évaluer la qualité des archives ?: méthode et instruments de mesure des dimensions de qualité des archives définitives", "au": "Makhlouf, Basma", "y": "2012", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Archivistique", "Archives - Évaluation et tri", "Échantillonnage", "Preuve littérale", "Qualité", "Témoignage historique"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Communicator: toute la communication d'entreprise", "au": "Libaert, Thierry", "y": "2012", "ty": "book", "src": "", " von Semantic-Web-Strukturen und an der digitalen Langzeitarchivierung beteiligt. Das Handbuch bietet einen fundierten Einblick in Geschichte, Theorie und gegenwärtige Praxis der Institution Bibliothek. Alle Aspekte des Informations- und Wissensmanagements bis hin zu Repositorien und Open Access werden dargestellt."}, {"t": "L'archivage électronique et le droit", "au": "Demoulin, Marie", "y": "2012", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Numérisation", "Archives électroniques", "Droit", "Belgique", "Communication électronique de pièces (droit)", "Contrats", "Droit à la vie privée", "Tiers (droit)"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "La bibliothèque quatrième lieu : espace physique et/ou en ligne d'apprentissage social : un nouveau modèle de circulation des savoirs", "au": "Pérès-Labourdette Lembé, Victoria", "y": "2012", "ty": "book", "src": "", "link": "https://www.enssib.fr/bibliotheque-numerique/documents/56998-la-bibliotheque-quatrieme-lieu-espace-physique-etou-en-ligne-d-apprentissage-social.pdf", "tags": ["Bibliothèques -- aspect social", "Bibliothèques (constructions) -- Aménagement"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "La diffusiuon des archives : ou les 12 travaux des archivistes à l'ère du numérique: Valorisation des corpus numérisés", "au": "Lemay, Yvon; Klein, Anne", "y": "2012", "ty": "article-journal", "src": "Les cahiers du numérique", "link": "https://www.cairn.info/revue-les-cahiers-du-numerique-2012-3-page-15.htm", "tags": ["Sciences de l'information et de la communication", "Sciences de l'information et des bibliothèques. Etude d'ensemble", "Sciences de l'information. Documentation", "Sciences et techniques communes", "Sciences exactes et technologie"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Les bibliothécaires face aux problématiques de médiation : une nécessité pour valoriser les ressources numériques", "au": "Desrichard, Yves", "y": "2012", "ty": "article-journal", "src": "Bulletin des bibliothèques de France (BBF)", "link": "https://bbf.enssib.fr/consulter/bbf-2012-04-0074-007", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Mémento de l'information numérique", "au": "Accart, Jean-Philippe; Rivier, Alexis", "y": "2012", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "Internet", "Information électronique", "Informationstechnik", "Technologie de l'information", "Numérisation", "document électronique", "APPLICATIONS INFORMATIQUES EN BIBLIOTHÉCONOMIE", "BIBLIOTHÈQUES ÉLECTRONIQUES (BIBLIOTHÉCONOMIE)", "Computer network resources", "DOCUMENTS NUMÉRIQUES + DOCUMENTS ÉLECTRONIQUES (BIBLIOTHÉCONOMIE)", "Electronic reference services (Libraries)", "Elektronische Publikation", "Libraries and the Internet", "Online bibliographic searching"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Ce livre reprend et développe ces différents points, donne des pistes de réflexions, mais également des outils d'appréhension et de compréhension de l'environnement numérique actuel. S'adressant plus particulièrement aux professionnels de l'information et des bibliothèques, il concerne aussi un public plus large, débutant sur les réseaux ou confirmé, étudiants et enseignants. Sa forme concise et synthétique permet d'aborder toutes les dimensions de l'information numérique."}, {"t": "Preserving digital materials", "au": "Harvey, Ross", "y": "2012", "ty": "book", "src": "", "link": "", "tags": ["BESTANDSERHALTUNG VON BIBLIOTHEKS- UND ARCHIVBESTÄNDEN (BIBLIOTHEKSWESEN)", "Digital preservation", "Digitale Daten", "DIGITALE DOKUMENTE + ELEKTRONISCHE DOKUMENTE (BIBLIOTHEKSWESEN)", "ELEKTRONISCHE BIBLIOTHEKEN (BIBLIOTHEKSWESEN)", "Langzeitarchivierung", "Neue Medien", "Information électronique", "Conservation", "Archivierung", "Bestandserhaltung", "Elektronische Bibliothek", "document électronique - conservation"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Terminologie archivistique multilingue | International Council on Archives", "au": "International Council of Archives ICA", "y": "2012", "ty": "webpage", "src": "", "link": "https://www.ica.org/fr/terminologie-archivistique-multilingue", "tags": [""], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "\"Aufheben, was nicht vergessen werden darf\": Archive vom alten Europa bis zur digitalen Welt", "au": "Schenk, Dietmar", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Europe", "History"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Archivalien sind dem Wandel der Dinge in gewissen Grenzen enthoben. Die Archive, in denen authentische Zeugnisse der Vergangenheit bewahrt werden, verändern sich aber im Sog der Geschichte. Im alten Europa entwickelten sie sich mit der Expansion pragmatischer Schriftlichkeit, im 19. Jahrhundert wurden sie von der Geschichtsschreibung entdeckt, heute sind sie zivilgesellschaftliche Instanzen des Erinnerns. In Form einer histoire-problème und anhand einer Vielzahl anschaulicher Beispiele porträtiert Dietmar Schenk die Archive als faszinierende, denkwürdige Kultur des Aufhebens, die vom"}, {"t": "Accueillir les publics: comprendre et agir", "au": "Miribel, Marielle de", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["France", "Bibliothèques", "Publics", "Guides pratiques et mémentos", "Accueil des publics", "Accueil et orientation des publics", "Bibliothèques - Services aux publics", "Bibliothèques publiques", "Formation des utilisateurs", "GESTION DE LA RELATION CLIENT + FIDÉLISATION DU CLIENT", "PUBLICITÉ, INFORMATION, RELATIONS PUBLIQUES", "SERVICES PUBLICS DE BIBLIOTHÈQUE (BIBLIOTHÉCONOMIE)", "TECHNIQUE DE LA NÉGOCIATION + RÉSOLUTION DE CONFLIT (PSYCHOLOGIE)", "UTILISATION DES BIBLIOTHÈQUES (BIBLIOTHÉCONOMIE)"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Cet ouvrage apporte un regard argumenté sur le thème classique de l’accueil du public dans les bibliothèques et médiathèques."}, {"t": "Accueillir les publics: comprendre et agir", "au": "Miribel, Marielle de", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Accueil des publics", "Bibliothèques - Services aux publics", "LITTERATURE PROFESSIONNELLE", "BIBLIOTHEQUE", "[Manuels d'enseignement]"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Cet ouvrage apporte un regard argumenté sur le thème classique de l'accueil du public dans les bibliothèques et médiathèques. De fait la fonction d'accueil est un révélateur de toutes les dynamiques internes et externes de celle institution. S'il semble naturel a priori de savoir accueillir les publics, la complexité des situations, des activées qui y sont liées et de la diversité des publics nécessite désormais une réflexion globale de toute l'équipe, en lien avec les missions stratégiques de cette bibliothèques-ci dans son contexte spécifique.\nComment remplir ses missions, avec les contraintes de lieux, d'organisation, de réduction de personnels, d'exigences des personnes accueillies ? Comment rendre à tous un service d'accueil adapté et cependant recevoir chacun selon son besoin ? Comment répondre aux attentes, d'une manière professionnelle, mérite dans des situations d'afflux, de stress ou de relations délicates ? Huit parties analysent l'accueil dans ses différents aspects : les enjeux, en lien avec la notoriété et la pérennité de la bibliothèque ; les liens subtils entre information et communication ; la mise en espace des ressources ; les représentations collectives et individuelles, suivies d'un regard sur les publics ; les risques du métier, suivis des outils du bibliothécaire de référence et du professionnel de la relation.\nCe livre s'adresse aussi bien aux personnels en contact avec le public qu'aux responsables de service ou de bibliothèque, pour qui la qualité du service public est le reflet de la qualité de leur établissement."}, {"t": "Archivage du Web organisationnel dans une perspective archivistique", "au": "Chebbi, Aïda", "y": "2013", "ty": "thesis", "src": "", "link": "https://papyrus.bib.umontreal.ca/xmlui/handle/1866/9203", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "La présente thèse a pour but de développer une meilleure compréhension de la nature des archives Web et de documenter les pratiques actuelles d’archivage du Web organisationnel. Plus précisément, cette recherche vise à répondre aux trois questions suivantes :  \n(1) Que recommandent en général les politiques d’archivage du Web organisationnel?  \n(2) Quelles sont les principales caractéristiques des archives Web? \n(3) Quelles pratiques d’archivage du Web organisationnel sont mises en place dans des organisations au Québec?"}, {"t": "Archives et enjeux de société: dossier", "au": "Lemoine, Hervé", "y": "2013", "ty": "article-journal", "src": "Culture et recherche", "link": "http://www.culturecommunication.gouv.fr/content/download/89855/672556/file/CR129_web.pdf", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Berufsbild Wissenschaftliche Bibliothekarin / Wissenschaftlicher Bibliothekar", "au": "IG-WBS", "y": "2013", "ty": "article-journal", "src": "", "link": "https://igwbs.ch/wp-content/uploads/2013_11_18_igwbs_berufsbild.pdf", "tags": [""], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Die Aufgaben und Verantwortlichkeiten einer wissenschaftlichen Bibliothekarin oder eines wissenschaftli-\nchen Bibliothekars sind vielfältig und komplex. Für Berufsinteressierte, Berufseinsteigende, Arbeitgebende und weitere Interessierte bietet dieses Berufsbild Einblick in Tätigkeitsbereiche, Anforderungen, Kompetenzen und Ausbildungsmöglichkeiten sowie einen Ausblick auf die Zukunft des Berufsfeldes."}, {"t": "Conservare il digitale: principi, metodi e procedure per la conservazione a lungo termine di documenti digitali", "au": "Guercio, Maria", "y": "2013", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "I nodi concettuali e organizzativi della conservazione dei documenti digitali, i suoi metodi, i formati e i metadati, le nuove forme della custodia e gli strumenti per la loro certificazione e verifica, il quadro normativo italiano, le nuove frontiere e le sfide che ciascuna area di intervento riserva nel prossimo futuro, in una sintesi completa ed esauriente."}, {"t": "Développer la médiation documentaire numérique", "au": "Galaup, Xavier", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Internet", "Technologies de l'information et de la communication", "Bibliothèques numériques", "Médias numériques", "Médiation", "Systèmes d'information", "Environnement numérique de travail", "Formation en ligne", "Travail"], "br": "1", "coll": "1.5.1 Documentation de base; 2a Communication, Relations publiques et gestion des connaissances", "abs": "Depuis quelques années, les bibliothèques investissent fortement l'Internet : catalogues en ligne, sites Web devenant peu à peu des portails de services, blogs et réseaux sociaux. Si l'objectif est bien d'être présent dans l'univers numérique des usagers existants ou potentiels, les bibliothèques, aussi bien universitaires que de lecture publique, doivent garder leur spécificité sous peine d'être noyées dans le flot général.\n\nL'un des axes de travail pour ce faire est de transposer en ligne la médiation documentaire, c'est-à-dire repenser pour l'Internet tous les moyens à mettre en œuvre pour favoriser la rencontre d'un lecteur avec les documents susceptibles de l'intéresser ou de lui ouvrir de nouveaux horizons."}, {"t": "Evidence, memory, identity, and community: four shifting archival paradigms", "au": "Cook, Terry", "y": "2013", "ty": "article-journal", "src": "Archival Science", "link": "https://doi.org/10.1007/s10502-012-9180-7", "tags": ["Memory", "Archival theory", "Community archiving", "Evidence", "Paradigm shifts", "Professional identity"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "This essay argues that archival paradigms over the past 150 years have gone through four phases: from juridical legacy to cultural memory to societal engagement to community archiving. The archivist has been transformed, accordingly, from passive curator to active appraiser to societal mediator to community facilitator. The focus of archival thinking has moved from evidence to memory to identity and community, as the broader intellectual currents have changed from pre-modern to modern to postmodern to contemporary. Community archiving and digital realities offer possibilities for healing these disruptive and sometimes conflicting discourses within our profession."}, {"t": "Expect more: demanding better libraries for today's complex world", "au": "Lankes, R. David", "y": "2013", "ty": "book", "src": "", "link": "https://davidlankes.org/new-librarianship/expect-more-demanding-better-libraries-for-todays-complex-world/", "tags": ["Bibliothèques - Services aux publics", "Changement social", "Nouvelles technologies de l'information et de la communication"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": ""}, {"t": "Glossaire", "au": "Association des archivistes du Québec", "y": "2013", "ty": "post-weblog", "src": "", "link": "https://archivistesqc.wordpress.com/glossaire-2/", "tags": [""], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": "À propos du glossaire Présentation Ce glossaire propose des définitions de terminologie archivistique dans le sens le plus large, sans égard à tel ou tel aspect des activités des archivistes au Qué…"}, {"t": "Grundlagen der praktischen Information und Dokumentation: Handbuch zur Einführung in die Informationswissenschaft und -praxis", "au": "Kuhlen, Rainer; Semar, Wolfgang; Strauch, Dietmar", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Information und Dokumentation", "Informations- und Dokumentationswissenschaft"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Seit 40 Jahren vermittelt das Standardwerk Wissenschaftlern, Praktikern und Studierenden Grundlagen der fachlichen Informationsarbeit. Mit der 6., völlig neu gefassten Auflage reagieren die Herausgeber auf die erheblichen technischen, methodischen und organisatorischen Veränderungen auf dem Gebiet der Information, Dokumentation und Informationswissenschaft."}, {"t": "Handbook of information science", "au": "Stock, Wolfgang G.; Stock, Mechtild", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Information organization", "Information science", "Information retrieval", "Knowledge representation (Information theory)"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "This Handbook is a basic work of information science, providing a comprehensive overview of the current state of information retrieval and knowledge representation. It addresses readers from all professions and scientific disciplines, but particularly scholars, practitioners and students of Information Science, Library Science, Computer Science, Information Management, and Knowledge Management. This Handbook is a suitable reference work for Public and Academic Libraries."}, {"t": "Handbuch Methoden der Bibliotheks- und Informationswissenschaft: Bibliotheks-, Benutzerforschung, Informationsanalyse", "au": "Umlauf, Konrad; Fühles-Ubach, Simone; Seadle, Michael", "y": "2013", "ty": "book", "src": "", "link": "https://www.degruyter.com/document/doi/10.1515/9783110255546/html", "tags": ["Analysis of Information", "Discourse Analysis", "Infometry", "Media Use Research", "Research on Libraries", "Research on Users"], "br": "1", "coll": "1.5.1 Documentation de base; 3.5.1 Documentation de base", "abs": "In this handbook the leading experts present contributions on qualitative and quantitative research methods. They address both methods that are specific to the discipline, as well as methods from the social and computer sciences e.g.the development of research designs, questionnaires, measuring website use, research on users, ethnomethodology, infometry methods, information system evaluation, content analysis, discourse analysis, hermeneutic methods, Delphi methods."}, {"t": "International encyclopedia of information and library science", "au": "Feather, John; Sturges, Paul", "y": "2013", "ty": "book", "src": "", "link": "", "tags": [""], "br": "1", "coll": "1.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Introduction to indexing and abstracting", "au": "Cleveland, Donald Bruce; Cleveland, Ana D.", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["LEHRBÜCHER (DOKUMENTENTYP)", "ERSCHLIESSUNG UND KLASSIFIKATION VON DOKUMENTEN (BIBLIOTHEKSWESEN)", "Information Retrieval", "INFORMATIONSSPEICHERUNG + INFORMATIONSGEWINNUNG (INFORMATIONSSYSTEME)", "Abstracting", "ABSTRACTS (BIBLIOTHEKSWESEN)", "Indexierung Inhaltserschließung", "Indexing", "Referieren Dokumentation"], "br": "1", "coll": "1.5.1 Documentation de base; 3.5.1 Documentation de base", "abs": "Based on new research and years of practical experience, this guide presents the basic knowledge necessary to become a professional indexer. Synthesizing the thinking and experience of indexers and abstractors over the years, the book introduces readers to such fundamentals as the nature of information, the organization of information, vocabulary control, types of indexes and abstracts, evaluation of indexing, and the use of computers. A new chapter on indexing and the Internet has been added, as has a chapter that lists Web resources for indexers and abstractors. The work concludes with a discussion of the education, training, and job opportunities of the profession, as well as a look to the future. With its simple but thorough approach, this book provides readers with a broad overview of the professions, processes, and art of indexing and abstracting."}, {"t": "L'information professionnelle", "au": "Clavier, Viviane; Paganelli, Céline", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Electronic books."], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Omniprésente au travail, l’information professionnelle fait partie de ces objets familiers qu’il est difficile d’appréhender scientifiquement.\n\nPar ses contributions originales, cet ouvrage aborde le sujet sous l’angle des discours et des pratiques des acteurs concernés par sa production, sa diffusion, son traitement et ses usages. Multi-facettes, il définit tout d’abord les nouveaux périmètres de l’information professionnelle par l’analyse des différentes formes de médiatisation et de discours dans les organisations. Puis, ce livre met en évidence l’évolution des modalités de traitement des documents professionnels. Analysant les représentations liées aux activités informationnelles en contexte professionnel, il s’intéresse tout particulièrement aux experts et aux représentations d’environnements numériques. Enfin, cet ouvrage traite de la diversité des stratégies informationnelles déployées aux niveaux organisationnel et individuel et se focalise plus spécifiquement sur les dimensions sociales et opérationnelles qui structurent les activités informationnelles."}, {"t": "Les ego-archives: traces documentaires et recherche de soi", "au": "Marcilloux, Patrice", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archives", "Archivistique", "Philosophy", "Archives privées", "1970-2012", "Geschichte 1970-2012", "Philosophie", "Psychological aspects", "Publics", "Selbstbild", "Social aspects"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Multimedia information retrieval: theory and techniques", "au": "Raieli, Roberto", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Technologies de l'information et de la communication", "Multimédias", "Recherche de l'information", "Systèmes d'information de gestion", "Traitement d'images", "Traitement du signal"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "Novel processing and searching tools for the management of new multimedia documents have developed. Multimedia Information Retrieval (MIR) is an organic system made up of Text Retrieval (TR); Visual Retrieval (VR); Video Retrieval (VDR); and Audio Retrieval (AR) systems. So that each type of digital document may be analysed and searched by the elements of language appropriate to its nature, search criteria must be extended. Such an approach is known as the Content Based Information Retrieval (CBIR), and is the core of MIR. This novel content-based concept of information handling needs to be integrated with more traditional semantics. Multimedia Information Retrieval focuses on the tools of processing and searching applicable to the content-based management of new multimedia documents. Translated from Italian by Giles Smith, the book is divided into two parts. Part one discusses MIR and related theories, and puts forward new methodologies; part two reviews various experimental and operating MIR systems, and presents technical and practical conclusions."}, {"t": "Preserving archives", "au": "Forde, Helen", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Archival materials", "Conservation and restoration"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "A brand new and fully updated edition of this seminal work on archival preservation. Access to archival material - the documentary heritage of people all over the world that gives them their identity and ensures their rights - is dependent on the survival of fragile materials: paper, parchment, photographic materials, audiovisual materials and, most recently, magnetic and optical formats. The primary importance of such survival is widely acknowledged but sometimes overlooked in a rush to provide ever better means of access. But without the basic material, no services can be offered. Preservation is the heart of archival activity. Archivists in all types of organizations face questions of how to plan a preservation strategy in less than perfect circumstances, or deal with a sudden emergency. This book considers the causes of threats to the basic material, outlines the preservation options available and offers flexible solutions applicable in a variety of situations.  It offers a wide range of case studies and examples from international specialists. This revised edition also includes a new chapter on the management and training of volunteers, reflecting a key concern for many archival institutions.  This is a vital handbook for professional archivists, but also for the many librarians, curators and enthusiasts, trained and untrained, in museums, local studies centres and voluntary societies in need of good clear advice"}, {"t": "Profil professionnel Bibliothécaire scientifique", "au": "IG-WBS", "y": "2013", "ty": "article-journal", "src": "", "link": "https://igwbs.ch/wp-content/uploads/igwbs_berufsbild_fr0901__26052015.pdf", "tags": [""], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Les tâches et les responsabilités d’une ou d’un bibliothécaire scientifique sont diverses et complexes. Ce\nprofil doit permettre aux personnes intéressées par la profession, à celles qui commencent leur formation,\naux employeurs et à toute autre personne cherchant des renseignements à ce sujet, d’avoir un aperçu des domaines d’activité, des exigences, des compétences requises et des possibilités de formation concernant cette profession, ainsi que les perspectives d’avenir dans ce domaine."}, {"t": "Recherche d'Information - applications, modèles et algorithmes", "au": "Amini, Massih-Reza; Eric, Gaussier", "y": "2013", "ty": "book", "src": "", "link": "https://hal.science/hal-00881257", "tags": ["Big Data", "Classification documentaire", "Clustering", "Moteurs de recherche", "Recherche d'Information"], "br": "", "coll": "2c Information Retrieval", "abs": "Le premier ouvrage francophone sur les algorithmes qui sous-tendent les technologies de big data et les moteurs de recherche ! Depuis quelques années, de nouveaux modèles et algorithmes sont mis au point pour traiter des données de plus en plus volumineuses et diverses. Cet ouvrage présente les fondements scientifiques des tâches les plus répandues en recherche d'information (RI), tâches également liées au data mining, au décisionnel et plus généralement à l'exploitation de big data. Il propose un exposé cohérent des algorithmes classiques développés dans ce domaine, abordable à des lecteurs qui cherchent à connaître le mécanisme des outils quotidiens d'Internet. Le lecteur approfondira les concepts d'indexation, de compression, de recherche sur le Web, de classification et de catégorisation, et pourra prolonger cette étude avec les exercices corrigés proposés en fin de chapitre. Ce livre s'adresse tant aux chercheurs et ingénieurs qui travaillent dans le domaine de l'accès à l'information et employés de PME qui utilisent en profondeur les outils du webmarketing, qu'aux étudiants de Licence, Master, doctorants ou en écoles d'ingénieurs, qui souhaitent un ouvrage de référence sur la recherche d'information."}, {"t": "Research Methods in Information", "au": "Pickard, Alison Jane", "y": "2013", "ty": "book", "src": "", "link": "", "tags": ["Management", "Philosophy", "Information science", "Library science", "Audience", "Dissertations & theses", "Language arts", "Methodology", "Qualitative research"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "The long-awaited 2nd edition of this best-selling research methods handbook is fully updated and includes brand new coverage of online research methods and techniques, mixed methodology and qualitative analysis. This edition includes two new contributed chapters: Professor Julie McLeod, Sue Childs and Elizabeth Lomas focus on research data management, applying evidence from the recent JISC funded ‘DATUM’ project; Dr Andrew Shenton examines strategies for ana
