s et articles; 1.5.1 Documentation de base; 3.5.1 Documentation de base", "abs": ""}, {"t": "Editorial: Critical Library Perspectives. Ein digitales Denklabor", "au": "Eichenberger, Nicole; Harnisch, Franziska; Schmid, Larissa", "y": "2022", "ty": "article-journal", "src": "027.7 Zeitschrift für Bibliothekskultur / Journal for Library Culture", "link": "https://doi.org/10.21428/1bfadeb6.7b5106f5", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Voir tout le numéro 9/4 sur le thème \"Critical Library Perspectives\""}, {"t": "Framing Communication Infrastructures (1950–2020): discours et imaginaires - Diskurse und Vorstellungen", "au": "Atanasiu, Vlad; Chachereau, Nicolas; Natale, Enrico; Sibille, Christiane", "y": "2022", "ty": "book", "src": "", "link": "https://www.chronos-verlag.ch/public-download/3344", "tags": ["AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "Innovations technologiques", "Communication", "\"1950/2020\"", "1950-2020", "20e siècle (2e moitié)-21e siècle (début)", "Geschichte 1950-2020", "INFORMATIONSTECHNIK, IT + KOMMUNIKATIONSTECHNIK (NACHRICHTENTECHNIK)", "Infrastructure (économie politique)", "Infrastruktur", "Kommunikation", "Postes", "TECHNIKGESCHICHTE + GESCHICHTE DES INGENIEURWESENS", "Télécommunications"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Grabbing Tea : Queer Conversations in Archiving.", "au": "Smith-Cruz, Shawn(ta).", "y": "2022", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "This volume explores the intersection of queerness and archival theory and practice, focusing on LGBTQ+ communities. Through conversations and essays, contributors examine archives as sites for reclamation, storytelling, and historical revision, addressing themes such as race, sexuality, and identity. Topics include community archives, metadata, safe spaces, queer ancestry, and genealogy, offering insights into the transformative power of memory work and archival practices."}, {"t": "Grundlagen der Informationswissenschaft", "au": "", "y": "2022", "ty": "book", "src": "", "link": "https://www.degruyter.com/document/doi/10.1515/9783110769043/html", "tags": ["Information and documentation"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "The seventh edition of the Principles of Practical Information and Documentation is now called: The Principles of Information Science . The new title does justice to the fact that there is an increasing need to theorize how we deal with knowledge and information in practice, training, and research; as well as the development of information skills, in particular in online information services. All articles in the volume have been rewritten."}, {"t": "Grundlagenpapier: Bibliotheken als Dritte Orte stärken und Sonntagsöffnung ermöglichen", "au": "Deutscher Bibliotheksverband e.V. (dbv) •", "y": "2022", "ty": "document", "src": "", "link": "https://www.bibliotheksverband.de/sites/default/files/2022-08/Grundlagenpapier_Sonntags%C3%B6ffnung.pdf", "tags": [""], "br": "", "coll": "Exemples-Advocacy", "abs": ""}, {"t": "Grundlagenpapier: Zugang zu Büchern für alle: analog und digital", "au": "Deutscher Bibliotheksverband e.V. (dbv)", "y": "2022", "ty": "document", "src": "", "link": "https://www.bibliotheksverband.de/sites/default/files/2022-05/2022_05_30_dbv_Grundlagenpapier_Zugang%20zu%20E-Books_analog_und_digital_final.pdf", "tags": [""], "br": "", "coll": "Exemples-Advocacy", "abs": ""}, {"t": "Information services today: an introduction", "au": "Hirsh, Sandra", "y": "2022", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "BIBLIOTHEKSWESEN + BIBLIOTHEKSWISSENSCHAFTEN + BIBLIOTHEKEN", "ELEKTRONISCHE BIBLIOTHEKEN (BIBLIOTHEKSWESEN)", "BIBLIOTHEKSDIENSTLEISTUNGEN (BIBLIOTHEKSWESEN)", "BIBLIOTHEKSINFORMATION + BIBLIOTHEKSBERATUNG + BIBLIOTHEKSAUSKUNFT + NACHSCHLAGEWERKE (BIBLIOTHEKSWESEN)", "Dienstleistung", "AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "Information technology", "Information", "Library science", "Recherche documentaire", "INFORMATIONSINDUSTRIE", "Information resources", "Bibliothèques - Services aux publics", "Librarians", "Aims and objectives", "BENUTZERFREUNDLICHKEIT + ANWENDERFREUNDLICHKEIT (GESICHTSPUNKT)", "BIBLIOTHEKARE (BIBLIOTHEKSWESEN)", "BIBLIOTHEKARINNEN (BIBLIOTHEKSWESEN)", "BIBLIOTHEKARISCHE AUSBILDUNG (BERUFSAUSBILDUNG)", "Bibliothèques - Services de référence numériques", "Effect of technological innovations on", "Information services", "INFORMATIONS- UND DOKUMENTATIONSSYSTEME (BIBLIOTHEKSWESEN)", "Libraries", "Libraries and electronic publishing", "Library administration", "Library users", "Public services (Libraries)", "VEREINIGTE STAATEN VON AMERIKA, USA (NORDAMERIKA)", "Vocational guidance"], "br": "1", "coll": "1.5.1 Documentation de base; 2a Communication, Relations publiques et gestion des connaissances", "abs": "This second edition of Information Services Today: An Introduction demonstrates the ever-changing landscape of information services today and the need to re-evaluate curriculum, competency training, and one’s personal learning network in order to stay abreast of current trends and issues, and more significantly, remain competent to address the changing user needs of the information community."}, {"t": "Introduction to information science", "au": "Bawden, David; Robinson, Lyn", "y": "2022", "ty": "book", "src": "", "link": "", "tags": ["History", "Information science"], "br": "1", "coll": "1.5.1 Documentation de base; 3.5.1 Documentation de base", "abs": "The second edition of this definitive text gives a comprehensive overview of all aspects of the subject, bringing it up-to-date with analysis of the changes in the information environment, now largely digital, and their implication for the discipline and professions."}, {"t": "Invisible Labor, Invisible Value: Unpacking Traditional Assessment of Academic Library Value | Clarke |", "au": "Clarke, Rachel Ivy; Stanton, Katerina Lynn; Grimm, Alexandra; Zhang, Bo", "y": "2022", "ty": "article-journal", "src": "College & Research Libraries", "link": "https://doi.org/https://doi.org/10.5860/crl.83.6.926", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Academic libraries face mounting pressure to demonstrate their value to stakeholders, yet traditional assessments of their financial value ignore the work of librarians and library staff in producing usable collections and services for patrons. Through a survey of US academic library workers, we examine the range, scope, and financial value of labor performed in US academic libraries. Our findings reveal ways in which traditional assessment mechanisms render this labor invisible to stakeholders. We argue that making this labor more visible will help better communicate the value of academic libraries and ignite conversations about reducing workload and stress for library workers."}, {"t": "Jérémy Lachal : Pour un droit universel à la connaissance", "au": "", "y": "2022", "ty": "motion_picture", "src": "", "link": "https://www.youtube.com/watch?v=X-hXa9FrCkM", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines; 3c ABD en contexte", "abs": "#JérémyLachal a fondé #BibliothèquesSansFrontières (BSF) en 2007 aux côtés de l’historien Patrick Weil. Il dirige depuis cette ONG parmi les plus innovantes dans le domaine de l’accès à l’information et à l’éducation. \nIl évoque ici le grand enjeu que constitue, partout dans le monde, la réduction de l’insécurité informationnelle et, relié, celui de la construction de #SociétésApprenantes. Face à l’incapacité croissante de différencier un fait d’une opinion, il analyse les freins à l’accès au savoir, notamment l’enclosure des savoirs [alors même que la connaissance est un bien commun de l’humanité]. Il évoque aussi l’accès très inégal à internet. \nFace à ces freins, BSF apporte des solutions agiles, adaptées aux contraintes des territoires : « on se bat pour mettre à disposition à la fois des livres « papier » et des contenus numériques », y compris « offline » car les connexions sont chères et parfois inexistantes. Grâce aux #IdeasBox, dessinées par #PhilippeStarck et déployées dans des camps de réfugiés et autres contextes vulnérables, BSF recrée des lieux de connaissance, d’apprentissage en commun, initie des dynamiques apprenantes qui sont aussi, en favorisant les échanges et le lien social, des dynamiques de vie. \nParce que l'objectif est de faire évoluer les politiques publiques, BSF accompagne des acteurs publics ou associatifs dans une trentaine de pays dans le monde pour construire des stratégies de diffusion de la connaissance sur les territoires, apporter des « briques » de connaissance, des outils d’encapacitation, beaucoup de médiation. Car le vrai enjeu, c’est la transformation, et cela ne se fait pas tout seul ! \n\n00:00:00 Introduction\n00:00:20 Le grand enjeu de réduire l’insécurité informationnelle \n00:05:57 Une mesure de l’insécurité informationnelle en occident \n00:07:12 Ce qui freine l’accès au savoir\n00:13:46 Face à ces freins, les solutions développées par BSF \n00:23:21 Comment, plus globalement, BSF accompagne la construction de sociétés apprenantes  \n00:27:54 Quelle place pour l’humain dans ce projet très technologique ?\n00:33:00 Un livre que vous souhaiteriez conseiller \n\nDes Nouvelles De Demain Saison 4\n\nNotre compte Facebook : \n  / afdofficiel  \n\nNotre compte Instagram :\n  / afd_france  \n\nNotre compte Twitter:\n  / afd_france  \n\nNotre compte LinkedIn :\n  / agence-francaise-de-developpement  \n\nAbonnez-vous à notre chaine pour ne rien manquer :\n   • Des Nouvelles de Demain - Saison 4  \n\nPour en savoir plus sur le projet : \nhttps://afd.edflex.com/fr/\n\nNos partenaires : \n\nLien vers la vidéo :\n   • Jérémy Lachal : Pour un droit univers...  \n\n#Développement, #ApprendreEnCommun, #CampusAFD\n©AFD2022"}, {"t": "Les conflits d'archives: France, Espagne, Méditerranée", "au": "Péquignot, Stéphane; Potin, Yann", "y": "2022", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Conflits d'intérêts", "Espagne", "France", "Méditerranée (région)"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "RM-Baukasten - VSA-AAS", "au": "", "y": "2022", "ty": "webpage", "src": "", "link": "https://vsa-aas.ch/ressourcen/records-management/rm-baukasten/", "tags": [""], "br": "", "coll": "Sites web", "abs": "Der RM-Baukasten ist eine strukturierte Sammlung von Dokumenten, die bei der Einführung von Records Management in diversen öffentlichen und privaten"}, {"t": "The special collections handbook", "au": "Cullingford, Alison", "y": "2022", "ty": "book", "src": "", "link": "", "tags": ["BESTANDSERHALTUNG VON BIBLIOTHEKS- UND ARCHIVBESTÄNDEN (BIBLIOTHEKSWESEN)", "Bibliothek", "ELEKTRONISCHE ARCHIVIERUNG", "METADATEN (BIBLIOTHEKSWESEN)", "BIBLIOTHEKSDIENSTLEISTUNGEN (BIBLIOTHEKSWESEN)", "RATGEBER (DOKUMENTENTYP)", "BESTANDESAUFBAU + BESTANDESPFLEGE (BIBLIOTHEKSWESEN)", "Bestandsaufbau", "BIBLIOTHEKSSAMMELGEBIETE + BIBLIOTHEKSSONDERSAMMLUNGEN (BIBLIOTHEKSWESEN)", "Spezialsammlung"], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": "The Special Collections Handbook, Third Edition' is a comprehensive desk reference providing the essential principles, skills, and knowledge to manage special collections in any setting and covering all aspects of special collections work: preservation; developing collections; understanding objects; emergency planning; security; legal and ethical concerns; cataloguing; digitisation; marketing; outreach; teaching; impact; advocacy, and fundraising. This new edition has been revised and updated to incorporate the many developments in the field, reflecting the growth and dynamism of the sector and the complexity of the environment in which we operate.00Alison Cullingford is Special Collections Librarian at the University of Bradford, UK, where she is responsible for over 100 collections of modern archives and rare books. The service was the first English university to achieve Archive Accreditation. She also managed the Unique and Distinctive Collections project for Research Libraries UK. An active member of the CILIP Rare Books and Special Collections Group and many other sector groups, she also regularly presents at conferences, blogs and tweets on the importance of the special collections librarian"}, {"t": "Unlocking digital archives: cross-disciplinary perspectives on AI and born-digital data", "au": "Jaillant, Lise; Caputo, Annalina", "y": "2022", "ty": "article-journal", "src": "AI & SOCIETY", "link": "https://doi.org/10.1007/s00146-021-01367-x", "tags": ["Artificial Intelligence", "Born-digital archives", "Copyright", "Ethics", "Privacy", "Sensitivity Review"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Co-authored by a Computer Scientist and a Digital Humanist, this article examines the challenges faced by cultural heritage institutions in the digital age, which have led to the closure of the vast majority of born-digital archival collections. It focuses particularly on cultural organizations such as libraries, museums and archives, used by historians, literary scholars and other Humanities scholars. Most born-digital records held by cultural organizations are inaccessible due to privacy, copyright, commercial and technical issues. Even when born-digital data are publicly available (as in the case of web archives), users often need to physically travel to repositories such as the British Library or the Bibliothèque Nationale de France to consult web pages. Provided with enough sample data from which to learn and train their models, AI, and more specifically machine learning algorithms, offer the opportunity to improve and ease the access to digital archives by learning to perform complex human tasks. These vary from providing intelligent support for searching the archives to automate tedious and time-consuming tasks.  In this article, we focus on sensitivity review as a practical solution to unlock digital archives that would allow archival institutions to make non-sensitive information available. This promise to make archives more accessible does not come free of warnings for potential pitfalls and risks: inherent errors, \"black box\" approaches that make the algorithm inscrutable, and risks related to bias, fake, or partial information. Our central argument is that AI can deliver its promise to make digital archival collections more accessible, but it also creates new challenges - particularly in terms of ethics. In the conclusion, we insist on the importance of fairness, accountability and transparency in the process of making digital archives more accessible."}, {"t": "« Bibliothèques, éditeurs, libraires, face au mouvement de l’open »", "au": "Blanc-Feracci, Caroline; Braud, Marion; Forget, Camille; Michel, Eugénie; Tournier, Floriane", "y": "2022", "ty": "webpage", "src": "", "link": "https://bbf.enssib.fr/tour-d-horizon/bibliotheques-editeurs-libraires-face-au-mouvement-de-l-open_70298", "tags": [""], "br": "", "coll": "1a Intro archivistique, bibliothéconomie et SI", "abs": ""}, {"t": "2023. Bibliothèques, objets politiques", "au": "", "y": "2023", "ty": "book", "src": "", "link": "https://www.lcdpu.fr/livre/?GCOI=27000100579940&fa=description", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Quelle place occupent les bibliothèques dans les politiques publiques? Comment les élus territoriaux, les présidents d'université s'en saisissent pour les mettre au service de leurs stratégies? Pour répondre à ces questions, l'Année des bibliothèques 2023 consacre son dossier au thème «Bibliothèques, objets politiques». Rassemblant des articles d’analyse et de réflexion, des témoignages de terrain qui donneront largement la parole aux décideurs, ainsi que des éclairages internationaux, ce dossier explore toutes les facettes de la dimension politique des bibliothèques, premier réseau culturel de proximité, et de leur rôle pour faire face aux grands enjeux sociétaux d’aujourd’hui."}, {"t": "2023: Bibliothèques, objets politiques", "au": "Heurtematte, Véronique", "y": "2023", "ty": "book", "src": "", "link": "", "tags": ["France", "Public libraries"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "«Lancée en 2020 par le Bulletin des bibliothèques de France, la collection L'Année des bibliothèques est une publication annuelle imprimée (payante) dont chaque volume rassemble un dossier thématique offrant articles d'analyse, retours d'expérience, éclairages internationaux, et une rétrospective de l'année écoulée constituée d'une sélection d'informations et d'articles publiés sur le site du BBF organisés en grandes thématiques que viennent éclairer des entretiens avec des spécialistes. Quelle place occupent les bibliothèques dans les politiques publiques ? Comment les élus locaux, les présidents d'université s'en saisissent pour les mettre au service de leurs stratégies ? Quelle conscience ont les professionnels eux-mêmes de la dimension politique de leurs établissements et comment l'assument-ils ? Rassemblant analyses, réflexions, prises de position, retours d'expérience, témoignages et éclairages internationaux écrits par des professionnels de la documentation, des universitaires, des juristes, des élus ou des présidents d'université, les 35 articles réunis dans le nouveau dossier de l'Année des bibliothèques, intitulé « Bibliothèques, objets politiques », explorent cette problématique dans toute sa diversité.»-- Résumé de l'éditeur."}, {"t": "A Checklist to Publish Collections as Data in GLAM Institutions", "au": "Candela, Gustavo; Gabriëls, Nele; Chambers, Sally; Pham, Thuy-An; Ames, Sarah; Fitzgerald, Neil; Hofmann, Katrine; Harbo, Victor; Potter, Abigail; Ferriter, Meghan; Manchester, Eileen; Irollo, Alba; Van Keer, Ellen; Mahey, Mahendra; Holownia, Olga; Dobreva, Milena", "y": "2023", "ty": "article", "src": "", "link": "https://doi.org/10.48550/arXiv.2304.02603", "tags": ["Computer Science - Digital Libraries"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Large-scale digitization in Galleries, Libraries, Archives and Museums (GLAM) created the conditions for providing access to collections as data. It opened new opportunities to explore, use and reuse digital collections. Strong proponents of collections as data are the Innovation Labs which provided numerous examples of publishing datasets under open licenses in order to reuse digital content in novel and creative ways. Within the current transition to the emerging data spaces, clouds for cultural heritage and open science, the need to identify practices which support more GLAM institutions to offer datasets becomes a priority, especially within the smaller and medium-sized institutions. This paper answers the need to support GLAM institutions in facilitating the transition into publishing their digital content and to introduce collections as data services; this will also help their future efficient contribution to data spaces and cultural heritage clouds. It offers a checklist that can be used for both creating and evaluating digital collections suitable for computational use. The main contributions of this paper are i) a methodology for devising a checklist to create and assess digital collections for computational use; ii) a checklist to create and assess digital collections suitable for use with computational methods; iii) the assessment of the checklist against the practice of institutions innovating in the Collections as data field; and iv) the results obtained after the application and recommendations for the use of the checklist in GLAM institutions."}, {"t": "Alles nur leere Worte?: zum Umgang mit dem Kulturkampf von rechts in Bibliotheken", "au": "Klose, Bianca; Verein für Demokratische Kultur in Berlin; Mobile Beratung gegen Rechtsextremismus Berlin", "y": "2023", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "Deutschland", "Rechtsradikalismus"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": ""}, {"t": "Archiv: Theorie & Praxis", "au": "Landesarchiv Nordrhein-Westfalen; Verband Deutscher Archivarinnen und Archivare", "y": "2023", "ty": "book", "src": "", "link": "https://www.archive.nrw.de/landesarchiv-nrw/ueber-uns/archiv-theorie-praxis", "tags": ["Archives", "Archivistes", "Allemagne"], "br": "2", "coll": "2.3 Revues, périodiques", "abs": ""}, {"t": "Archives en bibliothèques (XVIe-XXIe siècles)", "au": "Chapron, Emmanuelle; Henryot, Fabienne", "y": "2023", "ty": "book", "src": "", "link": "http://books.openedition.org/enseditions/44474", "tags": ["archive", "bibliothèque", "erudition", "érudition", "library", "pratique savante", "scholarly practice"], "br": "2", "coll": "2.5 Ouvrages et articles; 3.5.1 Documentation de base", "abs": "Les bibliothèques sont-elles un lieu d’archivage, et si c’est le cas, qu’archivent-elles et comment le font-elles ? Cet ouvrage discute la pertinence des frontières convenues entre archives et bibliothèques, et examine dans la longue durée la construction des lieux de conservation documentaire et des fonctions, tantôt bien distinctes, tantôt plus hybrides, qui leur sont attribuées par les sociétés européennes. À partir d’études de cas, ce volume retrace les circonstances dans lesquelles certains types de documents ont été considérés comme des archives et comment ils ont été répartis dans les dépôts d’archives ou dans les bibliothèques. Il examine les critères qui fondent cette distinction institutionnelle et documentaire, et la manière dont ces choix ont conditionné le travail de tri, de sélection, de classement, de description et de consultation. Il invite ainsi à réexaminer la genèse des fonds documentaires, au sein des familles, des institutions de l’État ou des cabinets d’érudits, et à comprendre autrement les conditions documentaires de la fabrique de l’histoire, hier et aujourd’hui."}, {"t": "Disputed archival heritage", "au": "Lowry, James; Bastian, Jeannette A.", "y": "2023", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"Disputed Archival Heritage brings important new perspectives into the discourse on displaced archives. In contrast to shared or joint heritage framings, the book considers the implications of force, violence and loss in the displacement of archival heritage. With chapters from established and emerging scholars in the field of archival studies, Disputed Archival Heritage extends and enriches the conversation that started with the earlier volume, Displaced Archives. Advancing novel theories and methods for understanding disputes and claims over archives, the volume includes chapters that focus on Indigenous records in settler colonial states; literary and community archives; sub-national and private sector displacements; successes in repatriating formerly displaced archives; comparisons with cultural objects seized by colonial powers; and the relationship between repatriation and reparations. Analysing key concepts such as joint heritage and provenance, the contributors unsettle Western understandings of records, place and ownership. Disputed Archival Heritage speaks to the growing interest in shared archival heritage, repatriation of cultural artefacts and cultural diasporas. As such, it will be a useful resource for academics, students and practitioners working in the field of archives, records, and information management, as well as cultural property and heritage management, peace and conflict studies and international law\"–"}, {"t": "Grundlagen der Informationswissenschaft", "au": "Kuhlen, Rainer; Lewandowski, Dirk; Semar, Wolfgang; Womser-Hacker, Christa", "y": "2023", "ty": "book", "src": "", "link": "https://www.degruyter.com/document/doi/10.1515/9783110769043/html#overview", "tags": ["ARCHIVE (ARCHIVKUNDE)", "BIBLIOTHEKSWESEN + BIBLIOTHEKSWISSENSCHAFTEN + BIBLIOTHEKEN", "ELEKTRONISCHE ARCHIVIERUNG", "METADATEN (BIBLIOTHEKSWESEN)", "ERSCHLIESSUNG UND KLASSIFIKATION VON DOKUMENTEN (BIBLIOTHEKSWESEN)", "FACHLICHE NACHSCHLAGEWERKE + FACHLEXIKA + HANDBÜCHER (DOKUMENTENTYP)", "Informations- und Dokumentationswissenschaft", "INFORMATIONSWISSENSCHAFTEN + DOKUMENTATIONSWISSENSCHAFTEN (BIBLIOTHEKSWESEN)", "BENUTZERSCHULUNG + INFORMATIONSKOMPETENZ (BIBLIOTHEKSWESEN)", "INFORMATIONSSPEICHERUNG + INFORMATIONSGEWINNUNG (INFORMATIONSSYSTEME)", "KLASSIFIKATORISCHE SACHERSCHLIESSUNG + KLASSIFIZIERUNG (BIBLIOTHEKSWESEN)", "WISSENSMANAGEMENT", "KATALOGISIERUNG + KATALOGISIERUNGSTECHNIK (BIBLIOTHEKSWESEN)", "MEDIENWISSENSCHAFT (SOZIOLOGIE)", "THESAURUS (BIBLIOTHEKSWESEN)"], "br": "1", "coll": "1.5.1 Documentation de base; 2c Information Retrieval", "abs": "The seventh edition of the Principles of Practical Information and Documentation is now called: The Principles of Information Science. The new title does justice to the fact that there is an increasing need to theorize how we deal with knowledge and information in practice, training, and research; as well as the development of information skills, in particular in online information services. All articles in the volume have been rewritten."}, {"t": "LibGuides: Science ouverte et données de la recherche en bibliothèque: Comprendre les enjeux de la Science ouverte", "au": "Serange, Camille", "y": "2023", "ty": "webpage", "src": "", "link": "https://enssib.libguides.com/c.php?g=705396&p=5080536", "tags": [""], "br": "", "coll": "", "abs": "LibGuides: Science ouverte et données de la recherche en bibliothèque: Comprendre les enjeux de la Science ouverte"}, {"t": "Literaturliste zu ‚Wissensmanagement’", "au": "Moser, Karin", "y": "2023", "ty": "document", "src": "", "link": "https://ilias.unibe.ch/goto_ilias3_unibe_fold_2781399.html", "tags": [""], "br": "", "coll": "Wissensmanagement", "abs": ""}, {"t": "Memory curators and memory archivists in the digital memory age", "au": "McFadzean, Andrew", "y": "2023", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "This book centres around the reinvention of the traditional roles of librarian and archivist in the digital age, exploring their position as memory makers and curators. The author details the skillsets and methods available to them for the purpose of identifying, collecting, selecting, refining, reducing and summarising a flood of data into useful business information through the eSARS process. Then, the author describes the skills and concepts used by recordkeepers when dealing with the curated information so that only valued business information is selected, registered, protected and accessed. Acknowledging the influence of our current climate crisis, the book details the evolution from paper-based corporate knowledge to digital-human collective intelligence. This book relies heavily on the systems analysis concepts of recordkeeping informatics such as information culture, the records continuum, metadata, business processes and access. This book combines the artistic science of curation with the science of digital recordkeeping to assume control over information in the Digital Memory Age."}, {"t": "Preserving Disability : Disability and the Archival Profession.", "au": "Brilmyer, Gracen.", "y": "2023", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "The Humanities in the Digital: Beyond Critical Digital Humanities", "au": "Viola, Lorella.", "y": "2023", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "3a Digital Humanities", "abs": "This open access book challenges the contemporary relevance of the current model of knowledge production. It argues that the full digitisation of society sharply accelerated by the COVID-19 pandemic has added extreme complexity to the world, conclusively exposing the inadequacy of our current model of knowledge creation. Addressing many of the different ways in which reality has been transformed by technology – the pervasive adoption of big data, the fetishisation of algorithms and automation, and the digitalisation of education and research – Viola examines how the rigid conceptualisation in disciplines’ division and competition is complicit of promoting a narrative which has paired computational methods with exactness and neutrality whilst stigmatising consciousness and criticality as carriers of biases and inequality. Taking the humanities as a focal point, the author retraces schisms in the field between the humanities, the digital humanities and critical digital humanities; these are embedded, she argues, within old dichotomies: sciences vs humanities, digital vs non-digital and authentic vs non-authentic. Through the analysis of personal use cases and exploring a variety of applied contexts such as digital heritage practices, digital linguistic injustice, critical digital literacy and critical digital visualisation, the book shows a third way: knowledge creation in the digital. Lorella Viola is Research Associate in Linguistics and Digital Humanities at the Luxembourg Centre for Contemporary and Digital History (C2DH), University of Luxembourg. Her research investigates the impact of the digital transformation of society on knowledge creation theory and practice and how power, latent assumptions and implicit ideologies are manifested through language and circulated in media and society."}, {"t": "The identity of information science", "au": "Petras, Vivien", "y": "2023", "ty": "article-journal", "src": "Journal of Documentation", "link": "https://doi.org/10.1108/JD-04-2023-0074", "tags": ["Information science", "Core", "Identity", "Infrastructures", "Manifested information", "Michael Buckland Festschrift"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Purpose This paper offers a definition of the core of information science, which encompasses most research in the field. The definition provides a unique identity for information science and positions it in the disciplinary universe. Design/methodology/approach After motivating the objective, a definition of the core and an explanation of its key aspects are provided. The definition is related to other definitions of information science before controversial discourse aspects are briefly addressed: discipline vs. field, science vs. humanities, library vs. information science and application vs. theory. Interdisciplinarity as an often-assumed foundation of information science is challenged. Findings Information science is concerned with how information is manifested across space and time. Information is manifested to facilitate and support the representation, access, documentation and preservation of ideas, activities, or practices, and to enable different types of interactions. Research and professional practice encompass the infrastructures – institutions and technology –and phenomena and practices around manifested information across space and time as its core contribution to the scholarly landscape. Information science collaborates with other disciplines to work on complex information problems that need multi- and interdisciplinary approaches to address them. Originality/value The paper argues that new information problems may change the core of the field, but throughout its existence, the discipline has remained quite stable in its central focus, yet proved to be highly adaptive to the tremendous changes in the forms, practices, institutions and technologies around and for manifested information."}, {"t": "The Signal. A blog from the Library of Congress. | Digital Happenings at the Library of Congress", "au": "", "y": "2023", "ty": "webpage", "src": "", "link": "//blogs.loc.gov/thesignal", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "The Signal.  A blog from the Library of Congress."}, {"t": "Alone in the stacks: succeeding as a solo archivist", "au": "Zamon, Christina", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"Your guide to succeeding as a solo archivist. A significant portion of US institutions charged with the preservation of cultural heritage are small repositories and one-person shops. Rapid advances in technology, increasing regulation on institutional records, and exponential growth in the volume and variety of cultural resources being collected put added pressure on solo archivists to find efficient and effective ways to manage their archives. Alone in the Stacks: Succeeding as a Solo Archivists offers practical guidance on handling common work demands while promoting archival best practices. Author and former solo archivist Christina Zamon addresses a comprehensive range of topics, including administration, fundraising and donor relations, information technology, collections management, records management, preservation, reference and outreach, facility management, disaster preparedness, and internship and volunteer programs. In addition, case studies by practitioners from diverse backgrounds, institutional settings, and geographic locations discuss the challenges they faced when they found themselves responsible for the full spectrum of archival work with limited or no paid staff to assist. Seasoned archivists and newcomers to the profession will benefit from the practical tips, sound advice, and resources shared throughout the volume, as well as the opportunity to connect to the broader community of professional archivists. If you're a solo archivist, rest assured you'll find yourself less alone with this book in hand!\"–Page 4 of cover. Includes bibliographical references and index."}, {"t": "Archival science in interdisciplinary theory and practice", "au": "Rogers, Corinne; Wieland, Alexandra", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Archival Science in Interdisciplinary Theory and Practice", "au": "Rogers, Corinne; Wieland, Alexandra; Bloomsbury (Firm), publisher.", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "This book brings together scholars and practicing archivists and records managers to discuss key issues in the conceptual and theoretical frameworks of the profession."}, {"t": "Archives and Emotions : International Dialogues Across Past, Present, and Future", "au": "Scaglia, Ilaria; Vanesio, Valeria", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Archives and Emotions argues, at its most fundamental level, that emotions matter and have always mattered to both the people whose histories are documented by archives and to those working with the documents these contain. This is the first study to put archivists and historians-scholars and practitioners from different settings, geographical provenance, and stages of career-in conversation with one another to examine the interplay of a broad range of emotions and archives, traditional and digital, from the eighteenth to the twenty-first centuries across national and disciplinary borders. Drawing on methodologies from the history of emotions and critical archival studies, this book provides an original analysis of two interconnected themes through a selected number of case studies: the emotional dynamics affecting the construction and management of archives; and the emotions and their effects on the people engaging with them, such as archivists, researchers, and a broad range of communities. Its main message is that critically investigating the history and mechanics of emotions-including their suppression and exclusion-also being conscious of their effects on people and societies is essential to understanding how archives came to hold deep civic and ethical implications for both present and future. This study thus establishes a solid base for future scholarship and interdisciplinary collaborations and challenges academic and non-academic readers to think, work, and train new generations differently, fully aware that past and present choices have-and might again-hurt, inspire, empower, or silence."}, {"t": "Aux Marges de L'archivistique : Exploitation des Archives et Cinéma de Réemploi", "au": "Winand, Annaëlle", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Cet ouvrage se présente comme un travail critique qui prend pour objet transversal l'archivistique québécoise dans une perspective interdisciplinaire. Il intéressera un public universitaire, tant pour l'enseignement que la recherche, qui se penche sur les questions liées à l'archivistique, aux études cinématographiques et aux études culturelles de manière plus large"}, {"t": "Averting the Digital Dark Age", "au": "Milligan, Ian", "y": "2024", "ty": "book", "src": "", "link": "https://www.press.jhu.edu/books/title/53671/averting-digital-dark-age", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Decolonizing the Library: Considering the Movement in the Irish Colonial Contexts", "au": "Cooke-Escapil, Louise", "y": "2024", "ty": "article-journal", "src": "Libri", "link": "https://doi.org/10.1515/libri-2024-0092", "tags": ["decolonization", "libraries and indigenous peoples", "libraries and linguistic minorities", "libraries and state", "postcolonialism"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Decolonization is a concept which has been rapidly gaining traction in the library community, particularly in England, the United States, and Australia. This article addresses the question: “what does decolonizing the library look like in the Irish colonial contexts?” The role which libraries play in reckoning with colonial pasts cannot be understated. This paper will explore what decolonization can look like through Irish libraries both north and south of the border. This will be examined through Irish language revitalization, the presence of oral histories in library collections, and how libraries respond to underserved communities. This study also establishes areas for further research in this nascent field as well as outlining practical steps to implement the concept of decolonizing the library in the Irish contexts. Drawing on qualitative data pulled from interviews this paper will offer the latest information on the Irish library landscape and its relation to the broader decolonization movement. This paper aims to demonstrate the value of using the decolonization framework to address the colonial past which has impacted the way in which the information services function in modern day Ireland and pave the way towards an inclusive and equitable future."}, {"t": "Development and Access to Information 2024", "au": "", "y": "2024", "ty": "report", "src": "", "link": "https://repository.ifla.org/handle/123456789/3334", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Building on the two previous editions, the 2024 DA2I report looks back on progress in delivering on universal, meaningful access to information for development over the first half of the delivery period for the United Nations’ 2030 Agenda, through data and expert insights. The DA2I initiative is based on the conviction that access to information is an essential precondition for development. Without it, decision-making is poorer, democracy is weaker, and progress is slower towards the Sustainable Development Goals. Universal, meaningful access can only happen when there is universal connectivity, equity in societies, and the rights and skills to produce and use information."}, {"t": "Grundlagen der digitalen Langzeitarchivierung. Eine Handreichung zur digitalen Langzeitarchivierung aus Perspektive der NFDI4Culture Community.", "au": "Heseler, Jörg; Büttner, Alexandra; Arnold, Matthias", "y": "2024", "ty": "book", "src": "", "link": "https://zenodo.org/records/13929988", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "Dies ist die PDF-Publikation für die NFDI4Culture-Handreichung „Grundlagen der digitalen Langzeitarchivierung“."}, {"t": "Informationsverhalten.", "au": "Hobohm, Hans-Christoph", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "The buzzwords \"Information Society\" and \"Age of Access\" suggest that information is now universally accessible without any form of hindrance. Indeed, the German constitution calls for all citizens to have open access to information. Yet in reality, there are multifarious hurdles to information access - whether physical, economic, intellectual, linguistic, political, or technical. Thus, while new methods and practices for making information accessible arise on a daily basis, we are nevertheless confronted by limitations to information access in various domains. This new book series assembles academics and professionals in various fields in order to illuminate the various dimensions of information's inaccessability. While the series discusses principles and techniques for transcending the hurdles to information access, it also addresses necessary boundaries to accessability."}, {"t": "L' archiviste humaniste : rôles et positionnement institutionnel et sociétal. Mélanges offerts à Louise Gagnon-Arguin", "au": "Mas, Sabine; Maurel, Dominique", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Leitfaden für Digitale Langzeitarchivierung", "au": "Béguelin, Sylvie; Guedj, Romain; Naito, Théophile; Rivier, Alexis; Sacker, Brigitte; Viegener, Tobias; Wiemann, Philipp; Zürcher, Mirjam", "y": "2024", "ty": "document", "src": "", "link": "https://www.bibliosuisse.ch/Portals/0/DLZA%20Guide%20V9%20DE%20-%20clean.pdf", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Librarians, archivists, and museum professionals’ role perceptions and cross sectoral collaboration – Signs of convergence?", "au": "Tóth, Máté; Hvenegaard Rasmussen, Casper; Vårheim, Andreas; Johnston, Jamie; Khosrowjerdi, Mahmood", "y": "2024", "ty": "article-journal", "src": "Journal of Librarianship and Information Science", "link": "https://doi.org/10.1177/09610006241245101", "tags": [""], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "Public libraries, archives, and museums have identifiable differences related to their founding missions and play many roles in today’s cultural sector and broader society, yet LAM institutions’ professional activities appear very similar. Moreover, increased digitization of LAM collections allows for increased collaboration and convergence across the institutions, and the merging of L, A, and M education at the tertiary level nurtures a common professional knowledge base. How are the LAM professions developing in relation to each other; are they growing together or apart? This paper analyzes questionnaire responses reflecting European LAM professionals’ perceptions of their roles as cultural professionals and how this influences their likelihood to collaborate with others in the LAM sector. Collaboration is prevalent between the three types of professionals studied. Forty-six percent of librarians confirm that they collaborate with archives and/or museums, 60% of archives report collaborating with libraries and museums, and 73% of museologists collaborate with libraries and/or archives. LAM professionals perceive their roles as distinct and closely tied to the core of their social mission. There are various factors influencing collaboration among Library, Archive, and Museum (LAM) professionals."}, {"t": "Libraries and the 2030 Agenda: The Portuguese Case", "au": "Gama, Merabe Carvalho Ferreira da", "y": "2024", "ty": "article-journal", "src": "Libri", "link": "https://doi.org/10.1515/libri-2024-0099", "tags": ["information", "libraries", "projects", "sustainable development goals", "United Nations"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "This article studies Portuguese libraries that have won the “Libraries: Development and the 2030 Agenda” award promoted since 2018 by the Portuguese Association of Librarians, Archivists, Information and Documentation Professionals together with the General Directorate of Books, Archives and Libraries. The aim is to identify the common characteristics of the libraries that have won the award so that these success stories can help other libraries with guidance on what characteristics they should develop in their teams in order to develop projects and actions that contribute to a more sustainable world. The method used is grounded theory with human analysis and Iramuteq software. Six common characteristics were found among the libraries: partnerships, teamwork, a focus on the community, projects linked to the territory, support and alignment with senior management regarding the SDGs, and funding. These characteristics together can lead to successful projects in the context of the 2030 Agenda and promote innovative services. It is also desirable that the projects developed are constantly monitored and evaluated. We conclude that libraries that want to develop projects for the 2030 Agenda should invest in these characteristics."}, {"t": "L’édition scientifique en France : de la censure à l’ouverture : révolutions politiques, commerciales, technologiques… et autres problèmes éthiques", "au": "Verlaet, Lise", "y": "2024", "ty": "article-journal", "src": "Interfaces numériques", "link": "https://doi.org/10.25965/interfaces-numeriques.5262", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines; 3c ABD en contexte", "abs": "A travers une analyse systémique de l’édition scientifique en France – et plus particulièrement via une étude des contextes historiques, socio-économiques et politique – cet article soulève les problématiques éthiques qui ont jalonné la construction de l’écosystème scientifique et l’exploitation des produits de la recherche, et livre une réflexion sur les défis éthiques liés à la mise en place depuis 2018 de la politique de la Science Ouverte mais aussi des conséquences directes que cela va avoir sur les pratiques des chercheurs."}, {"t": "Open Science Meets Citizen Science", "au": "Greshake Tzovaras, Bastian", "y": "2024", "ty": "book", "src": "", "link": "https://cs4rl.github.io/open-science/#_1_0", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines; 3c ABD en contexte", "abs": ""}, {"t": "Quelles perspectives pour des politiques de numérisation patrimoniale écoresponsables ?", "au": "", "y": "2024", "ty": "post-weblog", "src": "", "link": "https://bib.vertes.abf.asso.fr/quelles-perspectives-pour-des-politiques-de-numerisation-patrimoniale-ecoresponsables/", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles; 3.5.2 Développements, problématiques contemporaines; 3c ABD en contexte", "abs": "La Commission Bibliothèques vertes de l’Association des Bibliothécaires de France (ABF) vous propose aujourd’hui un billet qui traite de numérisation de collections et d’écorespon…"}, {"t": "The Bloomsbury handbook of modernist archives", "au": "Callison, Jamie; Feldman, Matthew; Svendsen, Anna; Tonning, Erik", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"Providing a broad, definitive account of how the 'archival turn' in humanities scholarship has shaped modernist studies, this book also functions as an ongoing 'practitioner's toolkit' (including useful bibliographical resources) and a guide to avenues for future work. Offering a variety of single-author case studies on recent archival developments and editing projects, including Samuel Beckett, Hart Crane, H.D., James Joyce, Dorothy Richardson, May Sinclair and Virginia Woolf, it also offers a range of thematic essays that examine an array of underused sources as well as the challenges facing archival researchers of modernism\"–"}, {"t": "The Handbook of Archival Practice", "au": "Patricia C. Franks", "y": "2024", "ty": "book", "src": "", "link": "https://rowman.com/ISBN/9781538137345/The-Handbook-of-Archival-Practice", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Here is a complete reference guide to the activities that identify various stages of archival practice. Among the environmental topics to be addressed from a practitioner’s standpoint are legal, r..."}, {"t": "The materiality of the archive : creative practice in context", "au": "Breakell, Sue; Russell, Wendy", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"The Materiality of the Archive is the first volume to bring together a range of methodological approaches to the materiality of archives, as a framework for their engagement, analysis and interpretation. Focusing on the archives of creative practices, the book reaches between and across existing bodies of knowledge in this field, including material culture, art history and literary studies, unified by an interest in archives as material deposits and aggregations, in both analogue and digital forms, as well as the material encounter. Connecting a breadth of disciplinary interests in the archive with expanding discourses in materiality, contributors address the potential of a material engagement to animate archival content. Analysing the systems, processes and actions that constitute the shapes, forms and structures in which individual archival objects accumulate, and the underpinnings which may hold them in place as an archival body, the book considers ways in which the inexorable move to the digital affects traditional theories of the physical archival object. It also considers how stewardship practices such as description and metadata creation can accommodate these changes. The Materiality of the Archive unifies theory and practice and brings together professional and academic perspectives. The book is essential reading for academics, researchers and postgraduate students working in the fields of archive studies, museology, art history and material culture\"– Provided by publisher"}, {"t": "The Nordic model of digital archiving", "au": "Bak, Greg; Rostgaard, Marianne", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "The Routledge Companion to Libraries, Archives, and the Digital Humanities.", "au": "Russell, Isabel Galina.; Layne-Worthey, Glen.", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung; 3a Digital Humanities", "abs": "The Routledge Companion to Libraries, Archives, and the Digital Humanities covers a wide range of issues encountered in the world's libraries and archives as they continue to expand their support of, and direct engagement in, DH research and teaching."}, {"t": "The Routledge Companion to Libraries, Archives, and the Digital Humanities.", "au": "Russell, Isabel Galina.; Layne-Worthey, Glen.", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "3a Digital Humanities", "abs": "The Routledge Companion to Libraries, Archives, and the Digital Humanities covers a wide range of issues encountered in the world's libraries and archives as they continue to expand their support of, and direct engagement in, DH research and teaching."}, {"t": "The Routledge Companion to Transnational Web Archive Studies.", "au": "Aasman, Susan.; Ben-David, Anat.; Brügger, Niels.", "y": "2024", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "The Routledge Companion to Transnational Web Archive Studies explores the untapped potential of web archives for researching transnational digital history and communication. It covers cross-border, cross-collection, and cross-institutional examination of web archives on a global scale."}, {"t": "Whitepaper Maschinelles Lernen im Archiv: Tiefenerschliessung im Dienst des Archivzugangs", "au": "Arnold, Jonas; Lüpold, Martin; Theilkäs, Lorenz; Kansy, Lambert", "y": "2024", "ty": "report", "src": "", "link": "https://vsa-aas.ch/wp-content/uploads/2024/08/MachineLearning_im_Archiv_Whitepaper_2024-08-08.pdf", "tags": [""], "br": "", "coll": "2c Information Retrieval", "abs": ""}, {"t": "Yves Pérotin (1922-1981) : l'archiviste inimitable", "au": "Tizon-Germe, Anne-Cécile; Vasseur, Édouard", "y": "2024", "ty": "document", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Né le 15 juillet 1922 à Bordeaux, Yves Pérotin est sans doute un des archivistes français les plus connus et reconnus au niveau national et international, notamment pour sa formalisation de la théorie dite des trois âges des archives. Résistant, archiviste paléographe (promotion 1948), Yves Pérotin a exercé successivement, entre 1952 et 1981, les fonctions de directeur des archives départementales de Lot-et-Garonne, de La Réunion, de la Seine et du Var, avant de terminer sa carrière comme archiviste aux archives départementales des Pyrénées-Orientales. Son parcours l'a également conduit à exercer son métier dans des organisations internationales, telles les Nations unies, au sein des archives de la Société des nations, puis au Bureau international du travail et à l'Organisation mondiale de la santé. Il a également réalisé des missions pour l'UNESCO en Algérie, en Irak, au Maroc, et au Pérou. Yves Pérotin (1922-1981). L'archiviste inimitable fait écho au récit rédigé par Yves Pérotin après-guerre à l'issue de son expérience de maquisard sur les maquis du Trièves et du Vercors auxquels il a appartenu et intitulé La vie inimitable (Presses universitaires de Grenoble, 2014). Cet ouvrage a pour ambition d'éclairer la carrière et la pensée d'Yves Pérotin, à travers une dizaine de contributions ainsi que l'édition ou la réédition de deux textes importants de cette figure marquante de l'archivistique française et internationale"}, {"t": "An Overview of Emulation as a Preservation Method", "au": "Kaltman, Eric; Schwaid-Lindner, Winnie; Jonathan, Drey; Borman, Andrew; Garnett, Alex; Masinert, Larry", "y": "2025", "ty": "report", "src": "", "link": "https://www.clir.org/wp-content/uploads/sites/6/2025/07/An_Overview_of_Emulation_as_a_Preservation_Method_CLIRpub194.pdf", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Archivrecht : Leitfaden für Praxis und Ausbildung", "au": "Henne, Thomas", "y": "2025", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Mit diesem prägnanten Leitfaden für Ausbildung und Praxis finden Sie auf alle wesentlichen archivrelevanten Rechtsfragen fundierte Antworten.Der \"Allgemeine Teil\" betrachtet neben grundlegenden Themen und über die einschlägigen Archivgesetze hinaus auch relevante Teile der folgenden Rechtsgebiete: - Allgemeines Verwaltungsrecht- Datenschutzrecht und Informationsfreiheitsgesetz- Kulturgut- und Denkmalschutzrecht- Steuerrecht- Zivilrecht- Materielles StrafrechtDer \"Besondere Teil\" beschäftigt sich dann mit dem rechtlichen Rahmen archivischer Fachaufgaben, unter besonderer Berücksichtigung des Bundesarchivgesetzes und der Landesarchivgesetze:- Entstehung von Archivgut aufgrund von Anbietung und Depositalverträgen- Erschließung und Bestandserhaltung von Archivgut- Beseitigung von Archivgut (\"Nachkassation\")- Nutzung von Archivgut durch den Zugang zum ArchivEin strukturierter Gesamtüberblick mit vielen aktuellen Beispielen mit Archivbezug"}, {"t": "Die GND im Archiv : Handreichung zur Nutzung von Normdaten", "au": "", "y": "2025", "ty": "book", "src": "", "link": "http://collections.fes.de/publikationen/1562378", "tags": [""], "br": "1", "coll": "1.5 Ouvrages et articles", "abs": "Publikationen der Stiftung. Die GND im Archiv : Handreichung zur Nutzung von Normdaten / verfasst von Autorinnen und Autoren der Arbeitsgruppe \"Information und Wissensvermittlung\" der Interessengruppe Archiv im GND-Netzwerk: Mirjam Sprau, Anna Bohn, Simon Göllner, Chantal Köppl, Stephanie Marra, Andreas Marquet, Franziska Mücke, Stefan Watzlawzik. Berlin ; Bonn ; Frankfurt am Main, 17. Januar 2025"}, {"t": "Digital preservation for libraries, archives, and museums", "au": "Corrado, Edward M.; Moulaison-Sandy, Heather; Soleau, Teresa; Kilbride, William", "y": "2025", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "\"A complete overview of digital preservation theory and practice for cultural institutions and professions.\" - Provided by publisher"}, {"t": "Digitalisierung on demand", "au": "", "y": "2025", "ty": "motion_picture", "src": "", "link": "https://www.youtube.com/watch?v=AXz4ZB-BTAA", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "Mit wenigen Klicks online bestellt und per E-Mail geliefert: Diese bequeme Art, Unterlagen des Schweizer Bundesarchivs digital zu konsultieren, ist einfach, praktisch und steht allen zur Verfügung. \nDer Film stellt den Prozess hinter der Digitalisierung on demand vor – ein spannender Blick hinter die Kulissen des Digitalisierungscenters!"}, {"t": "Exploring contemporary classification practices : organizing information, technological change and ideological contestation", "au": "Andersen, Jack; Hansson, Joacim", "y": "2025", "ty": "book", "src": "", "link": "", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "\"The contributions in Exploring Contemporary Classification Practices analyse various aspects of classification and their importance to contemporary debates surrounding cultural heritage and information access. Specific focus is on systems of classification, media technologies, and cultural institutions (such as libraries, archives and museums) and how they respond to challenges including classificatory bias, truth, neutrality, institutional tradition, and technological innovation. Raising awareness of classification practices in modern culture serves to emphasise how sorting things into categories is both an everyday accomplishment and a highly cultural and political activity with consequences for those who are classified and for those who classify. Throughout this book, 'classification' is defined as the practice and activity of systematically ordering and categorizing entities to bring structure and understanding to diverse contexts. This book addresses several timely issues both in terms of theoretical advancement and empirical diversity. The scholarly discussion on classification and organization of knowledge has developed with digital technologies from a bibliographic paradigm into something much wider, as the need for metadata and classification has become critical for usability and legitimacy. This development has also led research on classification and knowledge organization to confront a new, post-humanist reality with not only emerging varieties of information currents in society, but also the development of new theoretical and methodological strands, such as post-colonial and intersectional perspectives, and digital humanities methodologies. In doing so, this book seeks to address critical questions for the archives, library, and museum sectors concerning the organization of information. Exploring Contemporary Classification Practices will therefore be of interest to academics, researchers and practitioners with interests in library and information science, archives, cultural heritage and digital heritage\"– Provided by publisher"}, {"t": "Information governance technologies : a guide", "au": "Saffady, William", "y": "2025", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "1d Records Management", "abs": "\"Information Governance Technologies: A Guide provides a clear explanation and analysis of technologies that support information governance programs and initiatives\"– Provided by publisher."}, {"t": "Le numérique-monde. Histoire et géopolitique de la logistique informationnelle du télégraphe à l’IA -", "au": "Robert, Pascal", "y": "2025", "ty": "book", "src": "", "link": "https://fypeditions.com/le-numerique-monde-histoire-et-geopolitique-de-la-logistique-informationnelle-du-telegraphe-a-lia/", "tags": [""], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "Et si le numérique n’était pas aussi immatériel qu’on le croit ?\nDerrière chaque clic, chaque connexion, se cache une infrastructure gigantesque et méconnue : des centaines de câbles sous-marins, des milliers de centres de données, une myriade de satellites et des milliards de smartphones et d’ordinateurs interconnectés. Cette « méga-machine », fruit de deux siècles d’innovations techniques, ne se contente pas de faire fonctionner les échanges et l’économie mondiale ; elle redéfinit en profondeur les rapports de pouvoir économiques, politiques et sociaux.\nDans Le Numérique-Monde, Pascal Robert, expert reconnu des enjeux politiques des grands systèmes techniques, retrace pour la première fois l’histoire captivante de cette logistique informationnelle, depuis l’invention du télégraphe jusqu’aux défis posés par l’intelligence artificielle. Il dévoile comment cette infrastructure, souvent invisible, mais aux conséquences profondes, est devenue un levier stratégique majeur qui bouleverse les relations entre États, entreprises et citoyens.\nCet ouvrage majeur offre un cadre rigoureux et inédit pour comprendre les fondations techniques du numérique et mesurer l’importance cruciale de la maîtrise de cette logistique, qu’elle soit économique, stratégique ou environnementale. En éclairant les mécanismes idéologiques, géopolitiques et organisationnels qui sous-tendent cette transformation, il s’adresse à tous ceux qui veulent décrypter le véritable pouvoir du numérique et anticiper les bouleversements à venir."}, {"t": "Library Catalogues As Data : Research, Practice and Usage.", "au": "Gooding, Paul.; Terras, Melissa.; Ames, Sarah.", "y": "2025", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2c Information Retrieval", "abs": "This book brings together leading practitioners and academic voices to discuss a range of topics surrounding library information and data."}, {"t": "Marketing appliqué des bibliothèques et services d’information: dispositifs et évolutions", "au": "Accart, Jean-Philippe", "y": "2025", "ty": "book", "src": "", "link": "", "tags": ["Marketing", "Bibliothèques", "Publics", "Évaluation", "Conception centrée sur l'utilisateur", "Marketing digital", "Systèmes de communication"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "The Digital Accessibility Handbook for Libraries", "au": "Spina, Carli; Albrecht Oling, Rebecca", "y": "2025", "ty": "book", "src": "", "link": "https://alastore.ala.org/dahdbkl", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines; 1b Activités et fonctions des services d'archives, des bibliothèques et des centres d'information", "abs": "Providing concrete guidance on integrating accessibility into all aspects of a library’s digital work, this book will serve as your one-stop guide to accessibility standards, processes, and best practices.\n\nA complicated topic encompassing many disparate facets, digital accessibility in libraries is in constant flux as new technologies emerge and design standards continue to evolve. This makes it challenging for library workers to ensure that their libraries meet legal requirements while also fostering inclusion for all their community members. Incorporating advice from a range of outside accessibility experts and practitioners, this guide is here to help. It delves into practical steps you can take to ensure that your library’s online presence is welcoming to everyone and that all your digital offerings avoid barriers that can exclude users with disabilities. No matter your level of experience or type of library, from this book you will\n\n - come to understand what is meant by disability and why libraries have obligations to support disabled users;\n- learn about a wide range of software and hardware for creating inclusive spaces and services regardless of your budget limitations or staffing levels;\n- get comfortable with the overarching principles of online accessibility and how they specifically apply to library websites, digital media and files, digital communications, and emerging technologies such as augmented reality, virtual reality, and artificial intelligence (AI);\n- discover how libraries can verify the accessibility of the tools they develop or subscribe to, including best practices for working with vendors to optimize the accessibility of their library products;\n- be invited to reflect upon the future of digital accessibility, particularly concerning education and hiring to ensure that accessibility remains central to the work done at all libraries.\n\nBoth Spina and Oling have worked within SUNY - The State University of New York to hone skills and thinking in this area, resulting in the Library Procurement Accessibility Toolkit, an ongoing project. They currently co-chair a subcommittee reviewing the SUNY libraries' implementation of the Electronic Information Accessibility Policy."}, {"t": "The Future of Memory : A History of Lossless Format Standards in the Moving Image Archive.", "au": "Jones, Jimi.; Jancovic, Marek.", "y": "2025", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "The Indigenous Right of Reply to Archives : Working Towards Indigenous Sovereignty, Healing, and Justice in Archival Practice.", "au": "Collective, The Indigenous Archives.", "y": "2025", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "This volume offers a blueprint for decolonising archives and centring Indigenous agency, illuminating the innovative strategies being implemented across institutional and community settings. It is essential reading for archivists, curators, scholars, and anyone committed to transforming GLAM practice."}, {"t": "The Routledge Handbook of Information History.", "au": "Weller, Toni.; Black, Alistair.; Mak, Bonnie.; Skouvig, Laura.", "y": "2025", "ty": "book", "src": "", "link": "", "tags": [""], "br": "1", "coll": "1.5 Ouvrages et articles; 1.5.1 Documentation de base", "abs": "The Routledge Handbook of Information History offers a definitive, inclusive and far-reaching study of how information practices have influenced, and been influenced by, society, politics, culture and technology over past millennia."}, {"t": "Unearthing Collections : Archives, time and ethics.", "au": "Buchczyk, Magdalena", "y": "2025", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Wissensmanagement, Archivbibliotheken und das Überlieferungsfeld Kultur : Beiträge des 32. Fortbildungsseminars der Bundeskonferenz der Kommunalarchive (BKK) vom 27. – 29. November 2024", "au": "", "y": "2025", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "Wissensmanagement", "abs": ""}, {"t": "Überlieferung und archivische Bewertung", "au": "Wendenburg, Andrea; Archivare, Verband Deutscher Archivarinnen und", "y": "2025", "ty": "book", "src": "", "link": "https://d-nb.info/1380608929/04", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Fragile Akten? : Herausforderungen digitaler Überlieferungsbildung und Faktizität", "au": "Kruke, Anja; Grothe, Ewald; Demokratie, Archiv der Sozialen", "y": "2026", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Knowledge into action : research methods for library, archives, and museum professionals", "au": "Burke, Susan K", "y": "2026", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "1a Intro archivistique, bibliothéconomie et SI", "abs": "\"This new edition of a trailblazing textbook is written for students and professionals who need real-world approaches to applying research methodologies to solve practical problems within their institutions\"– Provided by publisher"}, {"t": "Organizing archival records : a guide for both physical and digital collections", "au": "Carmicheal, David W", "y": "2026", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"Much of our nation's documentary heritage resides in small historical societies, libraries, cultural organizations, houses of worship, and museums. The preservation of this heritage often depends on the dedicated efforts of people who, in their workaday world, practice some profession other than archivist. For thirty years, Organizing Archival Records has equipped non-professional archivists to tackle the challenging task of arranging and describing archival materials. The latest edition preserves the practical, easy-to-follow, step-by-step approach of earlier editions while updating its content to reflect current archival practices and growing concerns over social justice, while offering solutions for common collection problems\"– Provided by publisher"}, {"t": "Practical guidebook to trauma-informed archival practice : best practices and and case studies", "au": "Ganz, Michelle; Denison, Veronica L.; Moody, Nisha", "y": "2026", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "3c ABD en contexte", "abs": "\"A Practical Guidebook to Trauma-Informed Archival Practice: Best Practices and Case Studies explores trauma in archival work from the archivists' perspective. It examines how trauma can manifest not only when processing collection but also in donor relationships, researcher interactions, and professional practices. This guide offers strategies for creating policies and workflows to reduce harm and foster trust throughout the archival process. The authors highlight practical approaches to minimizing trauma across archival work, including: supporting grieving donors throughout the donation process; identifying trauma in archival workers, support staff, volunteers, and students before, during, and after exposure; understanding the effects of trauma on the body and brain and offering short- and long-term solutions. This book is a practical guide for archivists seeking to implement trauma-informed practices that benefit everyone who engages with archival materials\"–Page 4 of cover"}, {"t": "Revisiting the Vestiges of Knowledge-Making", "au": "Volynskaya, Alina", "y": "2026", "ty": "book", "src": "", "link": "https://doi.org/10.1515/9783111729664", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "(2016) - Les 5 défis actuels et futurs du métier de documentaliste - La Profession - Articles- Jean-Philippe Accart", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.jpaccart.ch/la-profession/2016-les-5-defis-actuels-et-futurs-du-metier-de-documentaliste.html", "tags": [""], "br": "", "coll": "1a Intro archivistique, bibliothéconomie et SI", "abs": ""}, g leadership positions in libraries and archives or teaching posts at universities."}, {"t": "Bibliotheksdienst", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/32751/issues/current", "tags": [""], "br": "3", "coll": "3.3.3 Allemagne", "abs": "Der BIBLIOTHEKSDIENST erscheint jährlich in jeweils 10 Heften (monatlich, davon 2 Doppelhefte) und beleuchtet traditionelle wie auch technisch-innovative Themenbereiche, vermittelt Informationen aus den Bibliotheken sowie aus Institutionen, Verbänden und Vereinen des Bibliothekswesens und seiner Nachbarbereiche. Seine Stärke liegt in der praxis-orientierten thematischen Ausrichtung."}, {"t": "Bibliothèque nationale suisse", "au": "BN, Bibliothèque nationale suisse", "y": "", "ty": "webpage", "src": "", "link": "https://www.nb.admin.ch/snl/fr/home.html", "tags": [""], "br": "3", "coll": "3.6 Sites web", "abs": "La Bibliothèque nationale suisse (BN) collectionne, catalogue, conserve et met à disposition tout ce qui est publié en Suisse ou sur la Suisse. La collection de la BN comprend près de sept millions de publications analogiques et numériques, dont des livres, des journaux, des supports sonores et des documents iconographiques. Les Archives littéraires suisses, le Cabinet des estampes, le Centre Dürrenmatt Neuchâtel et la Phonothèque nationale suisse à Lugano – fonds d’archives sonores suisses – font partie de la BN."}, {"t": "Bibliothèques [reloaded]", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://bibliotheques.wordpress.com/", "tags": [""], "br": "3", "coll": "3.6.2 Blogs", "abs": ""}, {"t": "Bibliothéconomie et sciences de l'information - une collection de Renouvaud", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://renouvaud1.primo.exlibrisgroup.com/discovery/collectionDiscovery?vid=41BCULAUSA_LIB:VU2&inst=41BCULAUSA_LIB&collectionId=81396593490002852", "tags": [""], "br": "3", "coll": "3.2 Bases de données, archives ouvertes", "abs": ""}
