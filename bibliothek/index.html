 die Wissenschaft. So wird Grundwissen zu Informationsressourcen vermittelt, das direkt in der Praxis eingesetzt werden kann."}, {"t": "Introduction to Information Behaviour", "au": "Ford, Nigel", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["General", "Library & Information Science", "Information literacy", "Information behavior", "Language Arts & Disciplines"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "This landmark textbook is an essential primer for students and practitioners interested in information seeking, needs and behaviour, user studies and information literacy."}, {"t": "Kompetenzen von Information Professionals in Unternehmen", "au": "Knoll, Anna", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Informationsmanagement", "Unternehmen"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Information Professionals sind in Unternehmen für den professionellen und strategischen Umgang mit Informationen verantwortlich. Da es keine allgemeingültige Definition für diese Berufsgruppe gibt, also wird hier eine Begriffsbestimmung unternommen. Mit Hilfe dreier Methoden, einer Auswertung von relevanter Fachliteratur, die Untersuchung von einschlägigen Stellenausschreibungen und das Führen von Experteninterviews, wird ein Kompetenzprofil für Information Professionals erstellt. 16 Kompetenzen in den Bereichen Fach-, Methoden-, Sozial- und persönliche Kompetenzen geben eine Orientierung über vorhandene Fähigkeiten dieser Berufsgruppe."}, {"t": "La communication interne: stratégies et techniques", "au": "Décaudin, Jean-Marc; Igalens, Jacques", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Entreprises", "Communication", "Direction du personnel"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "La quarta rivoluzione: come l'infosfera sta trasformando il mondo", "au": "Floridi, Luciano", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Effetti [della] Tecnologia dell'informazione e della comunicazione", "Mutamento sociale"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Chi siamo e che tipo di relazioni stabiliamo gli uni con gli altri? Luciano Floridi sostiene che gli sviluppi nel campo delle tecnologie dell'informazione e della comunicazione stiano modificando le risposte a domande così fondamentali. I confini tra la vita online e quella offline tendono a sparire e siamo ormai connessi gli uni con gli altri senza soluzione di continuità, diventando progressivamente parte integrante di un'\"infosfera” globale. Questo passaggio epocale rappresenta niente meno che una quarta rivoluzione, dopo quelle di Copernico, Darwin e Freud. L'espressione \"onlife” definisce sempre di più le nostre attività quotidiane: come facciamo acquisti, lavoriamo, ci divertiamo, coltiviamo le nostre relazioni. In ogni campo della vita, le tecnologie della comunicazione sono diventate forze che strutturano l'ambiente in cui viviamo, creando e trasformando la realtà. Saremo in grado di raccoglierne i frutti? Quali, invece, i rischi impliciti? Floridi suggerisce che dovremmo sviluppare un approccio in grado di rendere conto sia delle realtà naturali sia di quelle artificiali, in modo da affrontare con successo le sfide poste dalle tecnologie correnti e dalle attuali società dell'informazione."}, {"t": "Le plan de communication: définir et organiser votre stratégie de communication", "au": "Libaert, Thierry", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Communication dans les organisations", "Planification stratégique"], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": "Présentation d'une méthode de conception de plan de communication d'entreprise abordant sa place et son rôle, les préalables à sa réalisation et les types de plans possibles. L'ouvrage s'attache ensuite à définir les attentes, les enjeux et l'objectif stratégique ainsi qu'à délimiter cibles, messages et moyens. Avec des conseils, des avis d'experts et des compléments en ligne. [Electre], Le plan est le pivot central de la communication de l'entreprise : il en indique les objectifs, définit les messages, sélectionne les cibles, délimite les moyens. Pratique et didactique, cet ouvrage constitue un guide d'élaboration du plan de communication. - Comment rédiger un plan de communication ? - Comment le faire reconnaître dans l'entreprise ? - Comment le piloter et le mettre en oeuvre ? Cette 5e édition, entièrement actualisée, propose des conseils, des avis d'experts et des modèles de plans de communication thématiques : interne, financière, de crise, de développement durable. Elle est accompagnée de compléments en ligne offrant des outils supplémentaires pour concevoir efficacement un plan de communication.  -- 4ème de couverture."}, {"t": "Médiation numérique des savoirs: des enjeux aux dispositifs", "au": "Dujol, Lionel", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Société numérique", "Gestion des connaissances", "Bibliothéconomie Innovations technologiques", "Échange de savoirs", "Édition en libre accès"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Dans un monde connecté, la question à soulever est moins celle de l'accès à l'information que celle des parcours et des choix menant à telle ou telle information. A ce titre, les médiations numériques des savoirs n'ont jamais été aussi nombreuses. Mots-valises pour certains, médiation et numérique peuvent prendre un sens précis à condition de les considérer comme les clés d'une démarche au service du partage et de développement des savoirs et des savoir-faire.\nMais comment traduire cet objectif en dispositifs concrets ? Comment développer une stratégie de médiation dans le cadre d'une politique publique ? Nous verrons pourquoi et comment le centre de gravité de l'activité d'une bibliothèque peut se déplacer de la constitution de collections vers des activités de curation et de médiations numériques des contenus. Ce livre est l'aboutissement de plus de dix ans de pratiques et de réflexions menées par les auteurs à travers leur pratique professionnelle, leurs blagues et l'animation de formations continues pour les bibliothécaires.\nA la fois réflexion sur les enjeux et manuel pratique, il s'adresse à tous ceux, professionnels de l'information, étudiants ou curieux qui souhaitent mieux comprendre et contribuer à la circulation des idées à l'ère numérique."}, {"t": "Open Access: models, strategies, costs", "au": "Verdicchio, Dirk", "y": "2017", "ty": "document", "src": "", "link": "https://boris.unibe.ch/101716/1/verdicchio-sgc.pdf", "tags": ["020 Library & information sciences"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": ""}, {"t": "Public Management: innovative Konzepte zur Führung im öffentlichen Sektor", "au": "Thom, Norbert; Ritz, Adrian", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Administration publique", "Verwaltung", "Innovations technologiques", "Gestion", "Führung", "Innovationsmanagement", "Neues Steuerungsmodell", "Organisationsgestaltung", "Verwaltungsreform"], "br": "2", "coll": "2.5 Ouvrages et articles; 3.5.1 Documentation de base", "abs": ""}, {"t": "Recherche d'information: applications, modèles et algorithmes", "au": "Amini, Massih-Reza; Gaussier, Éric", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Recherche de l'information", "Moteurs de recherche sur Internet", "Algorithmes", "Données massives", "Exploration de données"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Le premier ouvrage francophone sur les algorithmes qui sous-tendent les technologies de big data et les moteurs de recherche ! Depuis quelques années, de nouveaux modèles et algorithmes sont mis au point pour traiter des données de plus en plus volumineuses et diverses. Cet ouvrage présente les fondements scientifiques des tâches les plus répandues en recherche d'information (RI), tâches également liées au data mining, au décisionnel et plus généralement à l'exploitation de big data. Il propose un exposé cohérent des algorithmes classiques développés dans ce domaine, abordable à des lecteurs qui cherchent à connaître le mécanisme des outils quotidiens d'Internet. Le lecteur approfondira les concepts d'indexation, de compression, de recherche sur le Web, de classification et de catégorisation, et pourra prolonger cette étude avec les exercices corrigés proposés en fin de chapitre."}, {"t": "Recherche und Weiterverarbeitung: digitale Angebote der Archive für die historische Forschung im Netz", "au": "Kretzschmar, Robert; Hering, Rainer", "y": "2017", "ty": "paper-conference", "src": "", "link": "", "tags": ["Archiv", "Digitalisierung", "Geschichtswissenschaft"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Beiträge einer Sektion auf dem 51. Deutschen Historikertag 2016 in Hamburg"}, {"t": "Theleme. Techniques pour l’Historien en Ligne : Etudes, Manuels, Exercices. Bibliographie d’archivistique générale", "au": "ENC Ecole des Chartes", "y": "2017", "ty": "webpage", "src": "", "link": "http://theleme.enc.sorbonne.fr/bibliographies/", "tags": [""], "br": "2", "coll": "2.1 Répertoires bibliographiques", "abs": ""}, {"t": "Valuing your collection: a practical guide for museums, libraries and archives", "au": "Matassa, Freda", "y": "2017", "ty": "book", "src": "", "link": "", "tags": ["Archival materials", "Archives", "Collection management", "Books", "Antiquities", "Collection management (Libraries)", "Museums", "Valuation"], "br": "2", "coll": "2.5 Ouvrages et articles; 3.5.1 Documentation de base", "abs": "This book addresses the issue of valuing objects in cultural collections, ranging from high-value to low or no-value and featuring a range of collections including fine art, archives, science and photography. Practical advice is given on how to assign values and best practice examples are drawn from museums, libraries and archives. The subject of valuation has always been challenging for museums and public collections and is becoming more urgent as monetary values of many items continue to break records. There is an increase in lending, with more loans requiring a value for insurance. Cultural collections and exhibitions are expanding to all corners of the world, while, at the same time, lenders are becoming more risk-averse. Valuing Your Collection will address the issues and offer some solutions."}, {"t": "A Knowledge Representation Practionary: Guidelines Based on Charles Sanders Peirce", "au": "Bergman, Michael K.", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Artificial intelligence", "Artificial Intelligence", "Computer science", "Computers", "Information Systems and Communication Service", "Management information systems", "Management of Computing and Information Systems"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "This book is one of timeless, practical guidelines for how to think about KR and to design knowledge management (KM) systems. The book is grounded bedrock for enterprise information and knowledge managers who are contemplating a new knowledge initiative. This book is an essential addition to theory and practice for KR and semantic technology and AI researchers and practitioners, who will benefit from Peirce's profound understanding of meaning and context."}, {"t": "Academic librarianship", "au": "Evans, G. Edward; Greenwell, Stacey", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Administration", "BIBLIOTHEKSDIENSTLEISTUNGEN (BIBLIOTHEKSWESEN)", "Wissenschaftliche Bibliothek", "WISSENSCHAFTLICHE BIBLIOTHEKEN + TECHNISCHE BIBLIOTHEKEN (BIBLIOTHEKSWESEN)", "BIBLIOTHEKARE (BIBLIOTHEKSWESEN)", "BIBLIOTHEKARINNEN (BIBLIOTHEKSWESEN)", "VEREINIGTE STAATEN VON AMERIKA, USA (NORDAMERIKA)", "United States", "Academic libraries", "HOCHSCHULBIBLIOTHEKEN + MITTELSCHULBIBLIOTHEKEN (BIBLIOTHEKSWESEN)", "BIBLIOTHEKSGESCHICHTE + GESCHICHTE DES BIBLIOTHEKSWESENS", "Academic librarians", "BIBLIOTHEKSBESTÄNDE/DOKUMENTE, ALLGEMEIN (BIBLIOTHEKSWESEN)", "Libraries and colleges", "SZENARIEN + ZUKUNFTSMODELLE", "USA", "Wissenschaftlicher Bibliothekar"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "\"This is a comprehensive overview that has been revised and updated to offer coverage of topics like teaching faculty roles and the status of the academic librarian, curriculum, collections, data management, digitization, and metadata, as well as scholarly communication\" Provided by publisher"}, {"t": "Analyse et pilotage des politiques publiques", "au": "Knoepfel, Peter", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["pilotage (gestion de projet)", "politique publique", "politique publique - analyse"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Applying library values to emerging technology: decision-making in the age of open access, maker spaces, and the ever-changing library", "au": "Fernandez, Peter D.; Tilton, Kelly", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Information technology", "Library science", "Libraries", "Technological innovation"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Every year, emerging technologies are more deeply integrated into libraries and the lives of the users they serve. These technologies are not simply neutral tools—they come embedded with their own sets of assumptions and values. As users and creators of technologies, as well as institutions that are part of the fabric of their communities, libraries must uphold the values of the profession—values that are often in tension with one another, and with the values embedded in the technology that is available—while effectively meeting the evolving needs of their users.\n\nApplying Library Values to Emerging Technology: Decision-Making in the Age of Open Access, Maker Spaces, and the Ever-Changing Library offers a wide range of perspectives on how to interpret and apply library values in the context of emerging technologies."}, {"t": "Archive heute - Vergangenheit für die Zukunft: Archivgut - Kulturerbe - Wissenschaft : zum 65. Geburtstag von Robert Kretzschmar", "au": "Rehm, Clemens; Maier, Gerald", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archives", "Deutschland", "Archivistique", "Archivkunde", "Allemagne", "Kretzschmar, Robert 1952-"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Archivologie: Theorien des Archivs in Philosophie, Medien und Künsten", "au": "Ebeling, Knut; Günzel, Stephan", "y": "2018", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Beiträge der 21. Jahrestagung des Arbeitskreises \"Archivierung von Unterlagen aus digitalen Systemen\" Basel, 28. Februar und 1. März 2017", "au": "Büchler, Georg", "y": "2018", "ty": "paper-conference", "src": "", "link": "https://bop.unibe.ch/iw/issue/view/784", "tags": ["Archiv", "Archivage électronique", "Suisse", "Sciences de l'information", "Datensicherung"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Bibliotheken der Schweiz: Innovation durch Kooperation : Festschrift für Susanna Bliggenstorfer anlässlich ihres Rücktrittes als Direktorin der Zentralbibliothek Zürich", "au": "Uhl, Susanne; Keller, Alice; Zentralbibliothek Zürich", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Schweiz", "Switzerland", "Library science", "Wissenschaftliche Bibliothek", "Libraries", "Kooperation"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": ""}, {"t": "Bibliothécaires, documentalistes: tous entrepreneurs ?", "au": "Accart, Jean-Philippe; Vaissaire, Clotilde", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Bibliothécaires", "Documentalistes", "LITTERATURE PROFESSIONNELLE", "BIBLIOTHEQUE", "Entrepreneurs (économie politique) Bibliothèques", "Travailleurs indépendants"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Des solutions et des réponses aux questions que peuvent se poser les travailleurs indépendants dans le domaine de l'information, de la documentation et des bibliothèques. Des témoignages de professionnels de ce secteur illustrent la réflexion sur les évolutions de ces métiers. [Electre]"}, {"t": "Cinderella's Stick: A Fairy Tale for Digital Preservation", "au": "Tzitzikas, Yannis; Marketakis, Yannis", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Information storage and retrieval", "Information Storage and Retrieval", "Natural language processing (Computer science)", "Natural Language Processing (NLP)"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "This book explains the main problems related to digital preservation using examples based on a modern version of the well-known Cinderella fairy tale. Digital preservation is the endeavor to protect digital material against loss, corruption, hardware/software technology changes, and changes in the knowledge of the community. Τhe structure of the book is modular, with each chapter consisting of two parts: the episode and the technical background. The episodes narrate the story in chronological order, exactly as in a fairy tale. In addition to the story itself, each episode is related to one or more digital preservation problems, which are discussed in the technical background section of the chapter. To reveal a more general and abstract formulation of these problems, the notion of pattern is used. Each pattern has a name, a summary of the problem, a narrative describing an attempt to solve the problem, an explanation of what could have been done to avoid or alleviate this problem, some lessons learned, and lastly, links to related patterns discussed in other chapters. The book is intended for anyone wanting to understand the problems related to digital preservation, even if they lack the technical background. It explains the technical details at an introductory level, provides references to the main approaches (or solutions) currently available for tackling related problems, and is rounded out by questions and exercises appropriate for computer engineers and scientists. In addition, the book's website, maintained by the authors, presents the contents of Cinderella's “real USB stick,” and includes links to various tools and updates."}, {"t": "Cinderella's Stick: A Fairy Tale for Digital Preservation", "au": "Tzitzikas, Yannis; Marketakis, Yannis", "y": "2018", "ty": "book", "src": "", "link": "http://link.springer.com/10.1007/978-3-319-98488-9", "tags": ["Data Formats", "Digital Curation", "Digital Libraries and Archives", "Digital Preservation", "Information Storage Systems"], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Des documents d'archives aux traces numériques: identifier et conserver ce qui engage l'entreprise : la méthode Arcateg", "au": "Chabin, Marie-Anne", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Archivage électronique", "Numérisation", "Guides pratiques", "Information électronique Conservation"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Identifier de manière fiable les documents et les données qui engagent l’entreprise et les conserver de façon pérenne et conforme représente aujourd’hui un véritable défi pour les entreprises quand papier et numérique se côtoient et même se concurrencent. La perte d’une information — que son support soit détruit ou qu’elle disparaisse dans le « vrac » informationnel — engendre nécessairement des risques et des surcoûts autant que, à l’opposé, la conservation de données inutiles ou de multiples copies. La méthode Arcateg™, expliquée et détaillée dans cet ouvrage, permet de catégoriser l’information. Elle organise les données et les documents dès leur création en fonction de leur valeur pour l’entreprise, en termes de risque de non-disponibilité ou de sur-conservation de cette information. L’ambition de ce livre est donc d’aider les entreprises à améliorer leur système d’information en structurant la production documentaire et les données en fonction de leur rôle dans la conduite des activités de l’entreprise et de leur valeur de risque dans la durée."}, {"t": "Die Öffentliche Bibliothek als Nutzer und Anbieter der Virtuellen Bibliothek: zwanzig Jahre Internet in deutschen Öffentlichen Bibliotheken: Ergebnisse einer Langzeitstudie durch Erhebungen aus den Jahren 1997, 2007 und 2017", "au": "Toetzke, Katrin; Wissen, Dirk", "y": "2018", "ty": "book", "src": "", "link": "https://www.b-i-t-online.de/daten/bit_Innovativ_72_Toetzke_Wissen_Leseprobe.pdf", "tags": ["Germany", "Libraries and the internet", "Longitudinal studies"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Im Jahre 1998, vor 20 Jahren, erschien die Studie »Die Öffentliche Bibliothek als Nutzer und Anbieter der Virtuellen Bibliothek«. Mit dieser Studie wurde die damalige Anwendung und Nutzung des Internets in deutschen Öffentlichen Bibliotheken untersucht. Im Rahmen einer empirischen Erhebung wurden im Jahr 1997 deutschlandweit insgesamt 109 Öffentliche Bibliotheken nach ihrer Anwendung und Nutzung des Internets befragt. In Abständen von jeweils zehn Jahren, also 2007 und 2017, wurden die wesentlichen Fragen der damaligen Erhebung wiederholt. Alle 109 Öffentlichen Bibliotheken erhielten zu den Themen Technik, Kosten, Gebühren, Schulungen, Altersbeschränkung und Nutzer zehn und 20 Jahre nach der ersten Erhebung erneut einen Fragebogen. Die Ergebnisse aller drei Erhebungen dieser Langzeitstudie werden nun erstmalig veröffentlicht und spiegeln die Akzeptanz, Erfahrungswerte und Leistungen Öffentlicher Bibliotheken in Deutschland gegenüber dem Internet wider."}, {"t": "Digital archives: management, use and access", "au": "Dobreva, Milena", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "BESTANDSERHALTUNG VON BIBLIOTHEKS- UND ARCHIVBESTÄNDEN (BIBLIOTHEKSWESEN)", "Digitalisierung", "ELEKTRONISCHE ARCHIVIERUNG", "Archives", "AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "Archivkunde", "Collection management", "Gestion électronique de documents", "Archives électroniques", "COMPUTERANWENDUNGEN/ARCHIVKUNDE", "COMPUTERANWENDUNGEN/SOZIAL- UND GEISTESWISSENSCHAFTEN", "Digitale Revolution", "Digitization"], "br": "2", "coll": "2.5 Ouvrages et articles; 2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Digital curation fundamentals", "au": "DeRidder, Jody L.", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["ARCHIVE (ARCHIVKUNDE)", "BESTANDSERHALTUNG VON BIBLIOTHEKS- UND ARCHIVBESTÄNDEN (BIBLIOTHEKSWESEN)", "BIBLIOTHEKSWESEN + BIBLIOTHEKSWISSENSCHAFTEN + BIBLIOTHEKEN", "Digital preservation", "Digitale Daten", "DIGITALE DOKUMENTE + ELEKTRONISCHE DOKUMENTE (BIBLIOTHEKSWESEN)", "ELEKTRONISCHE ARCHIVIERUNG", "ELEKTRONISCHE BIBLIOTHEKEN (BIBLIOTHEKSWESEN)", "Langzeitarchivierung", "Management", "Information électronique", "Conservation", "Datenmanagement", "Curation de contenu", "Bibliothèques", "Elektronische Bibliothek", "Data curation in libraries", "Produktlebenszyklus"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "\"Digital Curation Fundamentals takes a straight-forward, commonsense approach to the complex problem of digital curation and preservation, and portrays the challenges and opportunities in an approachable conversational style which lowers the bar to include those with little to no technical expertise\"-- Provided by publisher"}, {"t": "Einführung in die Archivkunde", "au": "Franz, Eckhart G.", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Archival resources"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Long description: Archive sind das wichtigste Quellenreservoir für Geschichts- und Gesellschaftswissenschaften, sie sind das Gedächtnis der Verwaltung und Geschäftsführung. Die ›Einführung in die Archivkunde‹ gibt einen Abriss der Archivgeschichte von den antiken Anfängen bis zu den unterschiedlichen Archiven der Gegenwart. Sie behandelt die Formen archivalischer Überlieferung: Urkunden, Akten, Amtsbücher, aber auch audiovisuelle Dokumente und elektronische Datenträger. In der Arbeit des Archivars setzen die Fragen des Datenschutzes und ein verstärkter Öffentlichkeitsauftrag neue Akzente. Fallbeispiele erläutern Möglichkeiten und Probleme der Archivbenutzung. Ein Anhang enthält Literaturhinweise sowie Anschriften der staatlichen Archive Deutschlands und der europäischen Nachbarländer. Die komplett überarbeitete und erweiterte 9. Auflage trägt nun auch der digitalen Entwicklung Rechnung und berücksichtigt aktuelle Verfahren sowie neue Techniken., Long description: Die ›Einführung in die Archivkunde‹ ist der bewährte Einstieg in alle Bereiche des Archivwesens. Ein historischer Überblick, Kapitel zu den Formen der Archive, zum Archivgut und zur Arbeit des Archivars sowie ein umfangreicher Anhang machen das Buch für angehende Archivare wie auch für Historiker gleichermaßen unersetzlich."}, {"t": "Encyclopedia of library and information sciences", "au": "McDonald, John D.; Levine-Clark, Michael", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Bibliothek", "Bibliothéconomie", "Information und Dokumentation", "Bibliothekswissenschaft", "Informations- und Dokumentationswissenschaft", "Sciences de l'information"], "br": "1", "coll": "1.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Exigeons de meilleures bibliothèques: plaidoyer pour une bibliothéconomie nouvelle", "au": "Lankes, R. David", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["LITTERATURE PROFESSIONNELLE", "Bibliothèques Aspect social", "Relations bibliothèque-collectivité", "BIBLIOTHEQUE", "Bibliothéconomie Philosophie", "Bibliothéconomie Prévision"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "\"Les bibliothèques existent depuis des millénaires, mais sont-elles encore d’actualité aujourd'hui? [...] Dans son ouvrage, Lankes soutient que les communautés, pour prospérer, ont besoin de bibliothèques dont les préoccupations dépassent leurs bâtiments et les livres qu’ils contiennent. Nous devons donc attendre davantage de la part de nos bibliothèques. Elles doivent être des lieux d’apprentissage qui ont à cœur les intérêts de leurs communautés sur les enjeux de la protection de la vie privée, de la propriété intellectuelle et du développement économique."}, {"t": "Going green: implementing sustainable strategies in libraries around the world : buildings, management, programmes and services", "au": "Charney, Madeleine; Sahavirta, Harri; Hauke, Petra", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Electronic books.", "Libraries Environmental aspects.", "Library buildings Energy conservation.", "Library buildings Environmental aspects."], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "This publication examines aspects of reducing the ecological footprint in libraries' workaday operations as well as the social role and responsibility of libraries as leaders in environmental sustainability. The theoretical background and practical applications of contributions made by worldwide libraries to the United Nations 2030 Sustainable Development Goals (SDGs) are discussed."}, {"t": "Klassifikationen in Bibliotheken: Theorie - Anwendung - Nutzen", "au": "Alex, Heidrun; Bee, Guido; Junger, Ulrike", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "Bibliothèques", "Sciences de l'information", "Wissenschaftliche Bibliothek", "Klassifikation", "Classification", "KLASSIFIKATIONSSYSTEME (BIBLIOTHEKSWESEN)", "Öffentliche Bibliothek"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Klassifikationen sind in Bibliotheken heute wichtiger als je zuvor. Sie eignen sich nicht nur hervorragend für die physische Anordnung von Büchern und anderen Medienwerken, sondern sind genauso erfolgreich dafür einsetzbar, große Datenmengen in Katalogen und anderen Nachweisinstrumenten zu strukturieren und sinnvoll nutzbar zu machen.\n\nDer Band gibt zunächst eine Einführung in die bibliothekarische Klassifikationstheorie und stellt dann die in Bibliotheken des deutschen Sprachraums überregional eingesetzten Universalklassifikationen vor. Er informiert außerdem über die Nutzung von Klassifikationen in Katalogen und Suchsystemen sowie die Frage der semantischen Interoperabilitätim Kontext der Wissensorganisation."}, {"t": "La médiation: un concept pour les sciences de l'information et de la communication", "au": "Deschamps, Jacqueline", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Diffusion de la culture", "Technologies de l'information et de la communication", "Sciences de l'information", "Société numérique", "INFORMATION + COMMUNICATION", "Médiation", "Médiation numérique", "SCIENCES DE L'INFORMATION + SCIENCE DOCUMENTAIRE (BIBLIOTHÉCONOMIE)", "SCIENCES HUMAINES"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "La médiation est une pratique très ancienne qui renaît aujourd'hui pour répondre aux besoins du monde contemporain. Elle est ainsi de plus en plus présente dans les sociétés actuelles.\n\nCet ouvrage présente les fondements théoriques de la médiation ainsi que la façon dont les enseignants-chercheurs en sciences de l'information et de la communication (SIC) s'approprient ce concept pour le développer et l'utiliser dans leurs problématiques. Qu'il s'agisse de médiation communicationnelle, informationnelle, culturelle, organisationnelle ou sociétale, elle appartient à un champ de recherche, pleinement investi par les SIC, qui voit en elle un processus de dépassement des conflits, de rétablissement de la communication et de construction des liens sociaux."}, {"t": "Lernwelt Öffentliche Bibliothek: Dimensionen der Verortung und Konzepte", "au": "Stang, Richard; Umlauf, Konrad", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Germany", "Public libraries"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Öffentliche Bibliotheken erhalten eine immer größere Relevanz als Lernort. Sowohl inhaltliche Angebote als auch räumliche Strukturen bieten Lernenden vielfältige Nutzungsoptionen, die für Außenstehende allerdings oft nur schwer überschaubar sind. Dieser Band versucht die beiden Perspektiven Innensicht und Außensicht zu moderieren. Auf der einen Seite geht es darum, aktuelle Entwicklungen bezogen auf Konzeptionen der inhaltlichen Ausrichtung von Öffentlichen Bibliotheken als Lernwelt aufzuzeigen, Entwicklungen von Raumstrukturen in den Blick zu nehmen sowie Anforderungen an das Personal zu identifizieren. Auf der anderen Seite geht es darum, die Entwicklungen so darzustellen, dass sie für Diskurse in anderen Bildungsbereichen anschlussfähig sind."}, {"t": "Les dons d'archives et de bibliothèques: XIXe-XXIe siècle : de l'intention à la contrepartie", "au": "Grailles, Bénédicte; Marcilloux, Patrice; Neveu, Valérie; Sarrazin, Véronique", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Mémoire collective", "Archives privées", "Bibliothèques Legs Aspect social", "Bibliothèques Legs Histoire", "Services d'archives Acquisitions Aspect social", "Services d'archives Acquisitions Histoire", "Services d'archives Legs"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Quatrième de couverture : Pourquoi s'intéresser à la question du don au regard de ces objets particuliers que sont les archives et les bibliothèques ? La théorie maussienne du don leur est-elle mécaniquement applicable ? Inversement, en quoi l'environnement qui reçoit - bibliothèques ou services d'archives -, le contenu matériel et symbolique de ce qui est échangé peuvent-ils apporter des éléments nouveaux aux théories du don ? Quelles sont les stratégies d'affirmation de soi et de transmission à l'oeuvre et observables ? Quelles sont les intentions et a contrario les attentes ? L'analyse de la transaction peut-elle amener à réévaluer les pratiques des archivistes et des bibliothécaires ? Telles sont les questions auxquelles s'efforce de répondre cet ouvrage qui, ni manuel ni encyclopédie du don patrimonial, a l'ambition de replacer le geste du don de documents dans le contexte plus général du don comme créateur de lien social, à l'envisager dans sa dynamique de circulation dans la société et à s'interroger sur la nature symbolique de la relation qui se noue entre donateurs et donataires. Dépouillé de ses habits juridiques, le don d'archives ou de bibliothèques se révèle partiellement singulier. Le donateur s'y défait d'un bien en faveur d'un bénéficiaire collectif et anonyme, un bénéficiaire plus potentiel que réalisé ; l'établissement bénéficiaire - donataire apparent - est réellement le médiateur du don, lieu de conservation et de transmission de l'objet donné vers son destinataire réel, le public."}, {"t": "Maîtrisez internet... avant qu'internet ne vous maîtrise", "au": "Bondu, Jérôme", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Internet", "Effets des innovations technologiques", "Intelligence économique", "Web"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Face à la révolution numérique et à ses conséquences sociales, l'auteur, expert en intelligence économique, apporte des informations et des conseils à destination du manager comme du citoyen pour devenir un acteur conscient du web, savoir exploiter son potentiel et se prémunir des risques qu'il représente. (Electre)"}, {"t": "Organization, representation and description through the digital age: information in libraries, archives and museums", "au": "Angel, Christine M.; Fuchs, Caroline", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Bibliothek", "BIBLIOTHEKSWESEN + BIBLIOTHEKSWISSENSCHAFTEN + BIBLIOTHEKEN", "Digitalisierung", "MUSEEN", "Museum", "Archives", "AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "Informationsmanagement", "Bibliothèques", "Information", "ARCHIVKUNDE", "Numérisation", "Musées", "Digitale Revolution", "KATALOGISIERUNG + KATALOGISIERUNGSTECHNIK (BIBLIOTHEKSWESEN)", "KATALOGISIERUNGSREGELN (BIBLIOTHEKSWESEN)", "SEMANTISCHE NETZWERKE (INFORMATIONSSYSTEME)", "Wissensorganisation", "Wissensrepräsentation"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Cataloging standards practiced within the traditional library, archive and museum environments are not interoperable for the retrieval of objects within the shared online environment. Within today's information environments, library, archive and museum professionals are becoming aware that all information objects can be linked together. In this way, information professionals have the opportunity to collaborate and share data together with the shard online cataloging environment, the end result being improved retrieval effectiveness. But the adaptation has been slow: Libraries, archives and museums are still operating within their own community-specific cataloging practices. This book provides a historical perspective of the evolution of linking devices within the library, archive, and museums environments, and captures current cataloging practices in these fields. It offers suggestions for moving beyond community-specific cataloging principles and thus has the potential of becoming a springboard for further conversation and the sharing of ideas."}, {"t": "Outils Froids : intelligence économique, veille stratégique, social medias monitoring, mindmapping,...", "au": "", "y": "2018", "ty": "webpage", "src": "", "link": "https://www.outilsfroids.net/", "tags": [""], "br": "1", "coll": "1.6 Sites web", "abs": "Blog - Un jour sans veille est un jour sans lendemain"}, {"t": "Personnaliser la bibliothèque: construire une stratégie de marque et augmenter sa réputation", "au": "Accart, Jean-Philippe", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Réseaux sociaux", "Bibliothèques", "LITTERATURE PROFESSIONNELLE", "BIBLIOTHEQUE", "Bibliothèques Marketing", "Bibliothèques Publics", "Learning centres", "Marketing de la culture", "PUBLIC", "PUBLICITE", "Storytelling"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "La bibliothèque doit être comprise, vue et entendue comme un acteur majeur par la population qui la fréquente ou pas, par ses financeurs et les décideurs. C'est le défi que relève ce livre collectif, qui reconsidère la bibliothèque dans ce qu'elle veut transmettre comme valeurs et dans ce qu'elle représente. Bibliothécaires, directeur de musée, graphiste, spécialistes de l'identité visuelle et numérique, sociologues apportent des points de vue riches et constructifs sur ces questions pour les institutions souhaitant comprendre, développer et réussir leur stratégie de marque."}, {"t": "Petit précis d'archivistique (Dossier thématique)", "au": "Coutaz, Gilbert", "y": "2018", "ty": "document", "src": "", "link": "https://www.vd.ch/fileadmin/user_upload/organisation/chancellerie/ACV/fichiers_pdf/dossier-thematique/Dossier-thematique-2018.pdf", "tags": [""], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Records and information management", "au": "Franks, Patricia C.", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Informationsmanagement", "Datenmanagement", "Registratur"], "br": "2", "coll": "2.5 Ouvrages et articles; 1d Records Management", "abs": ""}, {"t": "Records, Information and Data: Exploring the Role of Record Keeping in an Information Culture", "au": "Yeo, Geoffrey", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Information storage and retrieval systems", "Records", "Electronic records", "Information organization", "General", "LANGUAGE ARTS & DISCIPLINES", "Library & Information Science", "Records-Management"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "This dynamic book considers whether and how the management of records (and archives) differs from the management of information (and data).\nCan archives and records management still make a distinctive contribution in the 21st century, or are they now being dissolved into a wider world of information governance? What should be our conceptual understanding of records in the digital era? What are the practical implications of the information revolution for the work of archivists and records managers?\nGeoffrey Yeo, a distinguished expert in the global field, explores concepts of ‘records’ and ‘archives’ and sets today’s record-keeping and archival practices in their historical context. He examines changing perceptions of records management and archival work, and asks whether and how far understandings derived from the fields of information management and data administration can enhance our knowledge of how records function. He argues that concepts of information and data cannot provide a fully adequate basis for reflective professional thinking about records and that record-keeping practices still have distinct and important roles to play in contemporary society."}, {"t": "Records, information and data: exploring the role of record-keeping in an information culture", "au": "Yeo, Geoffrey", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Digitalisierung", "Management", "Administration", "Archives", "Information storage and retrieval systems", "Informationsmanagement", "Records", "Electronic records", "Archivierung", "Information organization", "Registratur"], "br": "2", "coll": "2.5 Ouvrages et articles; 1d Records Management", "abs": "\"This dynamic book considers whether and how the management of records (and archives) differs from the management of information (and data). Can archives and records management still make a distinctive contribution in the 21st century, or are they now being dissolved into a wider world of information governance? What should be our conceptual understanding of records in the digital era? What are the practical implications of the information revolution for the work of archivists and records managers?\"--[Résumé de l'éditeur]"}, {"t": "Search engine society", "au": "Halavais, Alexander", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Information technology", "Social aspects", "Société numérique", "INFORMATIK UND GESELLSCHAFT", "Information society", "Informationsgesellschaft", "INFORMATIONSGESELLSCHAFT (SOZIOLOGIE)", "Informationstechnik", "INTERNET + WORLD WIDE WEB (COMPUTERSYSTEME)", "Internet searching", "Kultursoziologie", "Médias numériques", "Moteurs de recherche sur Internet", "SOZIALE NETZWERKE + WEBDIENSTE + SOZIALE SOFTWARE (SOZIOLOGIE)", "SOZIOLOGIE DER TECHNIK", "Suchmaschine", "Technologie de l'information", "Web search engines"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "From the Publisher: Search engines have become a key part of our everyday lives. Yet while much has been written about how to use search engines and how they can be improved, there has been comparatively little exploration of what their social and cultural effects might be. Like all technologies, search engines exist within a larger political, cultural, and economic environment. This volume aims to redress this balance and to address crucial questions such as: How have search engines changed the way we organize our thoughts about the world, and how we work? To what extent does political control of search engines, or the political influence of search engines, affect how they are used, misused, and regulated? Does the search engine help share our identities and interactions with others, and what implications does this have for privacy? Informed members of the information society must understand the social contexts in which search engines have been developed, what that development says about us as a society, and the role of the search engine in the global information environment. This book provides the perfect starting point. [Ed.]"}, {"t": "Shadow Libraries", "au": "Karaganis, Joe", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Libraries", "United States", "bic Book Industry Communication", "G Reference", "information & interdisciplinary subjects", "information", "knowledge", "India", "access", "Argentina", "Brazil", "education", "educational resources", "GP Research & information: general", "GPJ Coding theory & cryptology", "J Society & social sciences", "JN Education", "JNM Higher & further education", "JNMN Universities", "open access", "piracy", "Poland", "publishing", "Sci-Hub", "South Africa", "students", "tertiary education", "university", "Uruguay"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "From the top down, Shadow Libraries explores the institutions that shape the provision of educational materials, from the formal sector of universities and publishers to the broadly informal ones organized by faculty, copy shops, student unions, and students themselves."}, {"t": "Sustainable thinking: ensuring your library's future in an uncertain world", "au": "Aldrich, Rebekkah Smith", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Bibliothèques Aspect environnemental", "Bibliothèques Aspect social", "Relations bibliothèque-collectivité"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "In this inspiring and pragmatic new book, Aldrich shows that the first step towards a sustainable library is sustainable thinking: a determined yet realistic attitude that will help your library spot opportunities for institutional advancement, advocate for and safeguard operating funds, and generate intense loyalty from the communities you serve."}, {"t": "Terminologie de base en sciences de l'information", "au": "Université de Montréal, EBSI", "y": "2018", "ty": "webpage", "src": "", "link": "https://clip.ebsi.umontreal.ca/terminologie/", "tags": [""], "br": "1", "coll": "1.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "The archived web: doing history in the digital age", "au": "Brügger, Niels", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Web archives", "World Wide Web", "History", "Social aspects"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"How will the history of the present be written? As life continues to move online, the web becomes ever more important for an understanding of the past. This book offers an original theoretical framework for approaching the web of the past, both as a source and as an object of study in its own right\"-- Provided by publisher."}, {"t": "The Theory and Craft of Digital Preservation", "au": "Owens, Trevor", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Digital preservation", "Management", "Digital libraries"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "\"Among the public, there is a persistent belief that if something is on the Internet, it will be around forever. At the same time, warnings of an impending \"digital dark age,\" where records of the recent past become completely lost or inaccessible, appear in the popular press. In The Theory and Craft of Digital Preservation, Trevor Owens offers a path to go beyond the hyperbole and the anxiety of the digital and establish a baseline for practice in this field. The first section of the book synthesizes work on the history of preservation in a range of areas (archives, manuscripts, recorded sound, etc.) and sets that history in dialogue with work in new media studies, platform studies, and media archeology. The later chapters build from this theoretical framework as a basis for an iterative process for the practice of doing digital preservation. While the book has a practical bent, it is not a how-to book that would quickly become outdated. It establishes and offers stages and processes for doing digital preservation, but it is not tied to particular tools, methods, or techniques. Instead, it is anchored in an understanding of the traditions of preservation and the nature of digital objects and media\"-- Provided by publisher."}, {"t": "The Theory and Craft of Digital Preservation", "au": "Owens, Trevor", "y": "2018", "ty": "book", "src": "", "link": "https://www.press.jhu.edu/books/title/11947/theory-and-craft-digital-preservation", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": ""}, {"t": "Utopies contemporaines en information-documentation", "au": "Cordier, Anne; Liquète, Vincent", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Information storage and retrieval systems", "Berufsbild", "Information technology", "Technologies de l'information et de la communication", "Documentation", "Information und Dokumentation", "Social aspects", "Information society", "Berufsethik", "Computers and society", "Dokumentar", "Information scientifique", "Innovations technologiques", "Utopie", "Utopies", "Utopies techniques"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "Utopies contemporaines en information-documentation analyse, à travers les discours d'intellectuels, la manière dont les conceptions mais aussi les gestes documentaires sont nourris d'utopies qui contribuent à inscrire de façon à la fois pragmatique et politique les objets info-documentaires. Travailler sur les utopies, et sur les textes à visée utopique et projective, revient à énoncer une critique de notre temps et de l'époque privilégiée ; critique absolument nécessaire pour saisir les logiques sociales et professionnelles à l'oeuvre, et anticiper l'avenir du secteur de la documentation."}, {"t": "Zwölf Wege ins Archiv: Umrisse einer offenen und praktischen Archivwissenschaft", "au": "Keitel, Christian", "y": "2018", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "BESTANDSERHALTUNG VON BIBLIOTHEKS- UND ARCHIVBESTÄNDEN (BIBLIOTHEKSWESEN)", "Benutzung", "Archivage électronique", "Archivistique", "Archivkunde", "AKZESSION + ERWERBUNG (BIBLIOTHEKSWESEN)", "ERSCHLIESSUNG UND KLASSIFIKATION VON DOKUMENTEN (BIBLIOTHEKSWESEN)", "Bibliothèques", "Documentation", "ARCHIVKUNDE", "Indexation (documentation)"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Accueillir des publics migrants et immigrés: Interculturalité en bibliothèque", "au": "Daudin, Lucie", "y": "2019", "ty": "book", "src": "", "link": "", "tags": [""], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "Immigrés de plus ou moins longue date, migrants ou encore étudiants étrangers : les publics des bibliothèques d'aujourd'hui sont, à l'image de notre société, multiculturels. Dispositifs et médiations spécifiques, posture professionnelle, partenariats, formation, littératures de l'exil... Quel accompagnement proposer en matière linguistique à ces publics et, plus globalement, comment appuyer un parcours d'intégration ? Comment donner à voir et à vivre la diversité culturelle de notre société ? Cet ouvrage collectif décrypte le contexte migratoire, propose des pistes de réflexion-action et donne des éléments de réponse pratiques pour tous les professionnels du champ social et culturel."}, {"t": "Archival futures", "au": "Brown, Caroline", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Archival materials", "Archives"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "This book draws on the contributions of a range of international experts to consider the current archival landscape and imagine the archive of the future. Firmly rooted in current professional debate and scholarship, Archival Futures offers thought provoking and accessible chapters that aim to challenge and inspire archivists globally and to encourage debate about their futures.    It is widely acknowledged that the archive profession/discipline is facing a time of change. The digital world has presented changes in how records are created, used, stored and communicated. At the same time, there is increased public debate over issues such as ownership of and access to information and its authenticity and reliability in a networked and interconnected world. On a practical level archivists are being asked to do more, to have a greater range of skills, often with increasingly restricted resources while competing with others to maintain their role as experts in ever changing environments.    Exploring the potential impact of these changes is timely. Such reflections will provide the opportunity to consider the archivists' purpose and role, discuss the practical impact of change on skills and functions and to articulate what can be contributed to a mid 21 century world.    The contributors, Kate Theimer, Luciana Duranti, Victoria Lemieux, Geoffrey Yeo, Jenny Bunn, Sonia Ranade, Barbara Reed, Gillian Oliver, Frank Upward, Joanne Evans, Michael Moss, David Thomas and Craig Gauld cover:  - the role of archives in relation to individuals, organisations, communities and society  - how appraisal, arrangement, description and access might be affected in the future  - the impact of changing societal expectations in terms of access to information, how information is exchanged, and how things are recorded and remembered  - the place of traditional archives and what â€˜the archive' is or might become  - competition or opportunity offered by other information, cultural or IT related professions and the future role of the archive profession  - truth and post-truth: archives as authentic and reliable evidence  This book will appeal to an international audience of students, academics and practitioners in archival science, records management, and library and information science."}, {"t": "Archive(s), mémoire, art: éléments pour une archivistique critique", "au": "Klein, Anne", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Archivistique", "Philosophy", "Mémoire collective", "Philosophie", "Historiography", "Historiographie", "Processing", "Archives et art", "Collective memory", "Temps (Philosophie)", "Time", "Utilisation"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "« L'utilisation des archives hors de leur lieu traditionnel qu'est la salle de lecture et hors de l'action des archivistes impose un renouvellement de la pensée archivistique traditionnellement centrée sur le moment de production des documents. Considérer les archives comme objet historique depuis leur exploitation artistique en prenant appui sur le matérialisme historique de Walter Benjamin conduit à revisiter l'archivistique. Ce réexamen passe d'abord par une historicisation des archives et de l'archivistique, ensuite par une réflexion autour de la notion d'archive à partir de la relation des archives avec la mémoire et la connaissance du passé et, enfin, par l'analyse de démarches artistiques mettant les archives en œuvre qui éclaire d'un jour nouveau les conditions d'existence des archives (matérialité, authenticité, lacune). Cet ouvrage propose tout à la fois une histoire de l'archivistique, une réflexion épistémologique autour de la notion d'archive et des outils méthodologiques pour l'étude des archives comme objet social. »-- Quatrième de couverture."}, {"t": "Au coeur de l'archive coloniale: questions de méthode", "au": "Stoler, Ann Laura", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archives", "19e siècle (milieu)-20e siècle (1re moitié)", "Autochtones", "Colonies", "Colons", "Geschichte", "Gouvernance", "Indonésie", "Kolonialismus", "Niederländisch-Indien", "Pays-Bas", "Sentiments"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Das Web als politische Herausforderung: historische Perspektiven = Enjeux politiques du web : approches historiques", "au": "Geschichte und Informatik", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Informatik", "Internet", "Politik", "World Wide Web", "Medien", "Geschichtswissenschaft", "Démocratie", "20e siècle (fin)-21e siècle (début)", "COLLECTIONS OF ESSAYS (TYPE OF DOCUMENT)", "Communication en politique", "COMPUTER SCIENCE AND SOCIETY", "Espace public (science politique)", "Geschichtsunterricht", "HISTORY OF COMPUTERS + HISTORY OF COMPUTER SCIENCE", "POLITICS AND SCIENCE (POLITICS)", "Réseaux sociaux (Internet)", "Technologie"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Digital Humanities: Eine Einführung", "au": "Jannidis, Fotis; Kohle, Hubertus; Rehbein, Malte", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Bibliothek", "Digitalisierung", "Internet", "Geschichte", "Netzwerk", "Digital Humanities", "Wissenschaft", "Datenmodell", "XML", "Bild", "Computer", "Datenbank", "Datenerhebung", "Datensammlung", "Multimediaprodukt", "Programmierung", "Technik", "Text"], "br": "2", "coll": "2.5 Ouvrages et articles; 3.5.2 Développements, problématiques contemporaines", "abs": ""}, {"t": "Do archives have value?", "au": "Moss, Michael; Thomas, David", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Evaluation", "Great Britain"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "This book will explore ways of establishing and measuring value in the archives and special collections.    There is a vast literature about ways of measuring value for cultural heritage assets as a whole, particularly museums and visitor attractions, but archives and special collections in libraries have largely been overlooked.  They have been very poor at garnering statistical data and devising ways of measuring the impact of what they do, unlike museums and visitor attractions with their much heavier footfall.    Do Archives Have Value? discusses the various valuation methods available, including contingent valuation, willingness to pay and value chain, and assesses their suitability for use by archives and special collections. The book also assesses the impact of the transition to the digital in archival holdings, which will transform their character and will almost certainly cost more. The discussion will be set in the context of changing societal expectations of the archive in the wake of child abuse and other scandals where records to address grievances must be kept irrespective of cost.    Value is explored in a range of different cultural and organizational contexts with case studies from a range of countries, including Australia, China, Japan, Malawi, Kenya, Russia and Thailand. There are contributions from Nancy Bell, Head of Conservation at The National Archives, Louise Craven, one of the leading UK archival scholars, Paul Lihoma, National Archivist of Malawi, Helen Morgan from the University of Melbourne, Pak Te Lee of the University of Hong Kong and Richard Wato from the National Archives of Kenya."}, {"t": "Encyclopedia of archival writers, 1515 - 2015", "au": "Duranti, Luciana; Franks, Patricia C.", "y": "2019", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Foundations of information ethics", "au": "Knox, Emily; Burgess, John T. F.", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Information technology", "Informationsethik", "Moral and ethical aspects"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "As discussions about the roles played by information in economic, political, and social arenas continue to evolve, the need for an intellectual primer on information ethics that also functions as a solid working casebook for LIS students and professionals has never been more urgent. This text, written by a stellar group of ethics scholars and contributors from around the globe, expertly fills that need."}, {"t": "Introduction to Data Mining", "au": "Tan, Pang-Ning; Steinbach, Michael; Karpatne, Anuj; Kumar, Vipin", "y": "2019", "ty": "book", "src": "", "link": "", "tags": [""], "br": "", "coll": "2c Information Retrieval", "abs": "For courses in data mining and database systems.  Introducing the fundamental concepts and algorithms of data mining Introduction to Data Mining, 2nd Edition, gives a comprehensive overview of the background and general themes of data mining and is designed to be useful to students, instructors, researchers, and professionals. Presented in a clear and accessible way, the book outlines fundamental concepts and algorithms for each topic, thus providing the reader with the necessary background for the application of data mining to real problems. The text helps students understand the nuances of the subject, and includes important sections on classification, association analysis, and cluster analysis. This edition improves on the first iteration of the book, published over a decade ago, by addressing the significant changes in the industry as a result of advanced technology and data growth."}, {"t": "Introduction to the semantic web and semantic web services", "au": "Yu, Liyang", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["JAX", "Semantic Web", "Web Services"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "Even though the semantic Web is a relatively new and dynamic area of research, a whole suite of components, standards, and tools have already been developed around it. Using a concrete approach, Introduction to the Semantic Web and Semantic Web Services builds a firm foundation in the concept of the semantic Web, its principal technologies, its real-world applications, and its relevant coding examples.\n\nThis introductory yet comprehensive book covers every facet of this exciting technology. After an introduction to the semantic Web concept, it discusses its major technical enablers and the relationships among these components. The author then presents several applications of the semantic Web, including Swoogle, FOAF, and a detailed design of a semantic Web search engine. The book concludes with discussions on how to add semantics to traditional Web service descriptions and how to develop a search engine for semantic Web services."}, {"t": "Kulturelle Teilhabe: ein Handbuch = Participation culturelle : un manuel = Partecipazione culturale : un manuale", "au": "Dialogue culturel national‏ Berne (Suisse; Nationaler Kulturdialog", "y": "2019", "ty": "book", "src": "", "link": "https://www.newsd.admin.ch/newsd/message/attachments/57315.pdf", "tags": ["Kultur", "Diffusion de la culture", "Suisse", "Beteiligung", "Culture", "Förderverein", "Inklusion Soziologie", "Intégration sociale", "Kulturpädagogik", "Kulturpolitik", "Kulturvermittlung", "Participation des citoyens", "Participation sociale", "Partizipation", "Politique culturelle"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "4e de couverture: La participation culturelle est sur toutes les lèvres. Tout comme la participation politique, économique et sociale, elle a pour but d'associer, de faire participer et de responsabiliser la population à la vie publique. La participation culturelle contribue à l'inclusion, à la cohésion sociale et à la diversité culturelle. Le manuel donne un aperçu de l'histoire et de la définition de la participation culturelle, explore ses champs d'activité et propose des pistes d'action concrètes. Il s'adresse aux responsables de projets dans le domaine culturel et dans d'autres secteurs où la participation entre en jeu, ainsi qu'aux institutions privées et publiques qui s'engagent en faveur de la participation à la vie sociale."}, {"t": "Le métier de bibliothécaire", "au": "Henard, Charlotte; Association des bibliothécaires français", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Guides pratiques", "Bibliothécaires Formation France", "Bibliothéconomie France"], "br": "3", "coll": "3.5.1 Documentation de base", "abs": "Après un bref historique et le rappel des différentes fonctions des bibliothèques selon leur environnement administratif, social et culturel, expose l'évolution des aspects du métier de bibliothécaire : accueil et information du public, recherche documentaire, acquisition, conservation... Une large place est faite aux missions et aux cadres dans lesquels s'exerce aujourd'hui la mission. [Electre]"}, {"t": "Le métier de bibliothécaire", "au": "Henard, Charlotte; Association des bibliothécaires français", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Guides pratiques", "Bibliothécaires Formation France", "Bibliothéconomie France"], "br": "", "coll": "", "abs": "Après un bref historique et le rappel des différentes fonctions des bibliothèques selon leur environnement administratif, social et culturel, expose l'évolution des aspects du métier de bibliothécaire : accueil et information du public, recherche documentaire, acquisition, conservation... Une large place est faite aux missions et aux cadres dans lesquels s'exerce aujourd'hui la mission. [Electre]"}, {"t": "Les archives", "au": "Coeuré, Sophie; Duclert, Vincent", "y": "2019", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Au cœur de la mémoire nationale et des trajectoires individuelles, les archives en France ne sont pas seulement un symbole. Le terme désigne en effet les millions de documents produits ou reçus par les administrations, les entreprises, les associations, les individus, mais aussi les services publics et privés qui les collectent, les conservent et les communiquent, ainsi que les dépôts et les salles de lecture.\nLes archives sont à la source de l’histoire et sont mobilisées par les sciences sociales, autant qu’elles restituent les activités des administrations, des associations, des entreprises… L’exigence actuelle de transparence publique, la recrudescence des conflits mémoriels placent aujourd’hui archivistes, généalogistes, historiens et citoyens devant des enjeux considérables, proprement politiques et de portée internationale.\nCet ouvrage se propose de guider le lecteur à travers cet univers mal connu en présentant les transformations de la législation, les mutations institutionnelles des services de conservation et de communication, les défis nouveaux des usages des archives et de l’entrée dans l’ère du document numérique."}, {"t": "Libraries promoting reflective dialogue in a time of  political polarization", "au": "Baer, Andrea; Cahoy, Ellysa Stern; Schroeder, Robert", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Libraries", "United States"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "As political polarization has continued to grow within and beyond the United States in past decades, the challenges of engaging in open and constructive dialogue have become increasingly apparent. The effects of this tension are evident in numerous aspects of library work, including interactions and relationships in our local contexts and in our larger professional community, as well as all areas of the library—classrooms, collections, technology, management, programming, LIS programs, and library spaces."}, {"t": "Masked by trust: bias in library discovery", "au": "Reidsma, Matthew", "y": "2019", "ty": "book", "src": "", "link": "https://scholarworks.gvsu.edu/cgi/viewcontent.cgi?article=1029&context=library_books", "tags": ["Information storage and retrieval systems", "Internet", "Social aspects", "Information retrieval", "library", "Automatisation des bibliothèques", "Electronic information resource searching", "exchange of information", "Filter bubbles (Information filtering)", "Logiciels", "Moteur de recherche", "Online library catalogs", "Programming", "Réseaux informatiques", "search engine", "Search engines", "Transfert d'information"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "The rise of Google and its integration into nearly every aspect of our lives has pushed libraries to adopt similar \"Google-like\" search tools, called discovery systems. Because these tools are provided by libraries and search scholarly materials rather than the open web, we often assume they are more \"accurate\" or \"reliable\" than their general-purpose peers like Google or Bing. But discovery systems are still software written by people with prejudices and biases, library software vendors are subject to strong commercial pressures that are often hidden behind diffuse collection-development contracts and layers of administration, and they struggle to integrate content from thousands of different vendors and their collective disregard for consistent metadata.Library discovery systems struggle with accuracy, relevance, and human biases, and these shortcomings have the potential to shape the academic research and worldviews of the students and faculty who rely on them. While human bias, commercial interests, and problematic metadata have long affected researchers' access to information, algorithms in library discovery systems increase the scale of the negative effects on users, while libraries continue to promote their \"objective\" and \"neutral\" search tools."}, {"t": "Participatory archives: theory and practice", "au": "Benoit, Edward; Eveleigh, Alexandra; Everleigh, Ill", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Archives", "Technological innovations", "Archival resources", "Social aspects", "Digitization", "Mass media and culture"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "The rise of digitisation and social media over the past decade has fostered the rise of participatory and DIY digital culture. Likewise, the archival community leveraged these new technologies, aiming to engage users and expand access to collections. This book examines the creation and development of participatory archives, its impact on archival theory, and present case studies of its real world application. Participatory Archives: Theory and practice is divided into four sections with each focused on a particular aspect of participatory archives: social tagging and commenting; transcription; crowdfunding; and outreach & activist communities. Each section includes chapters summarizing the existing literature, a discussion of theoretical challenges and benefits, and a series of case studies. The case studies are written by a range of international practitioners and provide a wide range of examples in practice, whilst the remaining chapters are supplied by leading scholars from Australia, Canada, Denmark, the Netherlands, Norway, the United Kingdom, and the United States. This book will be useful for students on archival studies programs, scholarly researchers in archival studies who could use the book to frame their own research projects, and practitioners who might be most interested in the case studies to see how participatory archives function in practice. The book may also be of interest to other library and information science students, and similar audiences within the broader cultural heritage institution fields of museums, libraries, and galleries."}, {"t": "Practical knowledge and information management", "au": "Schopflin, Katharine", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Information retrieval", "Knowledge management"], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "This book provides a practical guide to implementing knowledge and information initiatives in the workplace. Drawing on case studies from practitioners in a range of different work environments, it will outline best practice, pitfalls and advice on a range of topics, including making the business case, audits, establishing communities of practice, building knowledge bases and knowledge capture."}, {"t": "Practical recommender systems", "au": "Falk, Kim", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Recommender systems (Information filtering)"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "Practical Recommender Systems explains how recommender systems work and shows how to create and apply them for your site. After covering the basics, you'll see how to collect user data and produce personalized recommendations. You'll learn how to use the most popular recommendation algorithms and see examples of them in action on sites like Amazon and Netflix. Finally, the book covers scaling problems and other issues you'll encounter as your site grows."}, {"t": "Praktische Archivkunde: Ein Leitfaden für Fachangestellte für Medien- und Informationsdienste - Fachrichtung Archiv", "au": "Höötmann, Hans-Jürgen", "y": "2019", "ty": "book", "src": "", "link": "", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Qualifier et mesurer les effets des bibliothèques publiques sur leur territoire", "au": "Butel, Élise; Le Quéau, Pierre; Zerbib, Olivier", "y": "2019", "ty": "article-journal", "src": "L'Observatoire", "link": "https://doi.org/10.3917/lobs.054.0109", "tags": ["Humanities and Social Sciences", "Library and information sciences", "Sociology"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": ""}, {"t": "Schauplatz Archiv: Objekt - Narrativ - Performanz", "au": "Kastberger, Klaus; Maurer, Stefan; Neuhuber, Christian", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Erschließung"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "The digital archives handbook: a guide to creation, management, and preservation", "au": "Purcell, Aaron D.", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "BESTANDSERHALTUNG VON BIBLIOTHEKS- UND ARCHIVBESTÄNDEN (BIBLIOTHEKSWESEN)", "Digital preservation", "Digitale Daten", "DIGITALE DOKUMENTE + ELEKTRONISCHE DOKUMENTE (BIBLIOTHEKSWESEN)", "Digitalisierung", "ELEKTRONISCHE ARCHIVIERUNG", "Langzeitarchivierung", "Management", "Archives", "AUFSATZSAMMLUNGEN (DOKUMENTENTYP)", "Information électronique", "Access control", "AKZESSION + ERWERBUNG (BIBLIOTHEKSWESEN)", "Archivsystem", "Collection management", "Conservation", "Datenmanagement", "Electronic records", "ELEKTRONISCHE INFORMATIONSVERSORGUNG (BIBLIOTHEKSWESEN)", "ERSCHLIESSUNG UND KLASSIFIKATION VON DOKUMENTEN (BIBLIOTHEKSWESEN)", "Gestion électronique de documents", "RATGEBER (DOKUMENTENTYP)"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Toward Environmentally Sustainable Digital Preservation", "au": "Pendergrass, Keith L.; Sampson, Walker; Walsh, Tim; Alagna, Laura", "y": "2019", "ty": "article-journal", "src": "The American Archivist", "link": "https://doi.org/10.17723/0360-9081-82.1.165", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "Digital preservation relies on technological infrastructure (information and communication technology, ICT) that has considerable negative environmental impacts, which in turn threaten the very organizations tasked with preserving digital content. While altering technology use can reduce the impact of digital preservation practices, this alone is not a strategy for sustainable practice. Moving toward environmentally sustainable digital preservation requires critically examining the motivations and assumptions that shape current practice. Building on Goldman's challenge to current practices for digital authenticity and using Ehrenfeld's sustainability framework, we propose explicitly integrating environmental sustainability into digital preservation practice by shifting cultural heritage professionals' paradigm of appraisal, permanence, and availability of digital content. The article is organized in four parts. First, we review the literature for differing uses of the term “sustainability” in the cultural heritage field: financial, staffing, and environmental. Second, we examine the negative environmental effects of ICT throughout the full life cycle of its components to fill a gap in the cultural heritage literature, which primarily focuses on the electricity use of ICT. Next, we offer suggestions for reducing digital preservation's negative environmental impacts through altered technology use as a stopgap measure. Finally, we call for a paradigm shift in digital preservation practice in the areas of appraisal, permanence, and availability. For each area, we propose a model for sustainable practice, providing a framework for sustainable choices moving forward."}, {"t": "Typologie des documents des organisations: de la création à la conservation", "au": "Gagnon-Arguin, Louise; Mas, Sabine; Maurel, Dominique", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Systèmes d'information de gestion", "Gestion des documents", "Documents administratifs"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Working as a data librarian: a practical guide", "au": "Johnson, Eric O.", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Wissenschaftliche Bibliothek", "Data services librarians", "Database management in libraries", "Daten"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": ""}, {"t": "Zukunft der Informationswissenschaften: hat die Informationswissenschaft eine Zukunft? : Grundlagen und Perspektiven", "au": "Bredemeier, Willi", "y": "2019", "ty": "book", "src": "", "link": "", "tags": ["Informations- und Dokumentationswissenschaft", "INFORMATIONSWISSENSCHAFTEN + DOKUMENTATIONSWISSENSCHAFTEN (BIBLIOTHEKSWESEN)", "Informationsgesellschaft", "Informationseinrichtung", "Zukunft"], "br": "1", "coll": "1.5.2 Développements, problématiques contemporaines", "abs": "Befindet sich die Informationswissenschaft in der Krise? Die Krise der Informationswissenschaft ist durch institutionelle Schließungen, mangelhaften Zusammenhalt und geringe Sichtbarkeit in Politik und Öffentlichkeit gekennzeichnet. Führende Informationswissenschaftler diskutieren, ob die Informationswissenschaft ein neues Paradigma braucht. Sie stellen sich der Frage, wie sie ihre Lehre an neue Herausforderungen in der Praxis, beispielsweise die neue Flut an Fehl- und Falschinformationen, anpassen und die Studierenden im Verbund beispielsweise mit wissenschaftlichen Bibliotheken noch besser an anspruchsvolle Recherchen und Quellenkritik heranführen sollten."}, {"t": "Abrégé d'archivistique: principes et pratiques du métier d'archiviste", "au": "Association des archivistes français", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Archivistes", "Archivistique", "Archivkunde", "France", "Frankreich"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Abrégé d'archivistique: principes et pratiques du métier d'archiviste", "au": "Association des archivistes français", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Archivistique", "ARCHIVES", "LITTERATURE PROFESSIONNELLE", "Archivistes France", "Guides pratiques", "Manuels d'enseignement"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Ce manuel de réfé­rence est le résul­tat de la col­la­bo­ra­tion de nom­breux pro­fes­sion­nels des archi­ves repré­sen­ta­tifs des prin­ci­paux sec­teurs du métier. L’ensem­ble des notions archi­vis­ti­ques y est abordé de façon concrète, en s’appuyant sur des exem­ples issus de la pra­ti­que."}, {"t": "Abrégé d'archivistique: principes et pratiques du métier d'archiviste", "au": "Association des archivistes français", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Archivistes", "Archivistique", "Archivkunde", "France", "Frankreich"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Analyzing the Born-Digital Archive | The Signal", "au": "O'Neill, Kathleen", "y": "2020", "ty": "post-weblog", "src": "", "link": "https://blogs.loc.gov/thesignal/2020/10/analyzing-the-born-digital-archive", "tags": [""], "br": "", "coll": "2d Digitalisierung und digitale Archivierung", "abs": "Kathleen O'Neill is a 2020 Staff Innovator with LC Labs and a Senior Archivist in the Manuscript Division at the Library of Congress. In this post, she discusses her analysis of the various file formats in the Manuscript Division's born-digital holdings."}, {"t": "Archives, recordkeeping, and social justice", "au": "Duff, Wendy M.; Saucier, Renée; Flinn, Andrew; Wallace, David A.", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Archiv", "Archives", "Archivar", "Ethik", "Justice sociale", "Politik", "Soziale Gerechtigkeit"], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": ""}, {"t": "Bold Minds: Library leadership in a time of disruption", "au": "Weaver, Margaret; Appleton, Leo", "y": "2020", "ty": "book", "src": "", "link": "", "tags": ["Librarians", "Libraries", "Library administration"], "br": "3", "coll": "3.5.2 Développements, problématiques contemporaines", "abs": "'Bringing together a wonderfully diverse set of international library leaders, Bold Minds: Library Leadership in a Time of Disruption challenges common fears about the future of the library and contemplates how best to bring librarianship into a new era.' -Law Library Journal."}, {"t": "CAMPI: Computer-Aided Metadata Generation for Photo archives Initiative", "au": "Lincoln, Matthew; Corrin, Julia; Davis, Emily; Weingart, Scott B.", "y": "2020", "ty": "article", "src": "", "link": "https://doi.org/10.1184/R1/12791807.v2", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "In the summer of 2020, CAMPI (the Computer-Aided Metadata Generation for Photoarchvies Initiative) assessed the use of computer vision in assisting in the arduous task of processing digital photograph collections. The prototype built to find duplicates and tag photos depicting similar scenes in Carnegie Mellon University Archives’ General Photography Collection was successful, proving such an interface would be both feasible and useful for cultural heritage institutions with large visual collections.This whitepaper reports on the background for this project, the specific tasks, methods, and results from our software prototype, and a summary of future directions and needs for both computer vision as well as interfaces for photo archive description. We also offer a high-level technical roadmap as well as specific implem
