 professionnels de l’information et de la documentation (ADBS), première association de ce secteur en Europe. \n\nElle traite de tous les aspects professionnels de l’information-documentation : techniques, services, métiers, droit, politiques, industries, etc."}, {"t": "ICA Code of Ethics", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.ica.org/resource/ica-code-of-ethics/", "tags": [""], "br": "", "coll": "1a Intro archivistique, bibliothéconomie et SI", "abs": ""}, {"t": "IFLA", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.ifla.org/", "tags": [""], "br": "3", "coll": "3.6.1 Associations professionnelles", "abs": ""}, {"t": "IFLA Code of Ethics for Librarians and other Information Workers (full version) – IFLA", "au": "", "y": "", "ty": "post-weblog", "src": "", "link": "https://www.ifla.org/publications/ifla-code-of-ethics-for-librarians-and-other-information-workers-full-version/", "tags": [""], "br": "3", "coll": "3.7 Outils professionnels de base", "abs": ""}, {"t": "IFLA Journal", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/4508/issues/current", "tags": [""], "br": "3", "coll": "3.3.6 International", "abs": "IFLA Journal is an international journal publishing peer reviewed articles on library and information services and the social, political and economic issues that impact access to information through libraries. The Journal publishes research, case studies and essays that reflect the broad spectrum of the profession internationally. All articles are subject to peer review."}, {"t": "IFLA Library", "au": "", "y": "", "ty": "webpage", "src": "", "link": "http://library.ifla.org/", "tags": [""], "br": "3", "coll": "3.2 Bases de données, archives ouvertes", "abs": "Archives ouvertes de l'IFLA, contenant principalement les textes des contributions à la conférence mondiale"}, {"t": "Inclusive Collections, Inclusive Libraries", "au": "Cheung, Melanie", "y": "", "ty": "post-weblog", "src": "", "link": "https://www.rluk.ac.uk/icil-on-demand/", "tags": [""], "br": "3", "coll": "3.6.2 Blogs", "abs": "Inclusive Collections, Inclusive Libraries is an RLUK programme of events that aims to foster conversation around decolonisation and inclusive practice in collecting, describing, presenting, and engaging with content in research library collections. It seeks to raise awareness about the opportunities and challenges of dealing with, contextualising, and engaging with offensive collections while also identifying and sharing examples of good practice."}, {"t": "InetBib – Internet in Bibliotheken", "au": "", "y": "", "ty": "post-weblog", "src": "", "link": "https://www.inetbib.de/#", "tags": [""], "br": "3", "coll": "3.7.1 Listes de diffusion", "abs": ""}, {"t": "Info | swiss-lib@lists.switch.ch - mailman.switch.ch", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://mailman.switch.ch/postorius/lists/swiss-lib.lists.switch.ch/", "tags": [""], "br": "3", "coll": "3.7.1 Listes de diffusion", "abs": ""}, {"t": "Information and Organization", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/7912/issues/471909512?sort=title", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques", "abs": "Information and Organization seeks to publish original scholarly articles on the relationships between information technologies and social organization."}, {"t": "Information Processing & Management", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/6226/issues/current?sort=title", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques", "abs": "Information Processing and Management publishes cutting-edge original research at the intersection of computing and information science concerning theory, methods, or applications in a range of domains, including but not limited to advertising, business, health, information science, information technology marketing, and social computing."}, {"t": "Information Retrieval", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/7409/issues/current?sort=title", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques", "abs": "The journal provides an international forum for the publication of theory, algorithms, analysis and experiments across the broad area of information retrieval. Topics of interest include search, indexing, analysis, and evaluation for applications such as the web, social and streaming media, recommender systems, and text archives. This includes research in areas such as human factors, artificial intelligence, and domain-specific challenges in information retrieval."}, {"t": "Information Science & Technology Abstracts | EBSCO", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.ebsco.com/products/research-databases/information-science-technology-abstracts", "tags": [""], "br": "1", "coll": "1.2 Bases de données, archives ouvertes", "abs": "Information Science & Technology Abstracts (ISTA) is the oldest continuously produced information science database. It provides indexing and abstracts for articles, books, research reports and conference proceedings, plus ongoing coverage of the most important periodicals in the field."}, {"t": "Information Services & Use", "au": "", "y": "", "ty": "book", "src": "", "link": "https://www.iospress.com/catalog/journals/information-services-use", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques", "abs": "Information Services & Use is an information and information technology oriented publication with a wide scope of subject matters. International in terms of both audience and authorship, the journal aims at leaders in information management and applications in an attempt to keep them fully informed of fast-moving developments in fields such as: online systems, offline systems, electronic publishing, library automation, education and training, word processing and telecommunications."}, {"t": "Information: Wissenschaft & Praxis", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/32729/issues/current?sort=title", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques; 3.3.3 Allemagne", "abs": "Die „richtige Information zum richtigen Zeitpunkt am richtigen Ort‟ – eine Forderung, die sich nur erfüllen lässt, wenn inhaltliche, informationstechnische und methodische Kompetenz zusammen kommen.\n\nInformation – Wissenschaft & Praxis (iwp) ist die Fachzeitschrift für den Einsatz moderner Informations- und Kommunikationstechnologien in den zentralen Stellen der Informationsversorgung von Firmen, Bibliotheken, Archiven, Verlagen, Verwaltungen und Dokumentationen."}, {"t": "Informationskompentenz - Schweiz", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.informationskompetenz.ch/de/", "tags": [""], "br": "1", "coll": "1.6 Sites web", "abs": ""}, {"t": "Informationswissenschaft: Theorie, Methode und Praxis", "au": "", "y": "", "ty": "book", "src": "", "link": "https://bop.unibe.ch/iw/index", "tags": [""], "br": "3", "coll": "3.3.1 Suisse", "abs": "Informationswissenschaft: Theorie, Methode und Praxis / Sciences de l’information: théorie, méthode et pratique ist als Zeitschrift aus dem Weiterbildungsprogramm in Archiv-, Bibliotheks- und Informationswissenschaft der Universitäten Bern und Lausanne heraus entstanden. In Bänden zuammengefasst erscheinen Artikel von Absolvent/innen des Weiterbildungsprogramms sowie von Dozierenden und weiteren Autor/innen aus dem Feld der Informationswissenschaften. Die Zeitschrift ist universitär verankert, mehrsprachig und interdisziplinär ausgerichtet."}, {"t": "International Association of Sound and Audiovisual Archives", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.iasa-web.org/", "tags": [""], "br": "2", "coll": "2.6 Sites web", "abs": ""}, {"t": "International Council on Archives", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.ica.org/en", "tags": [""], "br": "2", "coll": "2.6 Sites web", "abs": ""}, {"t": "International Federation of Film Archives", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.fiafnet.org/", "tags": [""], "br": "2", "coll": "2.6 Sites web", "abs": ""}, {"t": "International Journal of Multimedia Information Retrieval", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/5690/issues/current?sort=title", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques", "abs": "The International Journal of Multimedia Information Retrieval (IJMIR) is a scholarly archival journal publishing original, peer-reviewed research contributions. Its editorial board strives to present the most important research results in areas within the field of multimedia information retrieval.  Core areas include exploration, search, and mining in general collections of multimedia consisting of information from the WWW to scientific imaging to personal archives."}, {"t": "International Journal on Digital Libraries", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/4053/issues/current", "tags": [""], "br": "3", "coll": "3.3.6 International", "abs": "This journal examines the theory and practice of acquisition, definition, organization, management, and dissemination of digital information via global networking. It emphasizes issues in digital information production, management, and use; high-speed networks and connectivity; interoperability and seamless integration of information, people, profiles, tasks, and needs; security and privacy of individuals and business transactions; and effective business processes."}, {"t": "Internet Archive", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://archive.org/", "tags": [""], "br": "2", "coll": "2.6 Sites web", "abs": ""}, {"t": "Introduction to Data Mining eBook: Global Edition", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.pearson.de/introduction-to-data-mining-ebook-global-edition-9780273775324", "tags": [""], "br": "", "coll": "2c Information Retrieval", "abs": "Introduction to Data Mining presents fundamental concepts and algorithms for those learning data mining for the first time. Each concept is explored thoroughly and supported with numerous examples. The text requires only a modest background in mathematics. Each major topic is organised into two chapters, beginning with basic concepts that provide necessary background for understanding each data mining technique, followed by more advanced concepts and algorithms.   The full text downloaded to your computer  With eBooks you can:        search for key concepts, words and phrases       make highlights and notes as you study       share your notes with friends     eBooks are downloaded to your computer and accessible either offline through the Bookshelf (available as a free download), available online and also via the iPad and Android apps.   Upon purchase, you'll gain instant access to this eBook.  Time limit  The&nbsp;eBooks products do not have an expiry date. You will continue to access your&nbsp;digital&nbsp;ebook&nbsp;products whilst you have your&nbsp;Bookshelf installed."}, {"t": "ISO 30300:2020(fr), Information et documentation — Systèmes de gestion des documents d'activité — Principes essentiels et vocabulaire", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.iso.org/obp/ui/#iso:std:iso:30300:ed-2:v1:fr", "tags": [""], "br": "1", "coll": "1.4 Dictionnaires, encyclopédies; 3.4 Dictionnaires, encyclopédies", "abs": ""}, {"t": "Italian Journal of Library, Archives, and Information Science / Rivista italiana di biblioteconomia, archivistica e scienza dell’informazione", "au": "", "y": "", "ty": "book", "src": "", "link": "https://jlis.it/index.php/jlis", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques; 3.3.4 Italie; 2.3 Revues, périodiques", "abs": "JLIS.it is an academic journal of international scope, peer-reviewed and open access, aiming to valorise international research in Library and Information Science."}, {"t": "Jean-Philippe Accart: site dédié aux professionnels de l'information-documentation", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.jpaccart.ch/", "tags": [""], "br": "3", "coll": "3.6.2 Blogs", "abs": ""}, {"t": "Journal of Critical Library and Information Studies", "au": "", "y": "", "ty": "book", "src": "", "link": "https://journals.litwinbooks.com/index.php/jclis/index", "tags": [""], "br": "3", "coll": "3.3.6 International", "abs": "The Journal of Critical Library and Information Studies aims to showcase innovative research that queries and critiques current and prevailing paradigms in library and information studies, in theory and practice through critical approaches and perspectives that originate from across the humanities and social sciences. JCLIS is committed to supplying a platform for the publication of rigorous inter-/multi-/trans-disciplinary research that might be otherwise marginalized from dominant discourses."}, {"t": "Journal of Documentation", "au": "", "y": "", "ty": "book", "src": "", "link": "https://www.emerald.com/insight/publication/issn/0022-0418/vol/78/iss/7", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques", "abs": "Journal of Documentation provides a unique focus on theories, concepts, models, frameworks and philosophies related to documents and recorded knowledge."}, {"t": "Journal of Information Ethics", "au": "", "y": "", "ty": "book", "src": "", "link": "https://mcfarlandbooks.com/imprint/journal-of-information-ethics/", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques", "abs": "From the ethics of Caller ID to transmission of sexually explicit materials via Internet, the information age presents a barrage of ethical challenges. In this acclaimed twice-yearly journal, some of the brightest and most influential figures in the information sciences confront a broad range of these transdisciplinary issues."}, {"t": "Journal of Information Science", "au": "", "y": "", "ty": "book", "src": "", "link": "https://journals.sagepub.com/home/jis", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques", "abs": "The Journal of Information Science is a peer-reviewed international journal of high repute covering topics of interest to all those researching and working in the sciences of information and knowledge management. The Editors welcome material on any aspect of information science theory, policy, application or practice that will advance thinking in the field"}, {"t": "Journal of Librarianship and Information Science", "au": "", "y": "", "ty": "book", "src": "", "link": "https://journals.sagepub.com/home/lis", "tags": [""], "br": "3", "coll": "3.3.6 International", "abs": "Journal of Librarianship and Information Science (JOLIS) is the peer-reviewed international quarterly journal for librarians, information scientists, specialists, managers and educators interested in keeping up to date with the most recent issues and developments in the field."}, {"t": "Journal of Librarianship and Scholarly Communication", "au": "", "y": "", "ty": "book", "src": "", "link": "https://iastatedigitalpress.com/jlsc/", "tags": [""], "br": "3", "coll": "3.3.5 USA / UK", "abs": "JLSC is particularly interested in the intersection of librarianship and publishing, and the resulting roles for libraries in both content dissemination and content creation. The scholarly communications system is global and the solutions to challenges are likely to be globally relevant. JLSC pursues a global authorship and aims at a global readership."}, {"t": "Journal of New Librarianship", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/262106/issues/current", "tags": [""], "br": "3", "coll": "3.3.5 USA / UK", "abs": "There is a need to offer high-quality literature in the library and information science (LIS) field in an open, independently-produced journal. The JoNL represents the belief that the library serves a critical role in advocating and modeling free, open, and sustainable access to information for the academe and its future. The JoNL provides an outlet that mixes both traditional and disruptive forms of scholarly and professional communication that forge innovative paths in the way that the LIS profession shares and leads. Our goal is to provide a publishing venue for emerging and interdisciplinary scholarship that does not fit within the narrow subject specialization of existing journals."}, {"t": "Journal of Radical Librarianship", "au": "", "y": "", "ty": "book", "src": "", "link": "https://journal.radicallibrarianship.org/index.php/journal/index", "tags": [""], "br": "3", "coll": "3.3.6 International", "abs": "Journal of Radical Librarianship is an open access journal publishing high quality, rigorously reviewed and innovative scholarly work in the field of radical librarianship. It also publishes non-peer reviewed reports, commentary, and reviews. The scope of the journal is any work that contributes to a discourse around critical library and information theory and practice. The subject areas listed below should be regarded as indicative rather than exhaustive."}, {"t": "Journal of the Association for Information Science and Technology (JASIST)", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/38053/issues/current?sort=title", "tags": [""], "br": "1", "coll": "1.3 Revues, périodiques", "abs": "The Journal of the Association for Information Science and Technology (JASIST) is a leading international forum for peer-reviewed research in information science. For more than half a century, JASIST has provided intellectual leadership by publishing original research that focuses on the production, discovery, recording, storage, representation, retrieval, presentation, manipulation, dissemination, use, and evaluation of information and on the tools and techniques associated with these processes."}, {"t": "JournalTOCs", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.journaltocs.ac.uk/", "tags": [""], "br": "1", "coll": "1.2 Bases de données, archives ouvertes; 3.2 Bases de données, archives ouvertes", "abs": "The largest, free collection of scholarly journal Tables of Contents"}, {"t": "L' archiviste humaniste : rôles et positionnement institutionnel et sociétal", "au": "http://www.ixmedia.com, iXmédia-", "y": "", "ty": "webpage", "src": "", "link": "https://www.puq.ca/catalogue/themes/archiviste-humaniste-roles-positionnement-institutionnel-societal-4473.html", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Si la fonction d’archiviste existe depuis la Haute Antiquité, la profession d’archiviste, elle, est relativement récente et ne cesse d’évoluer au fil des besoins des utilisateurs et des transformations technologiques. Le présent ouvrage vise à re..."}, {"t": "La gestion documentaire au coeur des processus d’affaires – ISTE Editions", "au": "Yhello", "y": "", "ty": "post-weblog", "src": "", "link": "https://www.istegroup.com/fr/produit/la-gestion-documentaire-au-coeur-des-processus-daffaires/", "tags": [""], "br": "4", "coll": "4. Bibliographies de modules", "abs": "Cet ouvrage s’intéresse aux documents d’activité et présente en détail les normes de gestion documentaire, notamment les ISO 15489 et 30300."}, {"t": "La métamorphose des archives. 1990-2020", "au": "Collectif", "y": "", "ty": "book", "src": "", "link": "https://shs.cairn.info/la-metamorphose-des-archives--9782111740068?lang=fr", "tags": [""], "br": "2", "coll": "2.5 Ouvrages et articles", "abs": "Analyse et enjeux du droit d'accès aux archives Matière indispensable, miroir de la mémoire de la Nation, des territoires, des femmes et des hommes, les archives sont, par essence, le matériau principal de tous les historiens. Ce livr  Librarianship", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/3177/issues/current", "tags": [""], "br": "3", "coll": "3.3.6 International", "abs": "The Journal of Academic Librarianship, an international and refereed journal, publishes articles that focus on problems and issues germane to college and university libraries. JAL provides a forum for authors to present research findings and their practical applications and significance; analyze policies, practices, issues, and trends; speculate about the future of academic librarianship; present analytical bibliographic essays and philosophical treatises. JAL also provides special features in each issue which include information on academic library technology issues, research in international librarianship, digests of special reports, and a guide to sources and analysis of library metrics."}, {"t": "The Library Quarterly", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/33309/issues/current", "tags": [""], "br": "3", "coll": "3.3.5 USA / UK", "abs": "The Library Quarterly (LQ) embraces a wide array of original research perspectives, approaches, and quantitative, qualitative, evaluative, analytic, and mixed methodology to assess the role of libraries in communities and in society. Through unique and innovative content that positions libraries at the nexus of information, community, and policy, LQ publishes cutting-edge articles, essays, editorials, and reviews that inform, enable, equalize, lead, and empower our field to adapt to changes. Across these areas, all content in the journal ties to contemporary issues impacting libraries and librarianship."}, {"t": "The value of libraries for research and researchers", "au": "RIN; RLUK", "y": "", "ty": "document", "src": "", "link": "https://www.rluk.ac.uk/wp-content/uploads/2014/02/Value-of-Libraries-report.pdf", "tags": [""], "br": "", "coll": "2a Communication, Relations publiques et gestion des connaissances", "abs": ""}, {"t": "Verbände in Deutschland", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://bibliotheksportal.de/informationen/verbaende-einrichtungen/bibliotheksverbaende-in-deutschland", "tags": [""], "br": "3", "coll": "3.6.1 Associations professionnelles", "abs": "Verbände und Einrichtungen in Deutschland – eine Auswahl BID, dbv, VDB – für „Insider“ eine Selbstverständlichkeit, für Außenstehende jedoch stellen die bibliothekarischen Verbände häufig nur eine unübersichtliche und schwer durchschaubare Sammlung von Abkürzungen dar. Unsere Übersicht über die Berufs- und Interessensverbände des deutschen Bibliothekswesens soll Ihnen dazu Informationen vermitteln und einen strukturierten Überblick über die einzelnen Einrichtungen geben. Dabei werden […]"}, {"t": "VIAF", "au": "", "y": "", "ty": "webpage", "src": "", "link": "http://viaf.org/", "tags": [""], "br": "3", "coll": "3.7 Outils professionnels de base", "abs": ""}, {"t": "World Guide to Libraries", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.degruyter.com/database/WGTL/html", "tags": [""], "br": "3", "coll": "3.7 Outils professionnels de base", "abs": "The comprehensive World Guide to Libraries contains current addresses and detailed information on the holdings of a total of approx. 42,500 libraries in more than 200 countries. Covered are national libraries, academic libraries, university libraries including specialized and institute libraries, school and college libraries, the libraries of authorities, churches and companies, special libraries of other patronage and public libraries. Besides contact details, entries include information regarding inter-library lending, library director, book, periodical and manuscript holdings, special holdings, areas of collection and much more. Key Features: No other reference work includes all library types covering the whole world Information details: addresses, library head, details of holdings, special collections, membership of national or international organizations etc. are indicated Up to date information due to extensive mailing of questionnaires and permanent editorial work with national library guides and other resources"}, {"t": "WorldCat Identities", "au": "", "y": "", "ty": "webpage", "src": "", "link": "http://www.worldcat.org/identities/", "tags": [""], "br": "3", "coll": "3.7 Outils professionnels de base", "abs": ""}, {"t": "WorldCat.org : le plus grand catalogue de bibliothèques au monde", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.worldcat.org/", "tags": [""], "br": "0", "coll": "0. Sources - recherche d'information et de documentation", "abs": ""}, {"t": "Zeitschrift für Bibliothekswesen und BibliographieZeitschrift für Bibliothekswesen und Bibliographie", "au": "", "y": "", "ty": "book", "src": "", "link": "https://browzine.com/libraries/528/journals/315560/issues/current", "tags": [""], "br": "3", "coll": "3.3.3 Allemagne", "abs": ""}, {"t": "Zeitschriftenliste nach Fachgebiet | Elektronische Zeitschriftenbibliothek", "au": "", "y": "", "ty": "webpage", "src": "", "link": "http://ezb.uni-regensburg.de/", "tags": [""], "br": "3", "coll": "3.3 Revues, périodiques", "abs": "Accès aux journaux életcroniques"}, {"t": "Zeittafel zur internationalen Entwicklung des Informationswesens nach 1945", "au": "Saarbrücken, Fachrichtung Informationswissenschaft", "y": "", "ty": "post-weblog", "src": "", "link": "https://saar.infowiss.net/fachschaft/bufata-1996/thesen-heinz-marloth/", "tags": [""], "br": "1", "coll": "1.5.1 Documentation de base", "abs": "Archiv der Website der Informationswissenschaft Saarbrücken"}, {"t": "École de bibliothéconomie et des sciences de l'information - Université de Montréal", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://ebsi.umontreal.ca/accueil/", "tags": [""], "br": "2", "coll": "2.6 Sites web", "abs": ""}, {"t": "École nationale des chartes", "au": "", "y": "", "ty": "webpage", "src": "", "link": "https://www.chartes.psl.eu/fr", "tags": [""], "br": "2", "coll": "2.6 Sites web", "abs": ""}];

var LABELS = {{"article-journal": "Zeitschriftenartikel", "book": "Buch", "chapter": "Buchkapitel", "paper-conference": "Konferenzbeitrag", "thesis": "Abschlussarbeit", "report": "Bericht", "webpage": "Webseite", "post-weblog": "Blog", "post": "Forum", "document": "Dokument", "manuscript": "Manuskript", "speech": "Vortrag", "software": "Software", "motion_picture": "Video", "song": "Audio", "broadcast": "Podcast", "article": "Artikel", "article-newspaper": "Zeitungsartikel", "article-magazine": "Magazinartikel", "entry-encyclopedia": "Lexikonartikel", "entry-dictionary": "Wörterbucheintrag", "dataset": "Datensatz", "standard": "Norm", "patent": "Patent", "interview": "Interview", "graphic": "Bild", "map": "Karte", "personal_communication": "Persönl. Mitteilung", "legal_case": "Rechtsfall", "legislation": "Gesetz", "hearing": "Anhörung"}};
var BRANCH = {'0':'0 · Quellen','1':'1 · Informationswissenschaft','2':'2 · Archivistik','3':'3 · Bibliothekswissenschaft','4':'4 · Modulbibliografien','':'ohne Sammlung'};

var state = {q:'', type:'all', year:'all', branch:'all', sort:'year'};

function colorOf(t){
  var m = {'article-journal':'#b8742a','book':'#1f6f6b','chapter':'#8a4f9c','paper-conference':'#4f8a3c','thesis':'#c0503a','report':'#2f6fbf','webpage':'#5b6b7a','post-weblog':'#5b6b7a','document':'#7a7062'};
  return m[t] || '#7a7062';
}

function searchStr(it){
  return (it.t + ' ' + it.au + ' ' + it.src + ' ' + it.tags.join(' ') + ' ' + it.coll + ' ' + it.abs).toLowerCase();
}

function matches(it){
  if(state.q && searchStr(it).indexOf(state.q.toLowerCase()) < 0) return false;
  if(state.type !== 'all' && it.ty !== state.type) return false;
  if(state.year !== 'all' && it.y !== state.year) return false;
  if(state.branch !== 'all' && it.br !== state.branch) return false;
  return true;
}

function card(it){
  var d = document.createElement('div'); d.className = 'entry';
  var head = document.createElement('div');
  var badge = document.createElement('span'); badge.className='badge'; badge.textContent = LABELS[it.ty]||it.ty;
  badge.style.color = colorOf(it.ty); badge.style.borderColor = colorOf(it.ty);
  head.appendChild(badge);
  if(it.br && it.br !== ''){
    var b = document.createElement('span'); b.className='branch'; b.textContent = BRANCH[it.br]||it.br; head.appendChild(b);
  }
  d.appendChild(head);
  var title = document.createElement('div'); title.className='title';
  if(it.link){
    var a = document.createElement('a'); a.href=it.link; a.target='_blank'; a.rel='noopener'; a.textContent=it.t; title.appendChild(a);
  } else { title.textContent = it.t; }
  d.appendChild(title);
  var meta = document.createElement('div'); meta.className='meta';
  var parts = [];
  if(it.au) parts.push(it.au);
  if(it.y) parts.push(it.y);
  if(it.src) parts.push(it.src);
  meta.textContent = parts.join(' · ');
  d.appendChild(meta);
  if(it.tags && it.tags.length && it.tags[0]){
    var tg = document.createElement('div'); tg.className='tags';
    for(var i=0;i<it.tags.length && i<5;i++){ var s=document.createElement('span'); s.className='chip'; s.textContent=it.tags[i]; tg.appendChild(s); }
    d.appendChild(tg);
  }
  if(it.abs){
    var abs = document.createElement('p'); abs.className='abs';
    var full = it.abs; var short = full.length>260 ? full.slice(0,260)+' …' : full;
    abs.textContent = short;
    d.appendChild(abs);
    if(full.length>260){
      var btn = document.createElement('button'); btn.className='more'; btn.textContent='Mehr';
      btn.onclick = function(){
        if(btn.getAttribute('data-open')==='1'){ abs.textContent=short; btn.textContent='Mehr'; btn.setAttribute('data-open','0'); }
        else { abs.textContent=full; btn.textContent='Weniger'; btn.setAttribute('data-open','1'); }
      };
      d.appendChild(btn);
    }
  }
  return d;
}

function render(){
  var list = DATA.filter(matches);
  if(state.sort==='title'){ list.sort(function(a,b){ return a.t.toLowerCase() < b.t.toLowerCase() ? -1 : 1; }); }
  else if(state.sort==='author'){ list.sort(function(a,b){ return a.au < b.au ? -1 : 1; }); }
  else { list.sort(function(a,b){ return (b.y||'0') - (a.y||'0'); }); }
  var box = document.getElementById('results');
  box.innerHTML = '';
  document.getElementById('count').textContent = list.length + ' von ' + DATA.length + ' Einträgen';
  if(list.length===0){ var e=document.createElement('div'); e.className='empty'; e.textContent='Keine Treffer.'; box.appendChild(e); return; }
  for(var i=0;i<list.length;i++){ box.appendChild(card(list[i])); }
}

function populate(){
  var types = {}; var years = {};
  DATA.forEach(function(it){ types[it.ty]=1; if(it.y) years[it.y]=1; });
  var tsel = document.getElementById('f-type');
  Object.keys(types).sort(function(a,b){ return (LABELS[a]||a) < (LABELS[b]||b) ? -1 : 1; }).forEach(function(t){
    var o=document.createElement('option'); o.value=t; o.textContent=LABELS[t]||t; tsel.appendChild(o);
  });
  var ysel = document.getElementById('f-year');
  Object.keys(years).sort(function(a,b){ return b-a; }).forEach(function(y){
    var o=document.createElement('option'); o.value=y; o.textContent=y; ysel.appendChild(o);
  });
}

document.getElementById('q').addEventListener('input', function(e){ state.q=e.target.value; render(); });
document.getElementById('f-type').addEventListener('change', function(e){ state.type=e.target.value; render(); });
document.getElementById('f-year').addEventListener('change', function(e){ state.year=e.target.value; render(); });
document.getElementById('f-branch').addEventListener('change', function(e){ state.branch=e.target.value; render(); });
document.getElementById('f-sort').addEventListener('change', function(e){ state.sort=e.target.value; render(); });
document.getElementById('reset').addEventListener('click', function(){
  state = {q:'', type:'all', year:'all', branch:'all', sort:'year'};
  document.getElementById('q').value=''; document.getElementById('f-type').value='all';
  document.getElementById('f-year').value='all'; document.getElementById('f-branch').value='all';
  document.getElementById('f-sort').value='year';
  render();
});

populate();
render();
</script>
