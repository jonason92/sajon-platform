name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (real bugs only, pragmatic)
        run: ruff check . --select F821,F811,F822,F823 --ignore E501 --exclude _site,book/_build,works/*/_build
      - name: Syntax check (py_compile)
        run: python -m compileall -q *.py
